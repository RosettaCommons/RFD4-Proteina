# @package _global_
#
# Minimal AE training config: Muon optimizer, AFDB monomer only, single GPU.
# Used as the default training_ae experiment
#
# Run: python rfproteina/partial_autoencoder/train.py --config-name training_ae \
#        +single=true +nolog=true +show_prog_bar=true

defaults:
  - /datasets/train/ae/afdb_monomer@datasets.train.afdb_monomer
  - /design_tasks/presets@_unconditional_design_tasks: unconditional
  - /datasets/val/unconditional@datasets.val.unconditional
  # (Hydra requires `override` entries last in the defaults list.)
  # Mount no mix: this recipe trains on afdb_monomer alone.
  - override /datasets@datasets: none
  - _self_

run_name_: ae_muon_afdb_monomer_only

hardware:
  ngpus_per_node_: 1
  nnodes_: 1
  ncpus_per_task_train_: 8

dataloaders:
  num_workers: 2
  train:
    dataloader_params:
      batch_size: 2
      collate_fn:
        fixed_dimensions: {I: 384}

log:
  tags: ["ae", "muon", "afdb-monomer-only"]
  projection_every_n: 100000
  log_every_n_steps: 1

datasets:
  train:
    afdb_monomer:
      probability: 1.0
      dataset:
        transform:
          crop_size: 512
          design_tasks: ${_unconditional_design_tasks}
  val:
    unconditional:
      dataset:
        num_replicates: 1

opt:
  val_every_n_epochs: 1
