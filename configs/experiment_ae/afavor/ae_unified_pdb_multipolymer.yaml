# @package _global_

defaults:
  - override /nn_ae@nn_ae: nn_60m_unified
  - override /datasets@datasets: ae_pdb_multipolymer_datasets
  - _self_

run_name_: ae_unified_pdb_multipolymer


dataloaders:
  train:
    dataloader_params:
      batch_size: 12
      collate_fn:
        fixed_dimensions: {I: 384}

datasets:
  train:
    pdb_interfaces:
      weights:
        alphas:
          a_prot: 3.0
          a_nuc: 4.0
          a_ligand: 1.0
          a_loi: 5.0
    pdb_pn_units:
      weights:
        alphas:
          a_prot: 3.0
          a_nuc: 4.0
          a_ligand: 1.0
          a_loi: 5.0


log:
  tags: ["ae", "60m", "unified", "pdb", "multipolymer", "rna", "dna"]
