# @package _global_
#
# Frozen AE recipe for test_ae_training_regression. Pins the exact data the committed
# baselines were generated from, so changes to the shared sources cannot move the losses.
# Read `experiment_ae/ae_sota` for current practice.
#
# Dataset order is load-bearing: it fixes each dataset's index in the mixture, so a fixed
# seed draws different examples if the order changes.

defaults:
  - /datasets/train/backend_pandas@datasets.train.rna_monomer.dataset
  - /datasets/train/backend_pandas@datasets.train.pdb_interfaces.dataset
  - /datasets/train/backend_pandas@datasets.train.pdb_pn_units.dataset
  - /datasets/train/backend_pandas@datasets.train.na_complex.dataset
  - /design_tasks/presets@datasets.train.rna_monomer.dataset.transform.design_tasks: unconditional
  - /design_tasks/presets@datasets.train.pdb_interfaces.dataset.transform.design_tasks: unconditional
  - /design_tasks/presets@datasets.train.pdb_pn_units.dataset.transform.design_tasks: unconditional
  - /design_tasks/presets@datasets.train.na_complex.dataset.transform.design_tasks: unconditional
  # (Hydra requires `override` entries last in the defaults list.)
  - override /nn_ae@nn_ae: nn_60m_unified
  # Mount no dataset leaves: every dataset below is defined here in full.
  - override /datasets@datasets: none
  - _self_

run_name_: ae_regression
pretrain_ckpt_path: null

hardware:
  ngpus_per_node_: 8
  nnodes_: 2

dataloaders:
  train:
    dataloader_params:
      batch_size: 12
      collate_fn:
        fixed_dimensions: {I: 384}

log:
  tags: ["ae", "regression"]

datasets:
  train:
    rna_monomer:
      probability: 0.10
      dataset:
        name: rna_monomer_ae
        data: ${oc.env:DATA_PATH}/train_datasets/rna_monomer/rna_monomer.parquet
        loader:
          base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/rna_monomer
          parser_args:
            _target_: rfproteina.utils.parse_presets.distillation
            load_standard_annotations: False
            cache_dir: ${oc.env:LOCAL_DRIVE_MOUNT,/tmp}/${oc.env:USER,shared}/atomworks_parse_cache
        columns_to_load: [example_id, path, cluster_id, seq_hash, overall_plddt, overall_pde, overall_pae]
        transform: {crop_size: "${dataloaders.train.dataloader_params.collate_fn.fixed_dimensions.I}"}

    pdb_interfaces:
      probability: 0.45
      weights:
        _target_: atomworks.ml.samplers.calculate_weights_for_pdb_dataset_df
        cluster_column: interface_cluster
        altloc_seed_column: altloc_seed
        pdb_id_column: pdb_id
        beta: 1.0
        alphas: {a_prot: 3.0, a_nuc: 4.0, a_ligand: 1.0, a_loi: 5.0}
      dataset:
        name: pdb_interfaces_ae_multipolymer
        data: ${oc.env:DATA_PATH}/train_datasets/pdb/pdb_interfaces.parquet
        memory_map: True
        loader:
          _target_: atomworks.ml.datasets.loaders.create_loader_with_query_pn_units
          base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/pdb
          pn_unit_iid_colnames: ["pn_unit_1_iid", "pn_unit_2_iid"]
          example_id_colname: example_id
          assembly_id_colname: assembly_id
          altloc_seed_colname: null
          parser_args:
            _target_: rfproteina.utils.parse_presets.distillation
            load_standard_annotations: False
            cache_dir: ${oc.env:LOCAL_DRIVE_MOUNT,/tmp}/${oc.env:USER,shared}/atomworks_parse_cache
            save_to_cache: True
            load_from_cache: True
        filters:
          - "deposition_date < '2024-01-01'"
          - "resolution < 9.0"
          - "num_polymer_pn_units <= 30"
          - "interface_cluster.notnull()"
          - "~(pn_unit_1_non_polymer_res_names.notnull() and pn_unit_1_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
          - "~(pn_unit_2_non_polymer_res_names.notnull() and pn_unit_2_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
          - "is_inter_molecule"
        columns_to_load: [example_id, pdb_id, assembly_id, altloc_seed, path, deposition_date, resolution,
                          num_polymer_pn_units, method, interface_cluster, n_prot, n_nuc, n_ligand, n_peptide,
                          total_num_atoms_in_unprocessed_assembly, pn_unit_1_iid, pn_unit_2_iid,
                          pn_unit_1_non_polymer_res_names, pn_unit_2_non_polymer_res_names, is_inter_molecule,
                          all_pn_unit_iids_after_processing, involves_loi, pn_unit_1_type, pn_unit_2_type]
        transform: {crop_size: "${dataloaders.train.dataloader_params.collate_fn.fixed_dimensions.I}"}

    pdb_pn_units:
      probability: 0.35
      weights:
        _target_: atomworks.ml.samplers.calculate_weights_for_pdb_dataset_df
        cluster_column: cluster
        altloc_seed_column: altloc_seed
        pdb_id_column: pdb_id
        beta: 0.5
        alphas: {a_prot: 3.0, a_nuc: 4.0, a_ligand: 1.0, a_loi: 5.0}
      dataset:
        name: pdb_pn_units_ae_multipolymer
        data: ${oc.env:DATA_PATH}/train_datasets/pdb/pdb_pn_units.parquet
        memory_map: True
        loader:
          _target_: atomworks.ml.datasets.loaders.create_loader_with_query_pn_units
          base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/pdb
          pn_unit_iid_colnames: ["q_pn_unit_iid"]
          example_id_colname: example_id
          assembly_id_colname: assembly_id
          altloc_seed_colname: null
          parser_args:
            _target_: rfproteina.utils.parse_presets.distillation
            load_standard_annotations: False
            cache_dir: ${oc.env:LOCAL_DRIVE_MOUNT,/tmp}/${oc.env:USER,shared}/atomworks_parse_cache
            save_to_cache: True
            load_from_cache: True
        filters:
          - "deposition_date < '2024-01-01'"
          - "resolution < 9.0"
          - "num_polymer_pn_units <= 30"
          - "cluster.notnull()"
          - "pdb_id not in ${resolve_import:atomworks.ml.preprocessing.constants,PDB_IDS_WITH_UNPHYSICAL_BONDS}"
          - "~(q_pn_unit_non_polymer_res_names.notnull() and q_pn_unit_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
        columns_to_load: [example_id, pdb_id, assembly_id, altloc_seed, path, deposition_date, resolution,
                          num_polymer_pn_units, method, cluster, n_prot, n_nuc, n_ligand, n_peptide,
                          total_num_atoms_in_unprocessed_assembly, q_pn_unit_iid, q_pn_unit_non_polymer_res_names,
                          all_pn_unit_iids_after_processing, q_pn_unit_is_loi]
        transform: {crop_size: "${dataloaders.train.dataloader_params.collate_fn.fixed_dimensions.I}"}

    na_complex:
      probability: 0.10
      dataset:
        name: na_complex_ae
        data: ${oc.env:DATA_PATH}/train_datasets/na_complex/na_complex.parquet
        loader:
          base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/na_complex
          parser_args:
            _target_: rfproteina.utils.parse_presets.distillation
            load_standard_annotations: False
            cache_dir: ${oc.env:LOCAL_DRIVE_MOUNT,/tmp}/${oc.env:USER,shared}/atomworks_parse_cache
        columns_to_load: [example_id, path]
        transform: {crop_size: "${dataloaders.train.dataloader_params.collate_fn.fixed_dimensions.I}"}
