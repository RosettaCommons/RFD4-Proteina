# @package _global_
# Autoencoder training on AFDB + TED dimers, KL annealing, decoder knows token type
# Data: 50% afdb, 50% teddymer (RNA/NA excluded until structure squashes exist)

defaults:
  - /nn_ae/nn_60m_unified@nn_ae
  - override /datasets: ae_5way_datasets
  - _self_

run_name_: ae_5way_kl_anneal

hardware:
  ncpus_per_task_train_: 16
  ngpus_per_node_: 8
  nnodes_: 4  # 4 nodes × 8 GPUs = 32 GPUs

dataloaders:
  train:
    dataloader_params:
      batch_size: 6
      collate_fn:
        fixed_dimensions: {I: 384}

loss:
  kl:
    anneal: true
    patience: 50000  # Linear ramp-up over 50k steps

# Enable flash attention and torch.compile for encoder/decoder
nn_ae:
  use_torch_compile: true
  encoder:
    attention_type: flash
  decoder:
    attention_type: flash

log:
  tags: ["ae", "60m", "unified", "afdb", "teddymer", "kl_anneal", "token_type", "flash", "compile"]
