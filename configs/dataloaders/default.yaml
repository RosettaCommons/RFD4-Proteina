batch_size: 16
num_workers: 16
prefetch_factor: 2
pin_memory: True
multiprocessing_context: 'spawn'

metrics:
  # Per-rank ProcessPoolExecutor for parallel val metrics (design + post-fold)
  # -1 -> all but one available CPU core
  num_workers: -1

train:
  dataloader_params:
    batch_size: ${dataloaders.batch_size}
    num_workers: ${dataloaders.num_workers}
    prefetch_factor: ${dataloaders.prefetch_factor}
    pin_memory: ${dataloaders.pin_memory}
    persistent_workers: True
    in_order: False
    drop_last: True
    multiprocessing_context: ${dataloaders.multiprocessing_context}  
    collate_fn:
      _target_: rfproteina.datapipes.collate.collate_batch
      _partial_: True
      schema: rfproteina.datapipes.schema.proteina.ProteinaDataSample  # Just a string now!
      fixed_dimensions: {I: 256}  # Datasets crop to this by default; see `datasets/train/pipeline_defaults`.
  n_fallback_retries: 4

val:
  dataloader_params:
    batch_size: ${dataloaders.batch_size}
    # Keep some workers free to parallelize design metrics
    num_workers: 2
    prefetch_factor: 1
    pin_memory: ${dataloaders.pin_memory}
    persistent_workers: False
    drop_last: False  # Keep all validation examples
    multiprocessing_context: ${dataloaders.multiprocessing_context}
    collate_fn:
      _target_: rfproteina.datapipes.collate.collate_batch
      _partial_: True
      schema: rfproteina.datapipes.schema.proteina.ProteinaDataSample
      fixed_dimensions: null