# @package _global_

defaults:
  # Train datasets
  # ... protein distillation
  - /datasets/train/distill/afdb_monomer@datasets.train.afdb_monomer
  - /datasets/train/distill/mgnify_june_2025@datasets.train.mgnify_june_2025  # TODO: Kieran only has june 2025 on lustre for now

  # Validation datasets
  # ... unconditional
  # - /datasets/val/mcsa/mcsa_subset@datasets.val.mcsa_subset
  - /datasets/val/unconditional@datasets.val.unconditional


  - _self_

run_name_: motif_scaffold_tiny_debug_multi_node

# Dataset mixing probabilities
datasets:
  train:
    afdb_monomer:
      probability: 0.5
    mgnify_june_2025:
      probability: 0.5
  val:
    unconditional:
      dataset:
        num_replicates: 1  # so it goes fast
    
log:
  tags: ["motif-scaffolding", "pretrain", "baseline", "debug"]
  checkpoint_every_n_epochs: 1
  last_ckpt_every_n_epochs: 1

hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 2

nolog: False
single: False

opt:
  accumulate_grad_batches: 1
  val_check_interval: 10000

callbacks:
  t_bb_loss_monitoring_callback:
    n_buckets: 20
    log_every_n_steps: 1000
    baseline_capture_steps: 1000
    sync_baseline: true

# Pre-training checkpoint to start from (optional)
pretrain_ckpt_path: null

dataloaders:
  batch_size: 8