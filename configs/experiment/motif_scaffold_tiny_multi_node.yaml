# @package _global_

defaults:
  # Train datasets
  # ... protein distillation
  - /datasets/train/distill/afdb_monomer_beta_coil@datasets.train.afdb_monomer

  # Validation datasets
  # ... unconditional
  # - /datasets/val/mcsa/mcsa_subset@datasets.val.mcsa_subset
  - /datasets/val/unconditional@datasets.val.unconditional


  - _self_

run_name_: motif_scaffold_tiny_debug_multi_node

# Dataset mixing probabilities
datasets:
  train:
    afdb_monomer:
      probability: 1.0
  val:
    unconditional:
      dataset:
        num_replicates: 1  # so it goes fast
    
log:
  tags: ["motif-scaffolding", "pretrain", "baseline", "debug"]
  checkpoint_every_n_epochs: 1
  last_ckpt_every_n_epochs: 1

hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 2

nolog: False
single: False

opt:
  accumulate_grad_batches: 1
  val_check_interval: 10000

# Pre-training checkpoint to start from (optional)
pretrain_ckpt_path: null

dataloaders:
  batch_size: 8