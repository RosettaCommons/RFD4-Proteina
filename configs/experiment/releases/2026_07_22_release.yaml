# @package _global_
###################################################################################
# 2026-07-22 release recipe (SOTA training config).
#
# Self-contained collapse of the 4-node run configured in
# experiment/rafi/2026_07_13_runs/4_nodes.yaml, which had previously accumulated a
# long experiment->experiment inheritance chain:
#
#   rafi/2026_07_13_runs/4_nodes
#     -> rafi/2026_07_13_runs_base
#       -> ncorley/pair_trimult_every2
#         -> ncorley/hero_runs_2026_07_02_lw_2p5_2p5_0
#           -> ncorley/hero_runs_2026_07_02_base
#             -> releases/2026_06_12_release_fast_pdb_val_15
#               -> releases/2026_06_12_release
#
# This file folds that entire chain into a single experiment config. It still
# inherits from the shared config groups (datasets, design-task presets, metrics
# oracle), but no longer inherits from any other experiment config.
#
# The data no longer matches the released checkpoint: pdb_interfaces admits
# nucleic-acid-containing assemblies, and ted_dimers is gated on interface quality.
#
# Recipe summary (see the original chain for the full rationale):
#   - Data mix: AFDB monomers 75% (genie3), PDB multiconformer interfaces 15%,
#     omol 4%, plinder 3%, ted_dimers 3%; loss weighting 2.5/2.5/0 across the whole
#     mix via ${_loss_weights}.
#   - Sequential triangle-mult in the pair update every 2nd layer, pair repr widened
#     to 384, triangle-mult hidden dim 196, RMSNorm trunk. (The chain nominally asked
#     for 256, but `nn.tri_mult_c` never reached PairReprUpdate until the plumbing fix,
#     so every run in the chain -- and the released checkpoint -- is 196. Value pinned
#     here to what the checkpoint actually is; see the note on tri_mult_c below.)
#   - Conditioning: RASA p=0.6, hbond p=0.2, not-cysteine p=0.05, secondary-structure
#     p=0.1, and 25% internal-coordinate conditioning (${_p_internal_coords}) on every
#     supporting+active design task across the mix.
#   - Online validation: pdb_val_15 benchmark set plus disco_subset and afdb_ss;
#     sm_binder_hbonds dropped. AF3 refolding oracle.
#
# Only settings that actually differ from what the defaults above produce are set
# below; redundant overrides have been pruned.
###################################################################################

defaults:
  # Train datasets
  - /datasets/train/flow/afdb_monomer@datasets.train.afdb_monomer
  - /datasets/train/flow/omol@datasets.train.omol
  - /datasets/train/flow/plinder@datasets.train.plinder
  - /datasets/train/flow/ted_dimers@datasets.train.ted_dimers

  # Validation datasets
  - /datasets/val/unconditional@datasets.val.unconditional
  - /datasets/val/motif_scaffolding/unindexed_motif_scaffold_subset@datasets.val.unindexed_motif_scaffold_subset
  - /datasets/val/motif_scaffolding/indexed_motif_scaffold_subset@datasets.val.indexed_motif_scaffold_subset
  - /datasets/val/mcsa/mcsa_subset@datasets.val.mcsa_subset
  - /datasets/val/mcsa/mcsa_subset_fixed_ligand@datasets.val.mcsa_subset_fixed_ligand
  - /datasets/val/mcsa/mcsa_subset_no_ligand@datasets.val.mcsa_subset_no_ligand
  - /datasets/val/sm_binder@datasets.val.sm_binder
  - /datasets/val/sm_binder_fixed_ligand@datasets.val.sm_binder_fixed_ligand
  - /datasets/val/sm_binder_hbonds@datasets.val.sm_binder_hbonds
  - /datasets/val/rasa_IAI@datasets.val.rasa_IAI
  - /datasets/val/rasa_atomized_residues@datasets.val.rasa_atomized_residues
  - /datasets/val/ppi_subset@datasets.val.ppi_subset

  # Design task presets. Loaded at the shared `_tip_atom_design_tasks` anchor
  # (referenced below); afdb_monomer's own selection is replaced further down, so the
  # per-task p_internal_coords overlay in `_self_` merges onto the expanded preset.
  - /design_tasks/presets@_tip_atom_design_tasks: tip_atom_pocket_tasks

  # PDB multiconformer interfaces train dataset
  - /datasets/train/flow/pdb_interfaces@datasets.train.pdb_interfaces

  # Additional online-validation benchmarks
  - /datasets/val/disco_subset@datasets.val.disco_subset
  - /datasets/val/afdb_ss@datasets.val.afdb_ss

  # AF3 refolding oracle
  - override /metrics/refolding_oracles: af3

  # afdb_monomer's dataset config selects `motif_pretraining`; this recipe trains it on the
  # tip-atom pocket mix instead.
  # (Hydra requires `override` entries last in the defaults list.)
  - override /design_tasks/presets@datasets.train.afdb_monomer.dataset.transform.design_tasks: tip_atom_pocket_tasks

  - _self_

run_name_: 2026_07_13_runs_4_nodes

_loss_weights:
  non_standard: 2.5
  unindexed: 2.5
  sampled_tip_atom: 0.0

_p_internal_coords: 0.25

nn:
  norm_type: rmsnorm_torch
  update_pair_repr: True
  use_tri_mult: True
  update_pair_repr_every_n: 2
  pair_repr_dim: 384
  # This recipe uses the original 196-wide triangle multiplication block.
  tri_mult_c: 196
  # feats_seq re-declared in full (Hydra replaces lists) to add "not_cysteine".
  feats_seq: [
    "xt_bb_ca",
    "xt_local_latents",
    "x_sc_bb_ca",
    "x_sc_local_latents",
    "token_type",
    "cond_residue_type",
    "cond_a37coors_nm",
    "cond_a37coors_internal_nm",
    "rasa_binned",
    "secondary_structure",
    "hbond",
    "hotspot",
    "not_cysteine",
    "atom_charge",
    "atomic_element",
    coord_group_seq,
    "chirality",
    "chain_centroid_xyz",
  ]
  feats_pair_repr: [
    "xt_bb_ca_pair_dists",
    "x_sc_bb_ca_pair_dists",
    "bond_mask",
    "bond_order",
    "is_aromatic",
    "index_group_pair",
    "molecule_idx_pair",
    "token_bond_path_length",
    "canonical_polymer_ordering",
  ]

datasets:
  # Conditioning probabilities applied across all design tasks.
  global_design_task_kwargs:
    rasa_kwargs:
      p_add_rasa_condition: 0.6
    hbond_kwargs:
      p_add_hbond_condition: 0.2
    not_cysteine_kwargs:
      p_add_not_cysteine_condition: 0.05
    secondary_structure_kwargs:
      p_add_secondary_structure_condition: 0.1

  # Data mix. `probability` sets the sampling weight; loss_weight_cfg points every
  # dataset at the shared ${_loss_weights}, and p_internal_coords is overlaid on each
  # supporting+active design task.
  train:
    afdb_monomer:
      probability: 0.75
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            tip_atom:
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_partial_ligand:
              transform:
                p_internal_coords: ${_p_internal_coords}
            motif_scaffold:
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_pocket:
              transform:
                p_internal_coords: ${_p_internal_coords}
    omol:
      probability: 0.04
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
          # NO RASA on omol: p_add_rasa_condition 0.0 on every active task.
          design_tasks:
            folding:
              frequency: 1.0
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
            unconditional:
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
            partial_ligand:
              frequency: 3.0
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
    ted_dimers:
      probability: 0.03
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            motif_scaffold:
              transform:
                p_internal_coords: ${_p_internal_coords}
    plinder:
      probability: 0.03
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            tip_atom_partial_ligand:
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_pocket:
              transform:
                p_internal_coords: ${_p_internal_coords}
    pdb_interfaces:
      probability: 0.15
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            motif_scaffold:
              transform:
                p_internal_coords: ${_p_internal_coords}

  val:
    # mcsa validation subsets expanded to 15 balanced examples (shared across variants).
    mcsa_subset:
      dataset:
        subset_to_keys: &mcsa_15_keys
          - M0040_13pk
          - M0058_1cju
          - M0092_1dli
          - M0097_1ctt
          - M0151_1q0n
          - M0209_1lij
          - M0349_1e3v
          - M0375_4ts9
          - M0500_1e3i
          - M0552_1fgh
          - M0664_2dhn
          - M0674_1uf7
          - M0711_2esd
          - M0732_1xs1
          - M0870_1oh9
    mcsa_subset_fixed_ligand:
      dataset:
        subset_to_keys: *mcsa_15_keys
    mcsa_subset_no_ligand:
      dataset:
        subset_to_keys: *mcsa_15_keys
    sm_binder_hbonds: null

log:
  tags: ["pair-dim-384", "ss-conditioning", "internal-coordinate-conditioning"]

dataloaders:
  val:
    dataloader_params:
      num_workers: 4

opt:
  val_start_epoch: 1
  num_sanity_val_steps: 2

hardware:
  nnodes_: 4
  ngpus_per_node_: 8
  ncpus_per_task_train_: 16
