# @package _global_

defaults:
  - /datasets/train/distill/rna_monomer@datasets.train.rna_monomer
  - /datasets/train/pdb/pdb_interfaces@datasets.train.pdb.sub_datasets.interfaces
  - /datasets/train/pdb/pdb_pn_units@datasets.train.pdb.sub_datasets.pn_units

  - /datasets/val/pseudoknot@datasets.val.pseudoknot
  - /datasets/val/unconditional@datasets.val.unconditional
  - /datasets/val/dna_binder_specificity_7n5u@datasets.val.dna_binder_specificity_7n5u
  - /datasets/val/rna_sm_aptamer_fixed@datasets.val.rna_sm_aptamer_fixed
  - /datasets/val/multipolymer_uncond@datasets.val.multipolymer_uncond

  - /design_tasks/presets/na_motif_scaffold_no_unindex@_na_motif_ss_design_tasks
  - _self_

run_name_: multipolymer_unified

_na_motif_ss_design_tasks:
  nucleic_ss_conditioning:
    frequency: 1.0
    transform:
      p_add_motif_scaffold_condition: 0.2
      global_design_task_kwargs:
        hbond_kwargs:
          p_add_hbond_condition: 0.15

datasets:
  train:
    rna_monomer:
      probability: 0.10
      dataset:
        transform:
          p_atomize_residues: 0.0
          design_tasks: ${_na_motif_ss_design_tasks}

    pdb:
      probability: 0.90
      sub_datasets:
        interfaces:
          probability: 0.50
          dataset:
            data: /path/to/data
            filters:
              - "deposition_date < '2024-01-01'"
              - "resolution < 9.0"
              - "num_polymer_pn_units <= 30"
              - "interface_cluster.notnull()"
              - "~(pn_unit_1_non_polymer_res_names.notnull() and pn_unit_1_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
              - "~(pn_unit_2_non_polymer_res_names.notnull() and pn_unit_2_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
              - "is_inter_molecule"
            columns_to_load:
              - example_id
              - pdb_id
              - assembly_id
              - altloc_seed
              - path
              - deposition_date
              - resolution
              - num_polymer_pn_units
              - method
              - interface_cluster
              - n_prot
              - n_nuc
              - n_ligand
              - n_peptide
              - total_num_atoms_in_unprocessed_assembly
              - pn_unit_1_iid
              - pn_unit_2_iid
              - pn_unit_1_non_polymer_res_names
              - pn_unit_2_non_polymer_res_names
              - is_inter_molecule
              - all_pn_unit_iids_after_processing
              - involves_loi
              - pn_unit_1_type
              - pn_unit_2_type
            transform:
              p_atomize_residues: 0.0
              design_tasks: ${_na_motif_ss_design_tasks}
          weights:
            cluster_column: interface_cluster
            alphas:
              a_prot: 3.0
              a_nuc: 6.0
              a_ligand: 1.0
              a_loi: 5.0

        pn_units:
          probability: 0.40
          dataset:
            data: /path/to/data
            filters:
              - "deposition_date < '2024-01-01'"
              - "resolution < 9.0"
              - "num_polymer_pn_units <= 30"
              - "cluster.notnull()"
              - "pdb_id not in ${resolve_import:atomworks.ml.preprocessing.constants,PDB_IDS_WITH_UNPHYSICAL_BONDS}"
              - "~(q_pn_unit_non_polymer_res_names.notnull() and q_pn_unit_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
            transform:
              p_atomize_residues: 0.0
              design_tasks: ${_na_motif_ss_design_tasks}
          weights:
            alphas:
              a_prot: 3.0
              a_nuc: 6.0
              a_ligand: 1.0
              a_loi: 5.0
              
# autoencoder_ckpt_path: /path/to/shared/storage
autoencoder_ckpt_path: /path/to/data
pretrain_ckpt_path: /path/to/shared/storage

training:
  self_cond: true
  self_cond_p: 0.5

opt:
  accumulate_grad_batches: 1
  steps_per_epoch: 2000
  val_every_n_epochs: 5
  num_sanity_val_steps: 0

log:
  tags: ["latent-training", "multipolymer", "rna", "pdb", "unified-ae", "dna-binder-val", "rna-aptamer-val"]
  checkpoint_every_n_epochs: 5
  last_ckpt_every_n_epochs: 1
