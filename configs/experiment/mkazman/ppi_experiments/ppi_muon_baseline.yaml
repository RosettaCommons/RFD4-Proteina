# @package _global_

# New baseline meant to be faster and will run on a single node.
# Speed improvements include using muon optimizer, af3 refolding oracle,
# increased ppi / dimer sampling, and faster inference parameters

defaults:
  # Train datasets
  # ... protein distillation
  - /datasets/train/distill/afdb_monomer_beta_coil@datasets.train.afdb_monomer
  - /datasets/train/distill/ted_dimers@datasets.train.ted_dimers

  # Validation datasets
  # ... unconditional just to make sure
  - /datasets/val/unconditional@datasets.val.unconditional
  # ... full ppi dataset for high signal
  - /datasets/val/all_ppi@datasets.val.ppi

  # AF3 refolding oracle
  - override /metrics/refolding_oracles: af3

  # Generation use ODE with TSR sampling for faster inference
  - override /generation: inference_base_ode

  - _self_

run_name_: ppi_muon_baseline_continue_v2

# Dataset mixing probabilities
datasets:
  train:
    afdb_monomer:
      probability: 0.2
    ted_dimers:
      probability: 0.8
      dataset:
        transform:
          design_tasks:
            unconditional:
              frequency: 5.0
            motif_scaffold:
              frequency: 5.0
            ppi_hotspot_with_3d_target:
              frequency: 80.0

    
log:
  tags: ["ppi-festival", "ppi", "afdb-monomer", "ted-dimers", "baseline"]

# Coreweave
hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 2
  ncpus_per_task_train_: 16

dataloaders:
  batch_size: 24
  num_workers: 16
  train:
    dataloader_params:
      collate_fn:
        fixed_dimensions: {I: 256}
  val:
    dataloader_params:
      num_workers: 4
      collate_fn:
        fixed_dimensions: null

nn:
  use_torch_compile: true

generation:
  args:
    nsteps: 100

opt:
  val_every_n_epochs: 25
  num_sanity_val_steps: 0
  muon_param_patterns:
    - '^nn\.transformer_layers\.\d+\.mhba\.(?!.*norm).*\.weight$'
    - '^nn\.transformer_layers\.\d+\.transition\.(?!.*norm).*\.weight$'

# Pre-training checkpoint to start from (optional)
pretrain_ckpt_path: /path/to/user-data/mkazman/PFM_runs/train_latents/ppi_muon_baseline_continue_v2/runs/ppi_muon_baseline_continue_v2/checkpoints/chk_epoch_00000019_step_000000080000.ckpt

# Explicitly use "all" scope to match pre-commit behavior: stochastic translation
# applies to all valid tokens including coord-conditioned ones.
product_flowmatcher:
  bb_ca:
    stochastic_centering_scope: "all"