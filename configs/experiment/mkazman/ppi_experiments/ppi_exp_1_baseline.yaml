# @package _global_

defaults:
  # Train datasets
  # ... protein distillation
  - /datasets/train/distill/afdb_monomer_256@datasets.train.afdb_monomer
  - /datasets/train/distill/ted_dimers@datasets.train.ted_dimers

  # Validation datasets
  # ... unconditional just to make sure
  - /datasets/val/unconditional@datasets.val.unconditional
  # ... full ppi dataset for high signal
  - /datasets/val/all_ppi@datasets.val.ppi

  - _self_

run_name_: ppi_exp_1_baseline

# Dataset mixing probabilities
datasets:
  train:
    afdb_monomer:
      probability: 0.5
    ted_dimers:
      probability: 0.5
    
log:
  tags: ["ppi-festival", "ppi", "afdb-monomer", "ted-dimers", "baseline"]

# Coreweave
hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 2
  ncpus_per_task_train_: 16

dataloaders:
  batch_size: 16

opt:
  val_every_n_epochs: 26
  num_sanity_val_steps: 0

# Pre-training checkpoint to start from (optional)
pretrain_ckpt_path: null

# Explicitly use "all" scope to match pre-commit behavior: stochastic translation
# applies to all valid tokens including coord-conditioned ones.
product_flowmatcher:
  bb_ca:
    stochastic_centering_scope: "all"