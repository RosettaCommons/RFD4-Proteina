# @package _global_

defaults:
  - /experiment/mkazman/ppi_experiments/ppi_muon_baseline
  - _self_

run_name_: ppi_exp_5_stoch_trans_filter_dimers_continue_v3

# Enable proper stochastic translation: random offset applied only to
# generated (non-coord-conditioned) tokens, so targets stay in place.
product_flowmatcher:
  bb_ca:
    stochastic_centering_scope: "per_group"
    stochastic_centering_group_keys: ["chain_iid", "coord_group"]

# Filter out dimers from the training set to test if stochastic translation
datasets:
  train:
    ted_dimers:
      dataset:
        filters:
          - "tm_score < 0.3"

pretrain_ckpt_path: /path/to/user-data/mkazman/PFM_runs/train_latents/ppi_exp_5_stoch_trans_filter_dimers_continue_v2/runs/ppi_exp_5_stoch_trans_filter_dimers_continue_v2/checkpoints/chk_epoch_00000019_step_000000080000.ckpt