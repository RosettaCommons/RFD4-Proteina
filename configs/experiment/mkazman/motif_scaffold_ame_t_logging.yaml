log:
  tags: ["motif-scaffolding", "ame", "pretrain", "baseline", "afdb-monomer", "mgnify", "t-logging"]

callbacks:
  t_bb_loss_monitoring_callback:
    sync_baseline: true
    sync_snapshots: true
    freeze_during_baseline: true
  t_latents_loss_monitoring_callback:
    sync_baseline: true
    sync_snapshots: true
    freeze_during_baseline: true

opt:
  val_check_interval: 100000  # validate super infrequently because we don't really care, but might be interesting to know sometimes

hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  ncpus_per_task_train_: 4
  nnodes_: 1