# @package _global_

defaults:
  # Train datasets
  - /datasets/train/distill/afdb_monomer_256@datasets.train.afdb_monomer
  - /datasets/train/distill/omol@datasets.train.omol
  - /datasets/train/plinder/plinder@datasets.train.plinder
  - /datasets/train/distill/ted_dimers@datasets.train.ted_dimers

  # Validation datasets
  - /datasets/val/unconditional@datasets.val.unconditional
  - /datasets/val/motif_scaffolding/unindexed_motif_scaffold_subset@datasets.val.unindexed_motif_scaffold_subset
  - /datasets/val/motif_scaffolding/indexed_motif_scaffold_subset@datasets.val.indexed_motif_scaffold_subset
  - /datasets/val/mcsa/mcsa_subset@datasets.val.mcsa_subset
  - /datasets/val/mcsa/mcsa_subset_fixed_ligand@datasets.val.mcsa_subset_fixed_ligand
  - /datasets/val/mcsa/mcsa_subset_no_ligand@datasets.val.mcsa_subset_no_ligand
  - /datasets/val/sm_binder@datasets.val.sm_binder
  - /datasets/val/sm_binder_fixed_ligand@datasets.val.sm_binder_fixed_ligand
  - /datasets/val/sm_binder_hbonds@datasets.val.sm_binder_hbonds
  - /datasets/val/rasa_IAI@datasets.val.rasa_IAI
  - /datasets/val/rasa_atomized_residues@datasets.val.rasa_atomized_residues

  # Design task presets
  - /design_tasks/presets/tip_atom_pocket_tasks@_tip_atom_design_tasks

  # AF3 refolding oracle
  - override /metrics/refolding_oracles: af3

  - _self_


run_name_: 30_hero_baseline_centroid_rasa_abs_coord

datasets:
  global_design_task_kwargs:
    rasa_kwargs:
      p_add_rasa_condition: 0.6
    hbond_kwargs:
      p_add_hbond_condition: 0.2

  train:
    afdb_monomer:
      probability: 0.75
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}   # RASA 0.6 via all_off (good amount)
    omol:
      probability: 0.1
      dataset:
        transform:
          # NO RASA on omol: p_add_rasa_condition 0.0 on every active task.
          design_tasks:
            folding:
              frequency: 1.0
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
            unconditional:
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
            partial_ligand:
              frequency: 3.0
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
                min_coverage_fraction: 0.0
                max_coverage_fraction: 1.0
    ted_dimers:
      probability: 0.05    # low-% PPI dimers; RASA 0.6 via all_off (good amount)
    plinder:
      probability: 0.1

  # mcsa validation subsets expanded to 15 examples (same keys for all three variants).
  val:
    mcsa_subset:
      dataset:
        subset_to_keys: &mcsa_15_keys
          - M0040_13pk
          - M0058_1cju
          - M0092_1dli
          - M0097_1ctt
          - M0151_1q0n
          - M0209_1lij
          - M0349_1e3v
          - M0375_4ts9
          - M0500_1e3i
          - M0552_1fgh
          - M0664_2dhn
          - M0674_1uf7
          - M0711_2esd
          - M0732_1xs1
          - M0870_1oh9
    mcsa_subset_fixed_ligand:
      dataset:
        subset_to_keys: *mcsa_15_keys
    mcsa_subset_no_ligand:
      dataset:
        subset_to_keys: *mcsa_15_keys

log:
  tags: ["insertion-head", "motif-scaffolding", "ame", "omol", "plinder", "muon", "af3-oracle", "baseline"]

dataloaders:
  batch_size: 16
  val:
    dataloader_params:
      num_workers: 4

opt:
  val_start_epoch: 1   # skip prevalidate (no val before first training epoch)
  num_sanity_val_steps: 2

hardware:
  accelerator: gpu
  nnodes_: 3
  ngpus_per_node_: 8
  ncpus_per_task_train_: 16