# @package _global_

defaults:
  # Train datasets
  - /datasets/train/distill/afdb_monomer_genie3@datasets.train.afdb_monomer
  - /datasets/train/distill/omol@datasets.train.omol

  # Validation datasets (structure prediction only)
  - /datasets/val/structure_prediction/de_novo@datasets.val.de_novo

  # Add omol validation set
  - /datasets/val/structure_prediction/ccd@datasets.val.ccd
  
  # Design task presets
  - /design_tasks/presets/folding_only@_folding_design_tasks

  - _self_

run_name_: structure_prediction_afdb_omol_fast

# Dataset mixing probabilities
datasets:
  train:
    afdb_monomer:
      probability: 0.9
      dataset:
        transform:
          design_tasks: ${_folding_design_tasks}
    omol:
      probability: 0.1
      dataset:
        transform:
          design_tasks:  # Just structure prediction for omol
            folding:
              frequency: 1.0
              transform:
                _target_: proteinfoundation.transforms.design_task.StructurePredictionTask
                global_design_task_kwargs:
                  rasa_kwargs:
                    p_add_rasa_condition: 0.0
                  hbond_kwargs:
                    p_add_hbond_condition: 0.0
                  secondary_structure_kwargs:
                    p_add_secondary_structure_condition: 0.0

log:
  tags: ["structure-prediction", "folding", "omol", "pretrain", "afdb-monomer"]

hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 6
  ncpus_per_task_train_: 16

opt:
  accumulate_grad_batches: 1

# Pre-training checkpoint to start from (optional)
pretrain_ckpt_path:

