# @package _global_

defaults:
  - mkazman/structure_prediction_afdb_omol
  # Add mgnify
  - /datasets/train/distill/mgnify_dec_2025@datasets.train.mgnify_dec_2025
  - _self_

run_name_: structure_prediction_msanew_afdb_omol_mgnify

datasets:
  train:
    mgnify_dec_2025:
      probability: 0.45
      dataset:
        transform:
          design_tasks: ${_folding_design_tasks}
    afdb_monomer:
      probability: 0.45
      dataset:
        transform:
          design_tasks: ${_folding_design_tasks}
    omol:
      probability: 0.1
      dataset:
        transform:
          design_tasks:  # Just structure prediction for omol
            folding:
              frequency: 1.0
              transform:
                _target_: proteinfoundation.transforms.design_task.StructurePredictionTask
                global_design_task_kwargs:
                  rasa_kwargs:
                    p_add_rasa_condition: 0.0
                  hbond_kwargs:
                    p_add_hbond_condition: 0.0
                  secondary_structure_kwargs:
                    p_add_secondary_structure_condition: 0.0

log:
  tags: ["structure-prediction", "folding", "omol", "pretrain", "afdb-monomer", "mgnify"]

hardware:
  accelerator: gpu
  ngpus_per_node_: 4
  nnodes_: 1
  ncpus_per_task_train_: 16
