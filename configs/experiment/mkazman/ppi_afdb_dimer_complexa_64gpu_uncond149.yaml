# @package _global_

defaults:
  - /datasets/train/distill/afdb_dimer@datasets.train.afdb_dimer
  - /datasets/train/pdb/complexa_filtered_pdb@datasets.train.complexa_filtered_pdb
  - /datasets/val/unconditional@datasets.val.unconditional
  - /datasets/val/ppi_subset@datasets.val.ppi_subset
  - _self_

run_name_: ppi_afdb_dimer_complexa_64gpu_uncond149_memshmfix_2

# Unconditional checkpoint provided by user.
pretrain_ckpt_path: /path/to/shared/storage

datasets:
  train:
    afdb_dimer:
      probability: 0.8
      dataset:
        memory_map: True
        transform:
          crop_size: 500
          design_tasks: ${_ppi_uncond_mixed_design_tasks}
    complexa_filtered_pdb:
      probability: 0.2
      dataset:
        memory_map: True
        data: ${oc.env:DATA_PATH}/latent_train_parquet_files/complexa_filtered_pdb.parquet
        transform:
          crop_size: 500
          design_tasks: ${_ppi_uncond_mixed_design_tasks}

_ppi_uncond_mixed_design_tasks:
  unconditional:
    frequency: 20.0
    transform:
      _target_: proteinfoundation.transforms.design_task.UnconditionalTask
      global_design_task_kwargs: ${datasets.global_design_task_kwargs}
  ppi_hotspot_with_3d_target:
    frequency: 80.0
    transform:
      _target_: proteinfoundation.transforms.design_task.PPIHotspotWith3DTarget
      max_hotspots_frac_to_provide: 0.5
      hotspot_max_distance: 4.5
      motif_distance_knockout_p: 0.95
      min_dropout_2d_dist: 0.5
      max_dropout_2d_dist: 0.9
      jitter_sigma: 5.0
      crop_size: 500
      max_atoms_in_crop: ${eval:"${.crop_size} * 10"}
      crop_center_cutoff_distance: 15.0
      ppi_crop_max_binder_length: ${eval:"int(${.crop_size} * 0.667)"}
      p_sample_ppi_crop: 0.75
      global_design_task_kwargs: ${datasets.global_design_task_kwargs}

dataloaders:
  batch_size: 4

hardware:
  ngpus_per_node_: 8
  nnodes_: 8
  ncpus_per_task_train_: 16

opt:
  steps_per_epoch: 2000
  val_start_epoch: 0
  val_every_n_epochs: 20

log:
  tags: ["ppi", "afdb-dimer", "complexa-pdb", "pretrain", "64gpu", "uncond149"]
  checkpoint_every_n_epochs: 10
  last_ckpt_every_n_epochs: 1
