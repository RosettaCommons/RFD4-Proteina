# @package _global_

defaults:
  - /experiment/mkazman/unconditional_afdb
  # Add mgnify
  - /datasets/train/distill/mgnify_dec_2025@datasets.train.mgnify_dec_2025
  # Add omol
  - /datasets/train/distill/omol@datasets.train.omol
  # Add omol validation set
  - /datasets/val/structure_prediction/ccd@datasets.val.ccd
  - _self_

run_name_: unconditional_afdb_mgnify_omol_test

datasets:
  train:
    mgnify_dec_2025:
      probability: 0.45
      dataset:
        transform:
          design_tasks: ${_unconditional_design_tasks}
    afdb_monomer:
      probability: 0.45
      dataset:
        transform:
          design_tasks: ${_unconditional_design_tasks}
    omol:
      probability: 0.1
      dataset:
        transform:
          design_tasks:  # Just structure prediction for omol
            folding:
              frequency: 1.0
              transform:
                _target_: proteinfoundation.transforms.design_task.StructurePredictionTask
                global_design_task_kwargs:
                  rasa_kwargs:
                    p_add_rasa_condition: 0.0
                  hbond_kwargs:
                    p_add_hbond_condition: 0.0
                  secondary_structure_kwargs:
                    p_add_secondary_structure_condition: 0.0

log:
  tags: ["unconditional", "omol", "pretrain", "afdb-monomer", "mgnify"]

hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 1
  ncpus_per_task_train_: 16

