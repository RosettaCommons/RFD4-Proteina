# @package _global_

defaults:
  - /experiment/mkazman/motif_scaffold_base
  - /design_tasks/presets/motif_pretraining@_design_tasks
  - _self_

run_name_: motif_scaffold_proteina_relative

_design_tasks:
  motif_scaffold:
    transform:
      _target_: proteinfoundation.transforms.design_task.MotifScaffoldProteinaTask
      atom_selection_mode: all
      residue_selection_mode: absolute_number
      motif_min_n_res: 1
      motif_max_n_res: 8
      unindex_mode: simple
      p_unindex_motif: 0.5
      global_design_task_kwargs: ${datasets.global_design_task_kwargs}

datasets:
  train:
    afdb_monomer:
      probability: 1.0
      dataset:
        transform:
          design_tasks: ${_design_tasks}

log:
  tags: ["motif-scaffolding", "pretrain", "relative", "all-atoms"]

hardware:
  ngpus_per_node_: 8
  nnodes_: 6
  ncpus_per_task_train_: 16

