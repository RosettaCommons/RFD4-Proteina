# @package _global_

defaults:
  - /datasets/train/distill/omol@datasets.train
  - _self_

run_name_: omol_partial_ligand_debug

_design_tasks:
  partial_ligand:
    frequency: 1.0
    transform:
      _target_: proteinfoundation.transforms.design_task.PartialLigandTask
      min_coverage_fraction: 0.0
      max_coverage_fraction: 1.0


datasets:
  train:
    dataset:
      transform:
        design_tasks: ${_design_tasks}

hardware:
  accelerator: gpu
  ngpus_per_node_: 1
  nnodes_: 1

nolog: true
