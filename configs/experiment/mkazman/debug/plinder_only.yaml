# @package _global_

defaults:
  # Train datasets
  # ... protein distillation
  - /datasets/train/plinder/plinder@datasets.train.plinder

  # Validation datasets
  # ... unconditional
  - /datasets/val/unconditional@datasets.val.unconditional

  - _self_

run_name_: plinder_debug

# Dataset mixing probabilities
datasets:
  val:
    unconditional:
      dataset:
        num_replicates: 1  # so it goes fast
    
log:
  tags: ["plinder", "pretrain", "baseline", "debug"]

hardware:
  accelerator: gpu
  ngpus_per_node_: 1
  nnodes_: 1

dataloaders:
  batch_size: 4

opt:
  num_sanity_val_steps: 0

# nolog: true
# single: true

# Pre-training checkpoint to start from (optional)
pretrain_ckpt_path: null