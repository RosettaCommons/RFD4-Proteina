# @package _global_

defaults:
  - /experiment/mkazman/motif_scaffold_afdb
  # Add mgnify
  - /datasets/train/distill/mgnify_dec_2025@datasets.train.mgnify_dec_2025
  - _self_

run_name_: motif_scaffold_ame_afdb_mgnify_fast

datasets:
  train:
    mgnify_dec_2025:
      probability: 0.5
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}
    afdb_monomer:
      probability: 0.5
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}

log:
  tags: ["motif-scaffolding", "ame", "pretrain", "baseline", "afdb-monomer", "mgnify"]

hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 6
  ncpus_per_task_train_: 16