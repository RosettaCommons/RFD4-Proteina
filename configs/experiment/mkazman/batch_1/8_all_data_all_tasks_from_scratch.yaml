# @package _global_

defaults:
  # Train datasets
  # ... distillation
  - /datasets/train/distill/afdb_monomer_256@datasets.train.afdb_monomer
  - /datasets/train/distill/teddimore_monomers_contiguous@datasets.train.teddimore_monomers_contiguous
  - /datasets/train/distill/omol@datasets.train.omol
  - /datasets/train/distill/afdb_dimer@datasets.train.afdb_dimer
  - /datasets/train/distill/teddimore_dimers_contiguous@datasets.train.teddimore_dimers_contiguous
  # ... pdb
  - /datasets/train/pdb/pdb_interfaces@datasets.train.pdb_interfaces
  - /datasets/train/plinder/plinder_with_missing_atoms@datasets.train.plinder_with_missing_atoms

  # Validation datasets
  # ... unconditional
  - /datasets/val/unconditional@datasets.val.unconditional
  # ... motif scaffolding (indexed and unindexed)
  - /datasets/val/motif_scaffolding/indexed_motif_scaffold_subset@datasets.val.indexed_motif_scaffold_subset
  - /datasets/val/motif_scaffolding/unindexed_motif_scaffold_subset@datasets.val.unindexed_motif_scaffold_subset
  # ... AME datasets
  - /datasets/val/mcsa/mcsa_subset@datasets.val.mcsa_subset
  - /datasets/val/mcsa/mcsa_subset_fixed_ligand@datasets.val.mcsa_subset_fixed_ligand
  - /datasets/val/mcsa/mcsa_subset_no_ligand@datasets.val.mcsa_subset_no_ligand
  # ... SM binder validation sets
  - /datasets/val/sm_binder_hbonds@datasets.val.sm_binder_hbonds
  - /datasets/val/sm_binder@datasets.val.sm_binder_unfixed_ligand
  - /datasets/val/sm_binder_fixed_ligand@datasets.val.sm_binder_fixed_ligand
  # ... PPI validation sets
  - /datasets/val/ppi_subset@datasets.val.ppi_subset

  # Design task presets (for ease of use)
  - /design_tasks/presets/tip_atom_pocket_tasks@_tip_atom_design_tasks
  - /design_tasks/presets/plinder_tasks@_plinder_multitask_design_tasks
  - /design_tasks/presets/ppi_motif_scaffold@_ppi_motif_scaffold_design_tasks

  - _self_

run_name_: 8_all_data_all_tasks_from_scratch

# add rasa and hbond conditioning just to the plinder design tasks
_plinder_multitask_design_tasks:
  unconditional:
    transform:
      global_design_task_kwargs:
        rasa_kwargs:
          p_add_rasa_condition: 0.15
        hbond_kwargs:
          p_add_hbond_condition: 0.15
  folding:
    transform:
      global_design_task_kwargs:
        rasa_kwargs:
          p_add_rasa_condition: 0.15
        hbond_kwargs:
          p_add_hbond_condition: 0.15
  inverse_folding:
    transform:
      global_design_task_kwargs:
        rasa_kwargs:
          p_add_rasa_condition: 0.15
        hbond_kwargs:
          p_add_hbond_condition: 0.15
  tip_atom_pocket:
    transform:
      global_design_task_kwargs:
        rasa_kwargs:
          p_add_rasa_condition: 0.15
        hbond_kwargs:
          p_add_hbond_condition: 0.15
  tip_atom_partial_ligand:
    transform:
      global_design_task_kwargs:
        rasa_kwargs:
          p_add_rasa_condition: 0.15
        hbond_kwargs:
          p_add_hbond_condition: 0.15
  partial_ligand:
    transform:
      global_design_task_kwargs:
        rasa_kwargs:
          p_add_rasa_condition: 0.15
        hbond_kwargs:
          p_add_hbond_condition: 0.15

# Dataset mixing probabilities
datasets:
  train:
    afdb_monomer:
      probability: 0.25
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}
    teddimore_monomers_contiguous:
      probability: 0.25
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}
    omol:
      probability: 0.13
      dataset:
        transform:
          design_tasks:  # Just structure prediction for omol. TODO: Need to add partial ligand design task
            folding:
              frequency: 3.0  # 75% of the time we have to fold the entire thing
              transform:
                _target_: proteinfoundation.transforms.design_task.StructurePredictionTask
                global_design_task_kwargs:
                  rasa_kwargs:
                    p_add_rasa_condition: 0.0
                  hbond_kwargs:
                    p_add_hbond_condition: 0.0
                  secondary_structure_kwargs:
                    p_add_secondary_structure_condition: 0.0
            partial_ligand:
              frequency: 1.0
              transform:
                _target_: proteinfoundation.transforms.design_task.PartialLigandTask
                min_coverage_fraction: 0.0
                max_coverage_fraction: 1.0
    afdb_dimer:
      probability: 0.15
      dataset:
        transform:
          design_tasks: ${_ppi_motif_scaffold_design_tasks}
    teddimore_dimers_contiguous:
      probability: 0.15
      dataset:
        transform:
          design_tasks: ${_ppi_motif_scaffold_design_tasks}
    pdb_interfaces:
      probability: 0.035
      dataset:
        filters:
          - "deposition_date < '2021-09-30'"
          - "resolution < 9.0"
          - "num_polymer_pn_units <= 30"
          - "cluster.notnull()"
          - "~(pn_unit_1_non_polymer_res_names.notnull() and pn_unit_1_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
          - "~(pn_unit_2_non_polymer_res_names.notnull() and pn_unit_2_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
          - "is_inter_molecule"
          - "n_nuc == 0"  # Added this to exclude all nucleotides
        transform:
          design_tasks: ${_ppi_motif_scaffold_design_tasks}
    plinder_with_missing_atoms:
      probability: 0.035
      dataset:
        transform:
          design_tasks: ${_plinder_multitask_design_tasks}
    
log:
  tags: ["motif-scaffolding", "ppi", "pretrain", "afdb-monomer", "omol", "ame", "pdb", "plinder", "sm-binder"]

# Coreweave
hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 4
  ncpus_per_task_train_: 16

dataloaders:
  batch_size: 16

# Pre-training checkpoint to start from (optional)
pretrain_ckpt_path: null