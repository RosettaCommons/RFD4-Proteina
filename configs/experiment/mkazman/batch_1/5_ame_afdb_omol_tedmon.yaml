# @package _global_

defaults:
  - /experiment/mkazman/batch_1/4_ame_afdb_omol_30

  # Add teddimonomer
  - /datasets/train/distill/teddimore_monomers_contiguous@datasets.train.teddimore_monomers_contiguous

  - _self_

run_name_: 5_ame_afdb_omol_tedmon

datasets:
  train:
    afdb_monomer:
      probability: 0.45
    omol:
      probability: 0.1
    teddimore_monomers_contiguous:
      probability: 0.45
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}

# Coreweave
hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 3
  ncpus_per_task_train_: 16

dataloaders:
  batch_size: 16