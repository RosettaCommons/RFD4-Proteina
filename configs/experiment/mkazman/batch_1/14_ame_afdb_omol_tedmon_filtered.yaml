# @package _global_

defaults:
  - /experiment/mkazman/batch_1/5_ame_afdb_omol_tedmon

  - _self_

run_name_: 14_ame_afdb_omol_tedmon_filtered_fixed_2

datasets:
  train:
    afdb_monomer:
      dataset:
        data: ${oc.env:DATA_PATH}/latent_train_parquet_files/contiguous_teddimore_monomers_cluster_reps_quality.parquet
        columns_to_load:
          - example_id
          - path
          - quality_passed
        filters:
          - "quality_passed"

# Coreweave
hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 3
  ncpus_per_task_train_: 16

dataloaders:
  batch_size: 16

# pretrain_ckpt_path: /path/to/home
pretrain_ckpt_path: /path/to/home