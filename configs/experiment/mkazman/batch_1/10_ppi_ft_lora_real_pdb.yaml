# @package _global_

defaults:
  - /experiment/mkazman/batch_1/9_ppi_ft_lora

  # Train dataset
  - /datasets/train/pdb/pdb_interfaces@datasets.train.unfiltered_pdb


# Dataset mix
datasets:
  train:
    afdb_dimer:
      probability: 0.8
      dataset:
        transform:
          design_tasks: ${_ppi_motif_scaffold_design_tasks}
    unfiltered_pdb:
      probability: 0.2
      dataset:
        transform:
          design_tasks: ${_ppi_motif_scaffold_design_tasks}
    complexa_filtered_pdb:
      probability: 0.0
      dataset:
        transform:
          design_tasks: ${_ppi_motif_scaffold_design_tasks}

# LoRA settings
lora:
  r: 32
  lora_alpha: 64.0
  lora_dropout: 0.0
  train_bias: none
  exclude_keys: []

log:
  tags: ["ppi", "fine-tune", "lora", "unfiltered_pdb"]