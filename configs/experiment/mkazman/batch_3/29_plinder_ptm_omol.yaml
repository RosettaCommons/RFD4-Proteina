# @package _global_

defaults:
  # Train datasets
  - /experiment/mkazman/batch_3/27_plinder_ptm_upweight

  - /datasets/train/distill/omol@datasets.train.omol

  - _self_


run_name_: 29_plinder_ptm_omol

datasets:
  global_design_task_kwargs:
    rasa_kwargs:
      p_add_rasa_condition: 0.2
    secondary_structure_kwargs:
      p_add_secondary_structure_condition: 0.1
    hbond_kwargs:
      p_add_hbond_condition: 0.1

  train:
    afdb_monomer:
      probability: 0.5
    omol:
      probability: 0.2
      dataset:
        transform:
          design_tasks:
            folding:
              frequency: 1.0
            partial_ligand:
              frequency: 3.0
              transform:
                min_coverage_fraction: 0.0
                max_coverage_fraction: 1.0
    plinder:
      probability: 0.3

log:
  tags: ["motif-scaffolding", "ame", "omol", "plinder", "pretrain", "muon", "af3-oracle", "ptm"]

opt:
  val_start_epoch: 1   # skip prevalidate (no val before first training epoch)
  num_sanity_val_steps: 2

hardware:
  accelerator: gpu
  nnodes_: 2
  ngpus_per_node_: 8
  ncpus_per_task_train_: 16