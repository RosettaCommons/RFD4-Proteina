# @package _global_

defaults:
  - /experiment/mkazman/unconditional_afdb
  - _self_

# New continuation run (32 GPUs = 4 nodes x 8 GPUs) initialized from a previous run's last.ckpt
run_name_: unconditional_afdb_fast_cont_32gpu_3

pretrain_ckpt_path: /path/to/shared/storage

hardware:
  ngpus_per_node_: 8
  nnodes_: 4
  ncpus_per_task_train_: 16

# Epoch = 2k steps, last.ckpt every epoch, validation disabled (set very high)
opt:
  steps_per_epoch: 2000
  val_every_n_epochs: 99999

log:
  checkpoint_every_n_epochs: 10
  last_ckpt_every_n_epochs: 1


