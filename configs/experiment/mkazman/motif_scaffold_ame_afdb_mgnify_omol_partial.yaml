# @package _global_

defaults:
  - /experiment/mkazman/motif_scaffold_afdb
  # Add mgnify
  - /datasets/train/distill/mgnify_dec_2025@datasets.train.mgnify_dec_2025
  # Add omol
  - /datasets/train/distill/omol@datasets.train.omol

  # Add omol validation set
  # - /datasets/val/structure_prediction/ccd@datasets.val.ccd
  - _self_

run_name_: motif_scaffold_ame_afdb_mgnify_omol_partial_coreweave

datasets:
  train:
    mgnify_dec_2025:
      probability: 0.45
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}
    afdb_monomer:
      probability: 0.45
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}
    omol:
      probability: 0.1
      dataset:
        transform:
          design_tasks:  # Just structure prediction for omol. TODO: Need to add partial ligand design task
            folding:
              frequency: 3.0  # 75% of the time we have to fold the entire thing
              transform:
                _target_: proteinfoundation.transforms.design_task.StructurePredictionTask
                global_design_task_kwargs:
                  rasa_kwargs:
                    p_add_rasa_condition: 0.0
                  hbond_kwargs:
                    p_add_hbond_condition: 0.0
                  secondary_structure_kwargs:
                    p_add_secondary_structure_condition: 0.0
            partial_ligand:
              frequency: 1.0
              transform:
                _target_: proteinfoundation.transforms.design_task.PartialLigandTask
                min_coverage_fraction: 0.0
                max_coverage_fraction: 1.0

log:
  tags: ["motif-scaffolding", "ame", "omol", "pretrain", "baseline", "afdb-monomer", "mgnify"]

opt:
  val_start_epoch: 0
  val_every_n_epochs: 5

hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 3
  ncpus_per_task_train_: 16

pretrain_ckpt_path: null