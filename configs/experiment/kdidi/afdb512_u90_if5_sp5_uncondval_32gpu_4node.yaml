# @package _global_
# AFDB-512 training: 90% unconditional, 5% structure prediction, 5% inverse folding.
# Validation dataset is unconditional-only.

defaults:
  - /datasets/train/distill/afdb_512@datasets.train.afdb_512
  - /datasets/val/unconditional@datasets.val.unconditional
  - _self_

run_name_: afdb512_u90_if5_sp5_uncondval_32gpu_4node_2

datasets:
  train:
    afdb_512:
      probability: 1.0
      dataset:
        transform:
          design_tasks:
            unconditional:
              frequency: 90.0
            folding:
              frequency: 5.0
            inverse_folding:
              frequency: 5.0
            motif_scaffold:
              frequency: 0.0

hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 4

log:
  tags: ["afdb-512", "u90-if5-sp5", "val-unconditional", "32gpu-4node"]

dataloaders:
  batch_size: 8
