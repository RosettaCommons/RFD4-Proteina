# @package _global_
# Latent model training for multipolymer unified
# Adds na_complex (protein-DNA/RNA complexes) on top of afavor's base mix
# 2 nodes x 8 GPUs = 16 GPUs total

defaults:
  - /experiment/afavor/multipolymer_unified
  - /datasets/train/distill/na_complex@datasets.train.na_complex
  - _self_

run_name_: kdidi_multipolymer_unified_latent_v4

pretrain_ckpt_path: null

autoencoder_ckpt_path: /path/to/home

# AE trained on unified pipeline uses same encoding as latent model (no -1 offset needed)
use_unified_ae_encoding: true

hardware:
  ngpus_per_node_: 8
  nnodes_: 2

# Disabled val sets:
# - dna_binder: RF3DNABinderMetric raises ValueError on untrained models
# - rna_sm_aptamer: benchmark references residue M900 not found in parsed PDB
datasets:
  val:
    dna_binder_specificity_7n5u: null
    rna_sm_aptamer_fixed: null
  train:
    rna_monomer:
      probability: 0.10
      dataset:
        data: ${oc.env:DATA_PATH}/train_datasets/rna_monomer/rna_monomer.parquet
    pdb:
      probability: 0.80
      sub_datasets:
        interfaces:
          dataset:
            data: ${oc.env:DATA_PATH}/train_datasets/pdb/pdb_interfaces.parquet
        pn_units:
          dataset:
            data: ${oc.env:DATA_PATH}/train_datasets/pdb/pdb_pn_units.parquet
    na_complex:
      probability: 0.10
      dataset:
        transform:
          p_atomize_residues: 0.0
          design_tasks: ${_na_motif_ss_design_tasks}

opt:
  val_every_n_epochs: 5
  num_sanity_val_steps: 1

log:
  tags: ["latent-training", "multipolymer", "rna", "pdb", "unified-ae", "na-complex", "kdidi", "2node", "merged-latent-main"]
