# @package _global_

defaults:
  - /experiment/kdidi/structure_prediction_afdb_monomer_only
  - /nn/local_latents_score_nn_400M_atom37@nn
  - _self_

run_name_: struc_pred_afdb_256_msa256_400M_v7

hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 4

dataloaders:
  batch_size: 3
  train:
    dataloader_params:
      collate_fn:
        fixed_dimensions: {I: 384, S: 256}
  val:
    dataloader_params:
      collate_fn:
        fixed_dimensions: {I: 384, S: 256}

datasets:
  train:
    afdb_monomer:
      dataset:
        transform:
          crop_size: 384
          load_msa: true
          msa_featurize_n_msa: 256
  val:
    de_novo:
      dataset:
        transform:
          load_msa: true
          msa_featurize_n_msa: 256

opt:
  accumulate_grad_batches: 2
  val_every_n_epochs: 100000
  num_sanity_val_steps: 0

nn:
  attention_type: flash  # "torch", "flash", "cuequivariance", or "te"
  use_msa_module: true
  use_torch_compile: true
  
  msa_module:
    use_cuequivariance: false  # Disable: buggy meta kernel breaks torch.compile
    use_triangle_attention: false  # Disable to save memory (OOM fix)

hydra:
  job:
    env_set:
      PROTEIN_MSA_DIRS: "${oc.env:SQUASH_MOUNT_PATH,/squash}/msa_mgnify"
      RNA_MSA_DIRS: ""

