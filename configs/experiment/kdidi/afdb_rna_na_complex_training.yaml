# @package _global_

# Latent model training on AFDB monomers + RNA + NA (protein-DNA/RNA) complexes
# Uses unified autoencoder trained on protein/RNA/DNA
#
# Design task strategy:
# - AFDB proteins: motif_pretraining (80% motif, 10% unconditional, 5% folding, 5% inverse folding)
# - RNA monomers: unconditional only (motif scaffolding has protein-specific components)
# - NA complexes: unconditional only (motif scaffolding has protein-specific components)

defaults:
  # Train datasets (distillation)
  - /datasets/train/distill/afdb_monomer_genie3@datasets.train.afdb_monomer
  - /datasets/train/distill/rna_monomer@datasets.train.rna_monomer
  - /datasets/train/distill/na_complex@datasets.train.na_complex

  # Validation datasets
  - /datasets/val/unconditional@datasets.val.unconditional
  - /datasets/val/motif_scaffolding/indexed_motif_scaffold_subset@datasets.val.indexed_motif_scaffold_subset
  - /datasets/val/motif_scaffolding/unindexed_motif_scaffold_subset@datasets.val.unindexed_motif_scaffold_subset

  # Design task presets
  - /design_tasks/presets/motif_pretraining@_motif_scaffold_design_tasks
  - /design_tasks/presets/unconditional_only@_unconditional_design_tasks

  - _self_

run_name_: afdb_rna_na_complex_latent_training

# Dataset mixing probabilities
datasets:
  train:
    # Proteins: full motif pretraining tasks
    afdb_monomer:
      probability: 0.5
      dataset:
        transform:
          design_tasks: ${_motif_scaffold_design_tasks}
    # RNA: unconditional only (motif scaffolding is protein-specific)
    rna_monomer:
      probability: 0.25
      dataset:
        transform:
          design_tasks: ${_unconditional_design_tasks}
    # NA complexes: unconditional only (motif scaffolding is protein-specific)
    na_complex:
      probability: 0.25
      dataset:
        transform:
          design_tasks: ${_unconditional_design_tasks}

# Unified autoencoder checkpoint (protein + RNA + DNA)
autoencoder_ckpt_path: /path/to/shared/storage

# Hardware configuration for 4 GPUs, 1 node
hardware:
  accelerator: gpu
  ngpus_per_node_: 4
  nnodes_: 1
  ncpus_per_task_train_: 16

opt:
  accumulate_grad_batches: 1

log:
  tags: ["latent-training", "afdb-monomer", "rna", "na-complex", "unified-ae"]

# Pre-training checkpoint to start from (optional - set to null for training from scratch)
pretrain_ckpt_path:
