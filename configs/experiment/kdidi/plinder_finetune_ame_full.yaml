# @package _global_
# Finetune ame_afdb_256 checkpoint on 50% AFDB (AME motif scaffold) + 50% PLINDER (tip_atom tasks)
# Full model training (no LoRA)

defaults:
  # Base model config
  - /experiment/mkazman/motif_scaffold_afdb_256
  # Add PLINDER dataset
  - /datasets/train/plinder/plinder_valid@datasets.train.plinder_valid
  # Design task presets
  - /design_tasks/presets/tip_atom_tasks@_tip_atom_design_tasks
  - _self_

run_name_: plinder_finetune_ame_full

# Continue from ame_afdb_256 checkpoint (epoch 129)
pretrain_ckpt_path: /path/to/shared/storage

# Hardware: 32 GPUs (4 nodes x 8 GPUs)
hardware:
  ngpus_per_node_: 8
  nnodes_: 4
  ncpus_per_task_train_: 16

# Full model training (no LoRA)
lora:
  r: null

# Dataset mixing: 50% AFDB monomer (AME motif scaffold), 50% PLINDER (tip_atom tasks)
datasets:
  train:
    afdb_monomer_256:
      probability: 0.5
      dataset:
        transform:
          design_tasks: ${_ame_motif_scaffold_design_tasks}
    plinder_valid:
      probability: 0.5
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}

# AME-style motif scaffolding: 100% motif scaffold with 100% unindexing
_ame_motif_scaffold_design_tasks:
  motif_scaffold:
    frequency: 100.0
    transform:
      _target_: proteinfoundation.transforms.design_task.MotifScaffoldTask
      min_tokens_per_motif: 1
      max_tokens_per_motif: 50
      min_coverage_fraction: 0.05
      max_coverage_fraction: 1.0
      max_unindexed_tokens: 50
      p_unindex_any: 1.0
      p_merge_unindexed_groups: 0.1
      p_split_unindexed_groups: 0.01
      p_increase_group_id_gap: 0.1
      global_design_task_kwargs: ${datasets.global_design_task_kwargs}

# Validation disabled for faster training
opt:
  val_every_n_epochs: 99999

log:
  tags: ["finetune", "plinder", "ame", "full-training", "afdb-monomer-256"]
  checkpoint_every_n_epochs: 10
  last_ckpt_every_n_epochs: 1
