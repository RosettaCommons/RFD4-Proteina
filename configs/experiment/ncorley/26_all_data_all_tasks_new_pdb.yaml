# @package _global_
  
defaults:
  # =====================================================================
  # Train datasets
  # =====================================================================

  # --- Protein-only (distillation) ---
  - /datasets/train/distill/afdb_monomer_beta_coil@datasets.train.afdb_monomer  # AFDB monomers
  - /datasets/train/distill/afdb_dimer@datasets.train.afdb_dimer          # TED / AFDB protein dimers

  # --- PDB (using AF3-style sub-datasets) ---
  - /datasets/train/pdb/pdb_interfaces@datasets.train.pdb.sub_datasets.interfaces  # multi-chain interfaces
  - /datasets/train/pdb/pdb_pn_units@datasets.train.pdb.sub_datasets.pn_units      # single PN-unit (tip-atom / pocket)

  # --- Small-molecule-only ---
  - /datasets/train/distill/omol@datasets.train.omol                      # OMol-1 (small molecules in LMDB)

  # =====================================================================
  # Validation datasets
  # =====================================================================

  # --- Unconditional generation ---
  - /datasets/val/unconditional@datasets.val.unconditional

  # --- Motif scaffolding ---
  - /datasets/val/motif_scaffolding/indexed_motif_scaffold_subset@datasets.val.indexed_motif_scaffold_subset
  - /datasets/val/motif_scaffolding/unindexed_motif_scaffold_subset@datasets.val.unindexed_motif_scaffold_subset

  # --- Enzyme / AME (mcsa tip-atom) ---
  - /datasets/val/mcsa/mcsa_subset@datasets.val.mcsa_subset
  - /datasets/val/mcsa/mcsa_subset_fixed_ligand@datasets.val.mcsa_subset_fixed_ligand
  - /datasets/val/mcsa/mcsa_subset_no_ligand@datasets.val.mcsa_subset_no_ligand

  # --- Enzyme design (mgantz design cases; PR #114) ---
  # Disabled 2026-04-16: triggers UnboundLocalError in biotite.structure.concatenate
  # via extract_ligand_array when ligand spec produces empty ligand_arrays list.
  # Re-enable after fixing the edge case in inference_utils/inference_utils.py.
  # - /datasets/val/enz_design/enz_design@datasets.val.enz_design

  # --- Small-molecule binders ---
  - /datasets/val/sm_binder@datasets.val.sm_binder
  - /datasets/val/sm_binder_fixed_ligand@datasets.val.sm_binder_fixed_ligand

  # --- Structure prediction (CCD small molecules) ---
  - /datasets/val/structure_prediction/ccd@datasets.val.ccd

  # --- PPI ---
  - /datasets/val/ppi_subset@datasets.val.ppi_subset

  # =====================================================================
  # Design-task presets (aliased for reuse below)
  # =====================================================================
  - /design_tasks/presets/tip_atom_pocket_tasks@_tip_atom_design_tasks
  - /design_tasks/presets/ppi_motif_scaffold@_ppi_motif_scaffold_design_tasks

  # PDB-only: plinder-dose variants (rasa=0.15, hbond=0.15 hardcoded per task).
  # These are PDB-specific so afdb_monomer / afdb_dimer / omol stay at 0.
  - /design_tasks/presets/ppi_motif_scaffold_with_tip_atom_plinder_dose@_pdb_interfaces_design_tasks
  - /design_tasks/presets/tip_atom_pocket_tasks_plinder_dose@_pdb_pn_units_design_tasks

  - _self_

run_name_: 2026_04_16_hero_run_v2

log:
  tags: ["motif-scaffolding", "ppi", "pretrain", "afdb-monomer", "omol", "ame", "pdb", "sm-binder"]

# =====================================================================
# Train mix (probabilities must sum to 1.0)
# =====================================================================
datasets:
  train:
    # --- Protein-only (distillation) ---
    afdb_monomer:
      probability: 0.47
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}
    afdb_dimer:
      probability: 0.30
      dataset:
        transform:
          design_tasks: ${_ppi_motif_scaffold_design_tasks}

    # --- PDB ---
    # Both sub-datasets also get plinder-style 0.15 rasa/hbond conditioning
    # (see _pdb_interfaces_design_tasks / _pdb_pn_units_design_tasks above).
    pdb:
      probability: 0.10
      sub_datasets:
        interfaces:
          dataset:
            transform:
              # PPI hotspot + motif-scaffold + the three tip_atom tasks
              # (interfaces often contain ligands at the PPI)
              design_tasks: ${_pdb_interfaces_design_tasks}
        pn_units:
          dataset:
            transform:
              # tip_atom_pocket preset (the pdb_pn_units.yaml default), with the
              # 0.15 conditioning dose layered on top.
              design_tasks: ${_pdb_pn_units_design_tasks}

    # --- Small-molecule-only ---
    omol:
      # folding + partial_ligand + unconditional
      probability: 0.13

  # =====================================================================
  # Validation overrides — drop two MCSA examples that produce non-monotonic
  # res_ids (chain B [378,377,380] for M0500_1e3i and chain D [301,300] for
  # M0375_4ts9), which trip atomworks _check_resid_ordering during
  # parse_atom_array. Bug is in create_atom_array_from_design_specification
  # appending ligand residues out of res_id order.
  # =====================================================================
  val:
    mcsa_subset:
      dataset:
        subset_to_keys: ["M0664_2dhn", "M0711_2esd", "M0097_1ctt", "M0732_1xs1"]
    mcsa_subset_fixed_ligand:
      dataset:
        subset_to_keys: ["M0664_2dhn", "M0711_2esd", "M0097_1ctt", "M0732_1xs1"]
    mcsa_subset_no_ligand:
      dataset:
        subset_to_keys: ["M0664_2dhn", "M0711_2esd", "M0097_1ctt", "M0732_1xs1"]

    # CCD fires only the omol ligand metrics (small_molecule_only) —
    # posebusters, bond_length, chiral_accuracy. No structure_prediction lDDT.
    # Base ccd.yaml already tags it small_molecule_only, so no override needed;
    # listing it here for visibility.
    ccd:
      dataset:
        transform:
          metrics_tags:
            - small_molecule_only

# =====================================================================
# Extra metrics — bond_length + chiral_accuracy gated to small_molecule_only
# (posebusters is already active via configs/metrics/design_metrics.yaml).
# chiral_accuracy is disabled project-wide because of an IndexError on cropped
# protein val examples (see configs/metrics/design_metrics.yaml). Gating it to
# small_molecule_only sidesteps that by only running on CCD / OMol-type data.
# =====================================================================
metrics:
  bond_length:
    _target_: proteinfoundation.metrics.bond_length_metric.InternalResidueBondMetric
    required_tags_any: ["small_molecule_only"]
  chiral_accuracy:
    _target_: rf3.metrics.chiral.ChiralAccuracy
    required_tags_any: ["small_molecule_only"]

# =====================================================================
# Model / features
# =====================================================================
# NOTE: chiral_accuracy metric was disabled in configs/metrics/design_metrics.yaml
# (commented out) due to crop-OOB IndexError. See that file for details.
nn:
  attention_type: flash
  use_torch_compile: true
  feats_pair_repr:
    - "rel_seq_sep"
    - "xt_bb_ca_pair_dists"
    - "x_sc_bb_ca_pair_dists"
    - "bond_mask"
    - "bond_order"
    - "is_aromatic"
    - "index_group_pair"
    - "molecule_idx_pair"

training:
  self_cond: true

# =====================================================================
# Hardware / dataloaders
# =====================================================================
hardware:
  accelerator: gpu
  ngpus_per_node_: 8
  nnodes_: 7
  ncpus_per_task_train_: 16

dataloaders:
  num_workers: 16
  prefetch_factor: 4  # Each worker keeps 4 batches queued; safer for mixed PDB/OMol parse latency
  train:
    dataloader_params:
      collate_fn:
        fixed_dimensions: {I: 256}  # Static padding so torch.compile sees one shape

opt:
  num_sanity_val_steps: 5

pretrain_ckpt_path: null
