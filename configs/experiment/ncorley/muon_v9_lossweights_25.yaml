# @package _global_
#
# (9) muon v9: v4 (clustered + centering 0.2) + per-token loss-weight upweights
# at an intermediate intensity. Additive formula w = 1 + Σ αₖ · is_k(atom_array).
# non_standard=2.5 → 3.5× weight on non-standard residues; unindexed=2.5 → 3.5×
# weight on unindexed source tokens. Sits between v4 (no upweight) and v8
# (α=5.0 → 6×) so we can read off the dose-response cleanly.

defaults:
  - /experiment/ncorley/muon_v4_centering_02
  - _self_

run_name_: 2026_05_07_muon_v9_lossweights_25_noprev_v5

loss_weights:
  non_standard: 2.5
  unindexed: 2.5
  sampled_tip_atom: 0.0

datasets:
  train:
    afdb_monomer:
      dataset:
        transform:
          loss_weight_cfg: ${loss_weights}
    omol:
      dataset:
        transform:
          loss_weight_cfg: ${loss_weights}
    plinder:
      dataset:
        transform:
          loss_weight_cfg: ${loss_weights}

log:
  tags: ["muon", "v9", "clustered", "compile_on", "fixpad", "centering-0p2", "lossweights-2p5"]
