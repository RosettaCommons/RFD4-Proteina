# @package _global_
# OMOL baseline: chirality feature is on by default (pipeline + feature factory)

defaults:
  - /datasets/train/distill/omol@datasets.train
  - /datasets/val/structure_prediction/ccd@datasets.val.ccd
  - override /metrics: omol_metrics
  - _self_

run_name_: 0414_omol_baseline

hardware:
  nnodes_: 1
  ngpus_per_node_: 8
  gpu_type_: "H200"

dataloaders:
  batch_size: 48
  num_workers: 16

opt:
  val_every_n_epochs: 1
  accumulate_grad_batches: 1

datasets:
  train:
    dataset:
      filters:
        - "data_id not in ['community/trans1x', 'reactivity/rgd', 'reactivity/RGD_radical', 'reactivity/pmechdb', 'reactivity/rmechdb', 'metal_complexes/reactivity', 'elytes/reactivity']"
        - "num_atoms <= 50"

log:
  wandb_resume: False
  tags: ["pretrain", "omol", "baseline"]
