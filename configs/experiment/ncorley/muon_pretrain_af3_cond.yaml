# @package _global_
#
# Single shared base for the muon v2-v8 experiment series (and any other
# downstream muon experiment that wants this mix). Universal settings:
# - torch.compile=ON, fixed-pad train (I=256), val stays dynamic (eager forward)
# - p_unindex_all=0.8 across the three tip-atom design tasks
# - Heavy tip_atom_partial_ligand on PLINDER and OMOL (AFDB keeps tip_atom_pocket)
# - Dataset weights: AFDB 0.7 / OMOL 0.2 / PLINDER 0.1
# - AF3 refolding oracle, SSE/rASA conditioning at p=0.1, 2 nodes x 8 GPU,
#   Muon optimizer routed at attention/transition weights.

defaults:
  # Train datasets
  - /datasets/train/distill/afdb_monomer_beta_coil@datasets.train.afdb_monomer
  - /datasets/train/distill/omol@datasets.train.omol
  - /datasets/train/plinder/plinder@datasets.train.plinder

  # Validation datasets
  - /datasets/val/unconditional@datasets.val.unconditional
  - /datasets/val/motif_scaffolding/unindexed_motif_scaffold_full@datasets.val.unindexed_motif_scaffold_full
  - /datasets/val/motif_scaffolding/indexed_motif_scaffold_full@datasets.val.indexed_motif_scaffold_full
  - /datasets/val/mcsa/mcsa_subset@datasets.val.mcsa_subset
  - /datasets/val/mcsa/mcsa_subset_fixed_ligand@datasets.val.mcsa_subset_fixed_ligand
  - /datasets/val/mcsa/mcsa_subset_no_ligand@datasets.val.mcsa_subset_no_ligand
  - /datasets/val/structure_prediction/ccd@datasets.val.ccd
  - /datasets/val/sm_binder@datasets.val.sm_binder
  - /datasets/val/sm_binder_fixed_ligand@datasets.val.sm_binder_fixed_ligand
  - /datasets/val/sm_binder_hbonds@datasets.val.sm_binder_hbonds
  - /datasets/val/rasa_IAI@datasets.val.rasa_IAI

  # Design task presets
  - /design_tasks/presets/motif_pretraining@_motif_scaffold_design_tasks
  - /design_tasks/presets/tip_atom_pocket_tasks@_tip_atom_design_tasks

  # AF3 refolding oracle
  - override /metrics/refolding_oracles: af3

  - _self_


run_name_: 2026_05_06_muon_pretrain_af3_cond_v3

# Bump p_unindex_all=0.8 on the three tip-atom tasks via the interpolation
# source consumed by AFDB (`design_tasks: ${_tip_atom_design_tasks}`).
_tip_atom_design_tasks:
  tip_atom_pocket:
    transform:
      p_unindex_all: 0.8
  tip_atom:
    transform:
      p_unindex_all: 0.8
  tip_atom_partial_ligand:
    transform:
      p_unindex_all: 0.8

datasets:
  global_design_task_kwargs:
    rasa_kwargs:
      p_add_rasa_condition: 0.2
    secondary_structure_kwargs:
      p_add_secondary_structure_condition: 0.1
    hbond_kwargs:
      p_add_hbond_condition: 0.1
    

  train:
    afdb_monomer:
      probability: 0.7
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}
    omol:
      probability: 0.2
      dataset:
        transform:
          design_tasks:
            folding:
              frequency: 1.0
              transform:
                _target_: proteinfoundation.transforms.design_task.StructurePredictionTask
                global_design_task_kwargs:
                  rasa_kwargs:
                    p_add_rasa_condition: 0.0
                  hbond_kwargs:
                    p_add_hbond_condition: 0.0
                  secondary_structure_kwargs:
                    p_add_secondary_structure_condition: 0.0
            partial_ligand:
              frequency: 3.0
              transform:
                _target_: proteinfoundation.transforms.design_task.PartialLigandTask
                min_coverage_fraction: 0.0
                max_coverage_fraction: 1.0
    plinder:
      probability: 0.1
      dataset:
        transform:
          design_tasks:
            tip_atom:
              frequency: 5.0
              transform:
                p_unindex_all: 0.8
            tip_atom_partial_ligand:
              frequency: 80.0
              transform:
                p_unindex_all: 0.8

log:
  tags: ["motif-scaffolding", "ame", "omol", "plinder", "pretrain", "muon", "af3-oracle", "sse-rasa-cond"]

dataloaders:
  batch_size: 24
  num_workers: 16
  train:
    dataloader_params:
      collate_fn:
        fixed_dimensions: {I: 256}
  val:
    dataloader_params:
      num_workers: 4
      collate_fn:
        fixed_dimensions: null

nn:
  use_torch_compile: true

opt:
  accumulate_grad_batches: 1
  val_start_epoch: 1   # skip prevalidate (no val before first training epoch)
  val_every_n_epochs: 10
  num_sanity_val_steps: 0
  muon_param_patterns:
    - '^nn\.transformer_layers\.\d+\.mhba\.(?!.*norm).*\.weight$'
    - '^nn\.transformer_layers\.\d+\.transition\.(?!.*norm).*\.weight$'

hardware:
  accelerator: gpu
  nnodes_: 2
  ngpus_per_node_: 8
  ncpus_per_task_train_: 16

pretrain_ckpt_path: null
