# @package _global_
###################################################################################
# Shared base for the 2026_07_02 hero runs (fresh from-scratch relaunch). The four
# lw_* variants inherit this and differ ONLY in _loss_weights.
#
# Base = pdb_val_15 recipe (PDB interfaces 15% + AFDB 75%, rmsnorm_torch) + the
# element-charge/metal fixes + is_backbone-fixed non-cysteine conditioning (p=0.05)
# + disco in online validation. 4 nodes.
###################################################################################

defaults:
  - /experiment/releases/2026_06_12_release_fast_pdb_val_15
  - /datasets/val/disco_subset@datasets.val.disco_subset
  - _self_

hardware:
  nnodes_: 4

datasets:
  global_design_task_kwargs:
    not_cysteine_kwargs:
      p_add_not_cysteine_condition: 0.05

# not_cysteine lives here (not in the frozen release recipe, whose feats_seq must match the
# 6/12 checkpoint). Hydra replaces lists rather than merging, so the full feats_seq is
# re-declared with "not_cysteine" appended after "hotspot".
nn:
  feats_seq: [
    "xt_bb_ca",
    "xt_local_latents",
    "x_sc_bb_ca",
    "x_sc_local_latents",
    "token_type",
    "cond_residue_type",
    "cond_a37coors_nm",
    "cond_a37coors_internal_nm",
    "rasa_binned",
    "secondary_structure",
    "hbond",
    "hotspot",
    "not_cysteine",               # Not-cysteine conditioning [b, n, 1]
    "atom_charge",
    "atomic_element",
    coord_group_seq,
    "chirality",
    "chain_centroid_xyz",
  ]
