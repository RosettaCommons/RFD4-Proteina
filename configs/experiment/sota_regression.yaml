# @package _global_
#
# Frozen sota recipe for test_sota_training_regression. Inherits the full sota recipe
# and pins the two datasets whose row sets the shared sources decide, so edits to those
# sources cannot move the committed losses. Read `experiment/sota` for current practice.
#
# Only the data is frozen. The model recipe stays live, which is the point: this test
# should catch code regressions and ignore data churn.
#
# Frozen per dataset: `data`, `filters`, `columns_to_load` (the filters read it), and
# `name`, which keys the metadata feather cache — a name shared with another dataset in
# the same slurm job shares that dataset's cached row set.

defaults:
  - /experiment/sota
  - _self_

run_name_: sota_regression

log:
  tags: ["sota", "regression"]

datasets:
  train:
    pdb_interfaces:
      dataset:
        name: pdb_interfaces_regression_pin
        data: ${oc.env:DATA_PATH}/train_datasets/pdb/pdb_interfaces.parquet
        filters:
          - "deposition_date < '2024-01-01'"
          - "resolution < 9.0"
          - "num_polymer_pn_units <= 30"
          - "interface_cluster.notnull()"
          - "~(pn_unit_1_non_polymer_res_names.notnull() and pn_unit_1_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
          - "~(pn_unit_2_non_polymer_res_names.notnull() and pn_unit_2_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
          - "is_inter_molecule"
          - "n_nuc == 0"
          - "validated == True"
        columns_to_load: [example_id, pdb_id, assembly_id, altloc_seed, path, deposition_date, resolution,
                          num_polymer_pn_units, method, interface_cluster, n_prot, n_nuc, n_ligand, n_peptide,
                          total_num_atoms_in_unprocessed_assembly, pn_unit_1_iid, pn_unit_2_iid,
                          pn_unit_1_non_polymer_res_names, pn_unit_2_non_polymer_res_names, is_inter_molecule,
                          all_pn_unit_iids_after_processing, involves_loi, pn_unit_1_type, pn_unit_2_type,
                          validated]

    ted_dimers:
      dataset:
        name: ted_dimers_regression_pin
        data: ${oc.env:DATA_PATH}/train_datasets/ted_dimers/data/ted_dimers_annotated.parquet
        # Ungated: the baselines predate the interface-quality gate. Empty and absent are
        # the same to the loader, which applies filters only when the list is truthy.
        filters: []
        columns_to_load: [example_id, path]
