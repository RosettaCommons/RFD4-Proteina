# @package _global_

defaults:
  - mkazman/ppi_base
  - /datasets/train/pdb/pdb_interfaces@datasets.train.pdb_interfaces
  - _self_

run_name: ppi_all_cath_sim_filtered


# Dataset mixing probabilities
datasets:
  train:
    afdb_monomer:
      probability: 0.25
    mgnify_june_2025:
      probability: 0.25
    afdb_dimer:
      probability: 0.25
      dataset:
        filters:
          # Filter by cath similarity
          - "strictest_matching_cath_tier.isna() or strictest_matching_cath_tier != 'H'"

          # Filter by sequence similarity (NW alignment with BLOSUM62)
          - "interface_sequence_identity < 0.8"

    pdb_interfaces:
      probability: 0.25
      dataset:
        filters:
          # Original filters
          - "deposition_date < '2021-09-30'"
          - "resolution < 9.0"
          - "num_polymer_pn_units <= 30"
          - "cluster.notnull()"
          - "~(pn_unit_1_non_polymer_res_names.notnull() and pn_unit_1_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
          - "~(pn_unit_2_non_polymer_res_names.notnull() and pn_unit_2_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
          - "is_inter_molecule"

          # Filter to only PPI
          - "pn_unit_1_type.astype('str').str.match('${chain_type_info_to_regex:PROTEINS}')"
          - "pn_unit_2_type.astype('str').str.match('${chain_type_info_to_regex:PROTEINS}')"

          # Exclude nucleic acids
          - "n_nuc == 0"

          # Filter by cath similarity
          - "strictest_matching_cath_tier.isna() or strictest_matching_cath_tier != 'H'"

          # Filter by sequence similarity (NW alignment with BLOSUM62)
          - "interface_sequence_identity < 0.8"