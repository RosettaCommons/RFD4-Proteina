# @package _global_
# New default starting point for pair_trimult-family runs, folding in a batch
# of fixes/knobs validated across the 2026-07 run sweep. All such runs should inherit
# from this file instead of directly from /experiment/ncorley/pair_trimult_every2, so
# this is the single place to make broad changes that should apply across the sweep.
#
# NOTE: uses sequential triangle-mult in the pair update every 2nd layer
# (nn.update_pair_repr_every_n=2, inherited from ncorley/pair_trimult_every2) --
# bumped up from the every-3rd-layer cadence used by earlier 2026-07 runs.
#
# Changes vs. pair_trimult_every2:
#   - Drop sm_binder_hbonds (set to null; assemble_val_loader_dict skips None entries).
#   - Add afdb_ss: AFDB secondary-structure conditioning benchmark (P-SEA labels,
#     10 balanced monomers). Chosen over the older ss_conditioned benchmark, which
#     afdb_ss's own docstring documents itself as superseding.
#   - Apply loss weighting to ALL train datasets. Upstream releases wire only
#     pdb_interfaces to ${_loss_weights} (a live interpolation); the other four
#     datasets are frozen to {0,0,0} by a YAML alias (*lw_params) in
#     2026_06_12_release.yaml that predates and ignores the override. We repoint
#     afdb_monomer/omol/plinder/ted_dimers at ${_loss_weights} so _loss_weights
#     (default 2.5/2.5/0 from the chain; overridden by lw_* configs) applies
#     across the whole data mix instead of just the ~15% pdb_interfaces slice.
#   - Widen the pair representation from 256 to 384 (nn.pair_repr_dim), matching the
#     muon-everywhere/pair-dim-384 arch-sweep run.
#   - Widen the triangle-multiplication hidden dim (nn.tri_mult_c) from its default
#     196 to 256, which is both faster (more optimal shape) and more expressive.
#   - Turn on secondary-structure conditioning at p=0.1 (off by default upstream).
#   - Turn on 25% internal-coordinate conditioning for every design task, across every
#     training dataset, that both (a) supports p_internal_coords in code and (b) is
#     actually active (frequency > 0) for that dataset in the pair_trimult mix.
#     Of all design tasks, only motif_scaffold and the three tip_atom* variants accept
#     p_internal_coords (MotifScaffoldTask, TipAtomTask, TipAtomPartialLigandTask,
#     TipAtomActiveSiteTask in rfproteina/transforms/design_task.py).
#     Active per training dataset in pair_trimult_every2:
#       afdb_monomer:   tip_atom, tip_atom_partial_ligand, motif_scaffold, tip_atom_pocket
#       plinder:        tip_atom_partial_ligand, tip_atom_pocket
#       ted_dimers:     motif_scaffold
#       pdb_interfaces: motif_scaffold
#       omol:           none of the 4 supported tasks are active here -- left untouched.
#   - Muon opt-out (this same PR) already applies by default in code, so no optimizer
#     config is needed here.
defaults:
  - /experiment/ncorley/pair_trimult_every2
  - /datasets/val/afdb_ss@datasets.val.afdb_ss
  - _self_

run_name_: 2026_07_13_runs_base

nn:
  pair_repr_dim: 384
  tri_mult_c: 256

_p_internal_coords: 0.25

datasets:
  global_design_task_kwargs:
    secondary_structure_kwargs:
      p_add_secondary_structure_condition: 0.1
  train:
    # Repoint the four alias-frozen datasets at the live ${_loss_weights} interpolation
    # (pdb_interfaces already uses it upstream), so loss weighting hits the whole mix.
    afdb_monomer:
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            motif_scaffold:
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom:
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_partial_ligand:
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_pocket:
              transform:
                p_internal_coords: ${_p_internal_coords}
    omol:
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
    plinder:
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            tip_atom_partial_ligand:
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_pocket:
              transform:
                p_internal_coords: ${_p_internal_coords}
    ted_dimers:
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            motif_scaffold:
              transform:
                p_internal_coords: ${_p_internal_coords}
    pdb_interfaces:
      dataset:
        transform:
          design_tasks:
            motif_scaffold:
              transform:
                p_internal_coords: ${_p_internal_coords}
  val:
    sm_binder_hbonds: null

inf_cfg:
  args:
    nsteps: 100
  model:
    bb_ca:
      simulation_step_params:
        sampling_mode: vf_tsr
        tsr_k: 16.0
        tsr_sigma: 3.0
    local_latents:
      simulation_step_params:
        sampling_mode: vf_tsr
        tsr_k: 4.0
        tsr_sigma: 8.0

log:
  tags: ["pair-dim-384", "ss-conditioning", "internal-coordinate-conditioning"]
