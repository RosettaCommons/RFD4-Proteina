# @package _global_

defaults:
  - mkazman/motif_scaffold_afdb

  # internal coordinate conditioning
  - /datasets/val/motif_scaffolding/indexed_motif_scaffold_internal_coords@datasets.val.indexed_motif_scaffold_internal_coords

  # Both motif scaffolding and tip atom tasks
  - /design_tasks/presets/tip_atom_pocket_tasks@datasets.train.afdb_monomer.dataset.transform.design_tasks

  - _self_

datasets:
  train:
    afdb_monomer:
      dataset:
        transform:
          design_tasks:
            motif_scaffold:
              transform:
                p_internal_coords: 0.33
            tip_atom:
              transform:
                p_internal_coords: 0.33
            tip_atom_partial_ligand:
              transform:
                p_internal_coords: 0.33
            tip_atom_pocket:
              transform:
                p_internal_coords: 0.33

run_name_: motif_scaffold_internal_coords_with_tip_atoms

log:
  tags: ["motif-scaffolding", "internal-coordinate-conditioning", "pretrain"]