# Default configs for inference through generate.py
# The defaults are geared more towards ease-of-use by designers, so running with
# the existing analysis scripts will necessitate overrides

defaults:
  - _self_
  - inference_experiment: inference_on_user_inputs # Default for design

# NOTE: The experiment configs can override values specified in this config

run_name_: inference

out_dir: null  # If null, defaults to ./runs/<run_name>. For production, set to an external
               # path (e.g. /path/to/shared/storage). SLURM scripts set this
               # automatically. All outputs (samples, metrics) go under this directory.

# The current SOTA checkpoint. This is the SINGLE source of truth for "the SOTA model":
# generate.py loads it by default, and the GPU regression tests + baseline generators read
# ckpt_name/ckpt_path straight from this file (see tests/e2e/helpers/regression_baselines.py).
# To advance SOTA: edit ckpt_name here and regenerate the e2e baselines. Override on the CLI
# for a one-off checkpoint.
ckpt_name: arch_sweep_2026_07_03_pair_trimult_every2_720k-ema.ckpt
ckpt_path: ${oc.env:DATA_PATH}/latent_checkpoints/ldm_checkpoints

# Only applies if the metrics_tags for a pre-oracle design filter are given.
# Determines whether to delete structure files for designs that fail this filter
delete_failing_pre_oracle: True

autoencoder_ckpt_path: ${oc.env:DATA_PATH}/latent_checkpoints/ae_checkpoints/AE_ucond_512.ckpt

num_replicates: 1 # Number of times to replicate each example

# Token counts to pad batches to for torch.compile. Multiples of 16; null disables.
compile_lengths: [128, 160, 192, 224, 256, 288, 320, 352, 384, 448, 512, 640, 768, 896, 1024]

batch_size: 1
subset_to_examples: null # If specified, only run inference on these example indices
seed: null # Will set a random seed if null
torch_deterministic: false  # Locks cuDNN/cuBLAS to deterministic algorithms; significantly reduces throughput
skip_existing: true # If true, skip examples whose output structure files already exist in the output directory
save_chain_of_interest: false # If true, write per-design chain-of-interest CIFs (only needed for foldseek clustering).
metrics_tags: [] # If specified, determines which metrics are computed during inference

# MSA module: override to true in experiment configs that set load_msa per-dataset
nn:
  use_msa_module: false

num_workers: 4  # Number of dataloader workers

hardware:
  accelerator: gpu
  ngpus_per_node_: 1
  nnodes_: 1

# Cluster job settings (used by launch_infer_from_local.sh)
ncpus_: 24  # Number of CPUs per task
gen_njobs: 1  # Number of parallel generation jobs per config
eval_njobs: 1  # Number of parallel evaluation jobs per config
job_id: null  # Set by launch_infer.sh; used to disambiguate per-job output files

hydra:
  run:
    dir: ./hydra_outputs
