# =============================================================================
# Search Strategy Comparison Sweep
# =============================================================================
# Sweeps over search strategies (vanilla, best-of-N, beam search) and their
# parameters to compare generation quality vs. compute trade-offs.
#
# Usage:
#   python script_utils/sweep.py --sweep-config configs/sweeps/search_strategy_sweep.yaml
# =============================================================================

base_config: inference

base_config_overrides:
  - inference_experiment=inference_like_rfd3
  - num_replicates=50

output_dir: ./configs/sweep_configs/search_strategy_sweep
run_name_prefix: search_cmp

sweep:
  # Search strategy to use
  inference_experiment:
    - inference_like_rfd3           # Vanilla
    - inference_test_search          # Best-of-N
    - inference_beam_example          # Beam search

  # Diffusion steps
  generation.args.nsteps:
    - 200
    - 400
