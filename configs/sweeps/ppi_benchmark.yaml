# =============================================================================
# PPI Binder Design Benchmark Sweep
# =============================================================================
# Sweeps over checkpoints and diffusion steps to find best generation settings.
#
# Usage:
#   python script_utils/sweep.py --sweep-config configs/sweeps/ppi_benchmark.yaml
#   python script_utils/sweep.py --sweep-config configs/sweeps/ppi_benchmark.yaml --dry-run
# =============================================================================

base_config: inference

# Apply these overrides before sweeping
base_config_overrides:
  - inference_experiment=inference_like_rfd3  # PPI-focused generation setup
  - num_replicates=100

# Output location for generated configs
output_dir: ./configs/sweep_configs/ppi_benchmark
run_name_prefix: ppi_bench

# Parameters to sweep (Cartesian product of all lists)
sweep:
  # Checkpoints to compare
  ckpt_name:
    - "model_epoch=00039_step=080000.ckpt"
    - "model_epoch=00079_step=160000.ckpt"

  # Diffusion steps: faster vs more accurate
  generation.args.nsteps:
    - 100
    - 200
    - 400

  # Temperature: exploration vs exploitation
  generation.args.temperature:
    - 0.5
    - 1.0
