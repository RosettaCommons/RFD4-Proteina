# Intended for debugging, could be used in gpu tests down the line
# Runs exactly one replicate of each val example in the sets listed below
# As more val sets are added to the codebase, they should be added here as well!

base_config: inference

base_config_overrides:
  - inference_experiment=inference_on_val_set
  - batch_size=2
  - num_replicates=1
  - ckpt_path=/path/to/data
  - ckpt_name=latest.ckpt

run_name_prefix: debug_all_val_sets

sweep_overrides:
  - "+datasets/val@generation=unconditional"
  - "+datasets/val@generation=unconditional_ig"
  - "+datasets/val@generation=motif_scaffolding/indexed_motif_scaffold_full"
  - "+datasets/val@generation=motif_scaffolding/unindexed_motif_scaffold_full"
  - "+datasets/val@generation=motif_scaffolding/indexed_motif_scaffold_internal_coords"
  - "+datasets/val@generation=mcsa/mcsa_full_fixed_ligand"
  - "+datasets/val@generation=mcsa/mcsa_subset_no_ligand"
  - "+datasets/val@generation=mcsa/mcsa_full"
  - "+datasets/val@generation=sm_binder"
  - "+datasets/val@generation=sm_binder_fixed_ligand"
  - "+datasets/val@generation=sm_binder_hbonds"
  - "+datasets/val@generation=rasa_IAI"
  - "+datasets/val@generation=all_ppi"

# Dummy value since sweep key is required (TODO: Patch that)
sweep:
  generation.args.nsteps:
    - 400