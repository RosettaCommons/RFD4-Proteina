# =============================================================================
# Smoke Test Sweep
# =============================================================================
# 4-config sweep (2 nsteps × 2 sc_scale_noise) to verify sweep.py +
# launch_sweep.sh integration with the refactored inference pipeline.
#
# Usage (one command — generates configs and submits all 4 as SLURM jobs):
#   ./slurm_utils/launch_sweep.sh digs \
#       --sweep-config configs/sweeps/smoke_test_sweep.yaml \
#       --no-copy \
#       ckpt_path=<CKPT_DIR> ckpt_name=<CKPT_NAME>.ckpt seed=42
#
# =============================================================================

base_config: inference

base_config_overrides:
  - inference_experiment=inference_on_val_set
  - +datasets/val@generation=unconditional
  - subset_to_examples=monomer-short
  - num_replicates=4
  - batch_size=2

run_name_prefix: smoke

sweep:
  generation.args.nsteps:
    - 200
    - 400
  generation.model.bb_ca.simulation_step_params.sc_scale_noise:
    - 0.1
    - 0.2
