# =============================================================================
# Offline Validation: Checkpoint Comparison Sweep
# =============================================================================
# Sweeps over checkpoints for offline validation on standard val sets.
# Useful for comparing model quality at different training steps.
#
# Usage:
#   python script_utils/sweep.py --sweep-config configs/sweeps/offline_val_ckpt_sweep.yaml
# =============================================================================

base_config: inference

base_config_overrides:
  - inference_experiment=inference_on_val_set

output_dir: ./configs/sweep_configs/offline_val_ckpt_sweep
run_name_prefix: offval

sweep:
  ckpt_name:
    - "model_epoch=00009_step=020000.ckpt"
    - "model_epoch=00019_step=040000.ckpt"
    - "model_epoch=00039_step=080000.ckpt"
    - "model_epoch=00059_step=120000.ckpt"
    - "model_epoch=00079_step=160000.ckpt"
