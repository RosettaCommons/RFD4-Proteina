# Validation debug sweep — 200 replicates of each online val set.
# Intended to quickly verify that changes to validation logic (metrics,
# scoring, output parsing, etc.) work correctly end-to-end across all
# val datasets used during training.
#
# Run command:
#   cd projects/proteinfoundation
#   ./slurm_utils/launch_sweep.sh <cluster> \
#       --sweep-config configs/sweeps/full_offline_val_rf3.yaml \
#       ckpt_path=<CKPT_PATH> ckpt_name=<CKPT_NAME>.ckpt

base_config: inference

base_config_overrides:
  - inference_experiment=inference_on_val_set
  - num_replicates=200
  - metrics/refolding_oracles=rf3

run_name_prefix: offline_val_rf3

sweep_overrides:
  # Bulk motif scaffolding
  - "+datasets/val@generation=motif_scaffolding/indexed_motif_scaffold_full"
  - "+datasets/val@generation=motif_scaffolding/unindexed_motif_scaffold_full"
  - "+datasets/val@generation=motif_scaffolding/indexed_motif_scaffold_internal_coords"

  # Tip-atom scaffolding
  - "+datasets/val@generation=mcsa/mcsa_full"
  # - "+datasets/val@generation=mcsa/mcsa_full_internal_coords"

  # Small molecule and metal binding
  - "+datasets/val@generation=sm_binder"
  - "+datasets/val@generation=studio_179"

  # Protein binder design
  - "+datasets/val@generation=ppi_subset"

  # Non-refolding datasets (tracking condition adherence)
  - "+datasets/val@generation=rasa_IAI"
  # - "+datasets/val@generation=ss_conditioned"
  - "+datasets/val@generation=sm_binder_hbonds"

# Dummy sweep key (required by sweep.py)
sweep:
  generation.args.nsteps:
    - 400
