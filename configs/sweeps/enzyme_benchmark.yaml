# =============================================================================
# Enzyme Design (Motif Scaffolding) Benchmark Sweep
# =============================================================================
# Sweeps over motif scaffolding parameters for MCSA active site benchmarks.
#
# Usage:
#   python script_utils/sweep.py --sweep-config configs/sweeps/enzyme_benchmark.yaml
# =============================================================================

base_config: inference

base_config_overrides:
  - inference_experiment=inference_like_rfd3
  - num_replicates=200

output_dir: ./configs/sweep_configs/enzyme_benchmark
run_name_prefix: enzyme_bench

sweep:
  ckpt_name:
    - "model_epoch=00039_step=080000.ckpt"
    - "model_epoch=00079_step=160000.ckpt"

  generation.args.nsteps:
    - 200
    - 400

  # Self-conditioning: important for motif scaffolding quality
  generation.args.self_cond:
    - true
    - false
