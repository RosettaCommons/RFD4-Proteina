# @package _global_
# Crop-256 exploration-k4 pre-training recipe; fine-tuning starts from its 320k EMA.
defaults:
# Shared streaming source definitions.
- /datasets/train/ae/afdb_monomer@_hero_streaming.afdb
- /datasets/train/ae/rna_monomer@_hero_streaming.rna

# Core training datasets.
- /datasets/train/flow/afdb_monomer@datasets.train.afdb_monomer
- /datasets/train/flow/omol@datasets.train.omol
- /datasets/train/flow/plinder@datasets.train.plinder
- /datasets/train/flow/pdb_interfaces@datasets.train.pdb_interfaces
- /datasets/train/flow/ted_dimers@datasets.train.ted_dimers
- /datasets/train/flow/tcr_interfaces_distill@datasets.train.tcr_interfaces_distill
- /datasets/train/flow/na_complex@datasets.train.na_complex
- /datasets/train/flow/rna_monomer@datasets.train.rna_monomer

# Structure generation and conditioning validation.
- /datasets/val/unconditional@datasets.val.unconditional
- /datasets/val/motif_scaffolding/unindexed_motif_scaffold_subset@datasets.val.unindexed_motif_scaffold_subset
- /datasets/val/motif_scaffolding/indexed_motif_scaffold_subset@datasets.val.indexed_motif_scaffold_subset
- /datasets/val/mcsa/mcsa_subset@datasets.val.mcsa_subset
- /datasets/val/mcsa/mcsa_subset_fixed_ligand@datasets.val.mcsa_subset_fixed_ligand
- /datasets/val/mcsa/mcsa_subset_no_ligand@datasets.val.mcsa_subset_no_ligand
- /datasets/val/ppi/ppi_bb_only_subset_12@datasets.val.ppi_bb_only_subset_12
- /datasets/val/dna_binder/dna_binder_structure_context@datasets.val.dna_binder_structure_context
- /datasets/val/dna_binder/dna_binder_sequence_context@datasets.val.dna_binder_sequence_context
- /datasets/val/small_molecule_binder/disco_subset@datasets.val.disco_subset
- /datasets/val/adherence@datasets.val.rasa_IAI: rasa_IAI

# Immune interfaces, sequence validation, cyclic peptides, and PDB–DNA interfaces.
- /datasets/train/flow/antibody_interfaces_distill@datasets.train.antibody_interfaces_distill
- /datasets/train/flow/tcr_interfaces_pdb@datasets.train.tcr_interfaces_pdb
- /datasets/train/flow/antibody_interfaces_pdb@datasets.train.antibody_interfaces_pdb
- /datasets/val/sequence_bias@datasets.val.sequence_bias
- /datasets/train/flow/cpsea_pdb@datasets.train.cpsea_pdb
- /datasets/train/flow/cpsea_afdb@datasets.train.cpsea_afdb
- /datasets/train/flow/pdb_dna_interface@datasets.train.pdb_dna_interface

# Task presets, validation oracles, and generation recycle schedule.
- override /design_tasks/presets@datasets.train.afdb_monomer.dataset.transform.design_tasks: tip_atom_pocket_tasks
- override /design_tasks/presets@datasets.train.pdb_interfaces.dataset.transform.design_tasks: ppi_motif_scaffold_with_tip_atom
- override /design_tasks/presets@datasets.train.rna_monomer.dataset.transform.design_tasks: rna_design
- override /metrics/refolding_oracles: af3
- override /recycle_strategy: thinking_medium
- override /datasets/val/adherence@datasets.val.rasa_IAI: null
- override /design_tasks/presets@_hero_streaming.rna.dataset.transform.design_tasks: rna_design
- override /metrics/pre_oracle_filters: null
- _self_

# Conditioning probabilities shared across training tasks.
datasets:
  global_design_task_kwargs:
    rasa_kwargs:
      p_add_rasa_condition: 0.6
    hbond_kwargs:
      p_add_hbond_condition: 0.2
    pistack_kwargs:
      p_add_pistack_condition: 0.2
    pication_kwargs:
      p_add_pication_condition: 0.2
    salt_kwargs:
      p_add_salt_condition: 0.2
    hydrophobic_kwargs:
      p_add_hydrophobic_condition: 0.2
    metal_kwargs:
      p_add_metal_condition: 0.2
    secondary_structure_kwargs:
      p_add_secondary_structure_condition: 0.1
    cath_kwargs:
      p_add_cath_cat_condition: 0.9
    sequence_probability_kwargs:
      p_exact: 0.5
      p_zero_only: 0.17
      p_positive_only: 0.17
      p_zero_and_positive: 0.16
      p_augment_unconditioned: 0.2
      p_zero_only_whole_chain: 0.5

  # Mixture weights and dataset-specific crop/task overrides.
  train:
    # Protein monomers: folding, inverse folding, motifs, and pocket design.
    afdb_monomer:
      dataset:
        transform:
          crop_size: null
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            unconditional:
              frequency: 20.0
            folding:
              frequency: 10.0
            inverse_folding:
              frequency: 10.0
            tip_atom:
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_partial_ligand:
              frequency: 0.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            motif_scaffold:
              frequency: 15.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_pocket:
              frequency: 35.0
              transform:
                p_internal_coords: ${_p_internal_coords}
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
        loader: ${_hero_streaming.afdb.dataset.loader}
        data: ${_hero_streaming.afdb.dataset.data}
        columns_to_load: ${_hero_streaming.afdb.dataset.columns_to_load}
        filters:
        - n_standard_amino_acid_residues <= ${_max_tokens}
      probability: 0.715

    # Small molecules: coordinate generation and partial-ligand conditioning.
    omol:
      dataset:
        transform:
          crop_size: null
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            unconditional:
              frequency: 0.0
              transform:
                rasa_kwargs:
                  p_add_rasa_condition: 0.0
                hbond_kwargs:
                  p_add_hbond_condition: 0.0
            folding:
              frequency: 0.01
              transform:
                rasa_kwargs:
                  p_add_rasa_condition: 0.0
                hbond_kwargs:
                  p_add_hbond_condition: 0.0
            partial_ligand:
              frequency: 0.99
              transform:
                p_fix_ligand_surroundings: 1.0
                rasa_kwargs:
                  p_add_rasa_condition: 0.0
                hbond_kwargs:
                  p_add_hbond_condition: 0.0
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.01

    # Protein–ligand complexes: ligand pockets and partial-ligand tasks.
    plinder:
      dataset:
        transform:
          crop_size: null
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            unconditional:
              frequency: 25.0
            tip_atom_partial_ligand:
              frequency: 20.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_pocket:
              frequency: 15.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            partial_ligand:
              frequency: 30.0
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.035

    # PDB interfaces: binder, motif, pocket, and nucleic-acid tasks.
    pdb_interfaces:
      weights:
        alphas:
          a_ligand: 0.1
          a_loi: 0.5
      dataset:
        transform:
          crop_size: null
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            unconditional:
              frequency: 5.0
            tip_atom:
              frequency: 4.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_partial_ligand:
              frequency: 10.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            motif_scaffold:
              frequency: 5.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            binder_hotspot_with_3d_target:
              frequency: 60.0
              transform:
                p_bb_only_coord_conditioning: 0.5
                target_chain_types:
                - POLYPEPTIDE_L
                - POLYPEPTIDE_D
                - DNA
                - RNA
            tip_atom_pocket:
              frequency: 5.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            inverse_folding_na:
              frequency: 1.0
              transform:
                _target_: rfproteina.transforms.design_task.InverseFoldingTask
                polymer_types:
                - dna
                - rna
                global_design_task_kwargs: ${datasets.global_design_task_kwargs}
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.145

    # Distilled protein–protein and TCR interfaces.
    ted_dimers:
      dataset:
        transform:
          crop_size: null
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            motif_scaffold:
              transform:
                p_internal_coords: ${_p_internal_coords}
            binder_hotspot_with_3d_target:
              transform:
                p_bb_only_coord_conditioning: 0.5
                target_chain_types:
                - POLYPEPTIDE_L
                - POLYPEPTIDE_D
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.05
    tcr_interfaces_distill:
      dataset:
        transform:
          crop_size: null
          loss_weight_cfg: ${_loss_weights}
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.005

    # Protein–DNA distillation: fixed DNA identity with fixed or generated coordinates.
    na_complex:
      dataset:
        transform:
          crop_size: null
          crop_spatial_probability: 0.0
          dna_contact_crop_probability: 1.0
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            folding:
              frequency: 5.0
            inverse_folding:
              frequency: 10.0
            binder_hotspot_with_3d_target:
              frequency: 3.0
              transform:
                p_bb_only_coord_conditioning: 0.5
                target_chain_types:
                - POLYPEPTIDE_L
                - POLYPEPTIDE_D
                - DNA
                - RNA
            protein_from_dna_structure_context:
              frequency: 40.0
            protein_from_dna_sequence_context:
              frequency: 40.0
              transform:
                global_design_task_kwargs: null
                cath_kwargs: ${datasets.global_design_task_kwargs.cath_kwargs}
            inverse_folding_na:
              frequency: 2.0
              transform:
                _target_: rfproteina.transforms.design_task.InverseFoldingTask
                polymer_types:
                - dna
                - rna
                global_design_task_kwargs: ${datasets.global_design_task_kwargs}
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.003

    # RNA monomers and antibody/TCR interfaces.
    rna_monomer:
      dataset:
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.01
    antibody_interfaces_distill:
      dataset:
        transform:
          crop_size: null
          loss_weight_cfg: ${_loss_weights}
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.005
    tcr_interfaces_pdb:
      dataset:
        transform:
          crop_size: null
          loss_weight_cfg: ${_loss_weights}
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.005
    antibody_interfaces_pdb:
      dataset:
        transform:
          crop_size: null
          loss_weight_cfg: ${_loss_weights}
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.005

    # Cyclic peptides and experimental protein–DNA interfaces.
    cpsea_pdb:
      dataset:
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.005
    cpsea_afdb:
      dataset:
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
      probability: 0.005
    pdb_dna_interface:
      dataset:
        transform: ${datasets.train.na_complex.dataset.transform}
      probability: 0.002

  # Validation coverage: aligned MCSA subsets and the full PPI target list.
  val:
    mcsa_subset_fixed_ligand:
      dataset:
        subset_to_keys: ${datasets.val.mcsa_subset.dataset.subset_to_keys}
    mcsa_subset_no_ligand:
      dataset:
        subset_to_keys: ${datasets.val.mcsa_subset.dataset.subset_to_keys}
    ppi_bb_only_subset_12:
      dataset:
        subset_to_keys: null

# Batch sizes, prefetching, and fixed padding budgets.
dataloaders:
  batch_size: 4
  prefetch_factor: 8
  train:
    dataloader_params:
      in_order: true
      collate_fn:
        fixed_dimensions:
          I: ${_max_tokens}
  val:
    dataloader_params:
      batch_size: 5
      num_workers: 4
      collate_fn:
        fixed_dimensions:
          I: ${_val_compile_lengths}

# Model input features and pair-update implementation.
nn:
  update_pair_repr_every_n: 2
  recycle:
    grad: last
  feats_seq:
  - xt_bb_ca
  - xt_local_latents
  - token_type
  - sequence_probabilities
  - cond_a37coors_nm
  - cond_a37coors_internal_nm
  - rasa_binned
  - secondary_structure
  - hbond_modernized
  - pistack
  - pication
  - saltbridge
  - hydrophobic
  - metal_coord
  - na_ss_state
  - hotspot
  - atom_charge
  - atomic_element
  - coord_group_seq
  - chirality
  - chain_centroid_xyz
  feats_cond_seq:
  - time_emb_bb_ca
  - time_emb_local_latents
  - cath_code
  - recycle_remaining
  pair_repr_dim: 384
  tri_mult_backend: cuequivariance

# Validation generation and pre-oracle filtering.
generation:
  compile_lengths: ${_val_compile_lengths}
metrics:
  pre_oracle_filters: {}

# Run name and distributed allocation.
run_name_: unified_hero_exploration_k4_n64
hardware:
  ngpus_per_node_: 8
  nnodes_: 64
  ncpus_per_task_train_: 16

# Center coordinate noise independently within each molecule.
product_flowmatcher:
  bb_ca:
    stochastic_centering_scope: per_group
    stochastic_centering_group_keys:
    - molecule_iid

# Autoencoder weights used by the flow model.
autoencoder_ckpt_path: ${oc.env:DATA_PATH}/ae_checkpoints/rfd4-proteina-ae-release-2026-10-19.ckpt

# Training recycle-depth sampling and validation-loss depth.
training:
  exploration_k: 4
  n_recycle_max: 9
  n_recycle_sampler: poisson
  n_recycle_sync: true
  n_recycle_val_loss: 3

# Optimizer warmup, Adam-only parameter groups, and validation startup.
opt:
  adam_warmup_steps: 10000
  muon_exclude_param_patterns:
  - _factory\.
  - ^nn\.(local_latents_linear|ca_linear|insertion_q_proj|insertion_k_proj)\.
  - ^nn\.sequence_readout\.
  num_sanity_val_steps: 2
  coordinate_descent_tuning: false

# Run tags and rolling-checkpoint cadence.
log:
  tags:
  - unified-hero
  - cath90
  - full-ppi
  last_ckpt_every_n_epochs: 5

# Reproducibility, vocabulary, crop sizes, and conditioning/loss constants.
seed: 145
use_unified_ae_encoding: true
_max_tokens: 256
_val_compile_lengths:
- 256
- 320
- 384
- 448
- 512
- 560
- 608
_crop_size_range:
- 0.9
- 1.0
_p_no_subcrop: 0.2
_p_internal_coords: 0.25
_loss_weights:
  non_standard: 2.5
  unindexed: 2.5
  sampled_tip_atom: 0.0
_centroid_noise_std_angstrom: 2.5
