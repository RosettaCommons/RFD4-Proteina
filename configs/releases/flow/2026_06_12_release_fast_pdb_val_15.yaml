# @package _global_
###################################################################################
# Release recipe with the pdb_val_15 data mix and the RMSNorm training speedup.
#
# Data mix: PDB multiconformer interfaces (validated-only, base pdb_interfaces) at 15% +
# AFDB monomers at 75% — the strongest PDB-interface mix from the 2026_06 data-mix
# sweep (leads enzyme and disco refolding).
#
# Speedup: nn.norm_type=rmsnorm_torch swaps the trunk LayerNorms for RMSNorm
# (quality-neutral, ~+2.5% throughput; see compile_speedup_research.md). This is
# the only opt-in switch — nn.norm_type defaults to layer_norm everywhere else.
###################################################################################

defaults:
  - /releases/flow/2026_06_12_release
  - /datasets/train/flow/pdb_interfaces@datasets.train.pdb_interfaces
  - _self_

run_name_: 2026_06_12_release_fast_pdb_val_15

nn:
  norm_type: rmsnorm_torch

datasets:
  train:
    afdb_monomer: {probability: 0.75}
    omol: {probability: 0.04}
    plinder: {probability: 0.03}
    ted_dimers: {probability: 0.03}
    pdb_interfaces:
      probability: 0.15
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
