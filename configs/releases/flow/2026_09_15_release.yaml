# @package _global_

defaults:
  # +--------- Training datasets ---------+

  # Protein-only
  - /datasets/train/flow/afdb_monomer@datasets.train.afdb_monomer

  # Small molecule-only
  - /datasets/train/flow/omol@datasets.train.omol

  # PDB- and PDB-derived datasets
  - /datasets/train/flow/plinder@datasets.train.plinder
  - /datasets/train/flow/pdb_interfaces@datasets.train.pdb_interfaces

  # Protein-protein distillation
  - /datasets/train/flow/ted_dimers@datasets.train.ted_dimers

  # TCR distillation (AlphaFold2, Ig-region-annotated)
  - /datasets/train/flow/tcr_interfaces_distill@datasets.train.tcr_interfaces_distill

  # DNA complex
  - /datasets/train/flow/na_complex@datasets.train.na_complex

  # RNA monomer
  - /datasets/train/flow/rna_monomer@datasets.train.rna_monomer

  # +--------- Validation datasets ---------+

  # Protein-only
  - /datasets/val/unconditional@datasets.val.unconditional
  - /datasets/val/motif_scaffolding/unindexed_motif_scaffold_subset@datasets.val.unindexed_motif_scaffold_subset
  - /datasets/val/motif_scaffolding/indexed_motif_scaffold_subset@datasets.val.indexed_motif_scaffold_subset

  # Enzyme design
  - /datasets/val/mcsa/mcsa_subset@datasets.val.mcsa_subset
  - /datasets/val/mcsa/mcsa_subset_fixed_ligand@datasets.val.mcsa_subset_fixed_ligand
  - /datasets/val/mcsa/mcsa_subset_no_ligand@datasets.val.mcsa_subset_no_ligand

  # Protein binder design
  - /datasets/val/ppi/ppi_bb_only_subset_12@datasets.val.ppi_bb_only_subset_12

  # DNA binder design: fixed DNA sequence, with fixed or generated DNA coordinates.
  - /datasets/val/dna_binder/dna_binder_structure_context@datasets.val.dna_binder_structure_context
  - /datasets/val/dna_binder/dna_binder_sequence_context@datasets.val.dna_binder_sequence_context

  # Small molecule binder design
  - /datasets/val/small_molecule_binder/disco_subset@datasets.val.disco_subset

  # Conditioning adherence
  - /datasets/val/adherence@datasets.val.rasa_IAI: rasa_IAI

  # +--------- Design task presets ---------+
  # AFDB monomers use the tip-atom pocket task mix.
  - override /design_tasks/presets@datasets.train.afdb_monomer.dataset.transform.design_tasks: tip_atom_pocket_tasks
  # Rich pdb-interface mix: binder-with-target + motif scaffold + tip-atom pocket/ligand.
  - override /design_tasks/presets@datasets.train.pdb_interfaces.dataset.transform.design_tasks: ppi_motif_scaffold_with_tip_atom
  # RNA monomers need the NA-aware inverse-folding/design mix.
  - override /design_tasks/presets@datasets.train.rna_monomer.dataset.transform.design_tasks: rna_design

  # +--------- Metrics + validation-generation recycle schedule ---------+
  - override /metrics/refolding_oracles: af3
  - override /recycle_strategy: thinking_medium

  - _self_

# Use a distinct run name when launching a new training run.
run_name_: 2026_09_13_recycle_pair256_optimized_baseline

# +--------- Autoencoder ---------+
# Unified protein/RNA/DNA z16 autoencoder at 400k steps.
autoencoder_ckpt_path: ${oc.env:DATA_PATH}/ae_checkpoints/2026_09_04_release_ae_z16_400k-ema.ckpt
use_unified_ae_encoding: true

# +--------- Constants ---------+
# Crop cap, training length filter, and training padding budget in tokens.
_max_tokens: 256
# Validation padding/compilation buckets.
_val_compile_lengths: [256, 320, 384]
# Keep the capped crop with probability _p_no_subcrop; otherwise sample its size in _crop_size_range.
_crop_size_range: [0.9, 1.0]
_p_no_subcrop: 0.2
# Internal-coordinate conditioning probability on supporting design tasks.
_p_internal_coords: 0.25
# Additive per-token loss weights.
_loss_weights:
  non_standard: 2.5
  unindexed: 2.5
  sampled_tip_atom: 0.0

# +--------- Architecture ---------+
nn:
  norm_type: rmsnorm_torch_fused  # Preserve BF16 activations with fused normalization.
  pair_repr_dim: 256
  tri_mult_c: 256
  update_pair_repr: true
  use_tri_mult: true
  update_pair_repr_every_n: 2
  pair_write: hadamard
  use_torch_compile: true  # Compile individual trunk blocks.
  checkpointing: none  # No activation checkpointing.
  recycle:
    enabled: true
    grad: last  # Backpropagate through only the final recycle.

  # Input features.
  feats_seq: [
    "xt_bb_ca",
    "xt_local_latents",
    "token_type",
    "cond_residue_type",
    "cond_a37coors_nm",
    "cond_a37coors_internal_nm",
    "rasa_binned",
    "secondary_structure",
    "hbond_modernized",
    "pistack",
    "pication",
    "na_ss_state",
    "hotspot",
    "atom_charge",
    "atomic_element",
    "coord_group_seq",
    "chirality",
    "chain_centroid_xyz",
  ]

  feats_pair_repr: [
    "xt_bb_ca_pair_dists",
    "bond_mask",
    "bond_order",
    "is_aromatic",
    "index_group_pair",
    "molecule_idx_pair",
    "molecule_entity_pair",
    "token_bond_path_length",
    "canonical_polymer_ordering",
    "na_ss_pair",
  ]

# +--------- Recycling ---------+
training:
  n_recycle_sampler: poisson
  n_recycle_lambda: 3.0
  n_recycle_max: 6
  n_recycle_sync: true
  n_recycle_val_loss: 3

# +--------- Conditioning probabilities (all design tasks) ---------+
datasets:
  global_design_task_kwargs:
    rasa_kwargs:
      p_add_rasa_condition: 0.6
    hbond_kwargs:
      p_add_hbond_condition: 0.2
    cath_kwargs:
      p_add_cath_c_condition: 0.1
      p_add_cath_ca_condition: 0.1
      p_add_cath_cat_condition: 0.1
    pistack_kwargs:
      p_add_pistack_condition: 0.2
    pication_kwargs:
      p_add_pication_condition: 0.2
    secondary_structure_kwargs:
      p_add_secondary_structure_condition: 0.1

  # +--------- Training datasets: mix weights + transform pipeline ---------+
  # Probabilities sum to 1.0; datasets share the crop budget and loss weights.
  train:
    # --- Protein backbone (AFDB monomers) ---
    afdb_monomer:
      probability: 0.71
      dataset:
        filters: ["length <= ${_max_tokens}"]
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            tip_atom:
              frequency: 10.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_partial_ligand:
              frequency: 0.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            motif_scaffold:
              frequency: 15.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_pocket:
              frequency: 35.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            unconditional: {frequency: 20.0}
            folding: {frequency: 10.0}
            inverse_folding: {frequency: 10.0}

    # --- PDB interfaces: binders, scaffolds, and ligand pockets ---
    pdb_interfaces:
      probability: 0.16
      dataset:
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            binder_hotspot_with_3d_target:
              frequency: 40.0
              transform:
                target_chain_types: [POLYPEPTIDE_L, POLYPEPTIDE_D, DNA, RNA]
                # Equal mix of backbone-only and all-atom target coordinates.
                p_bb_only_coord_conditioning: 0.5
            inverse_folding_na:
              frequency: 1.0
              transform:
                _target_: rfproteina.transforms.design_task.InverseFoldingTask
                polymer_types: [dna, rna]
                global_design_task_kwargs: ${datasets.global_design_task_kwargs}
            motif_scaffold:
              frequency: 5.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom:
              frequency: 4.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_partial_ligand:
              frequency: 10.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_pocket:
              frequency: 5.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            unconditional: {frequency: 25.0}
            folding: {frequency: 5.0}
            inverse_folding: {frequency: 5.0}

    # --- Protein-protein distillation (TED dimers) ---
    ted_dimers:
      probability: 0.05
      dataset:
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            binder_hotspot_with_3d_target:
              transform:
                target_chain_types: [POLYPEPTIDE_L, POLYPEPTIDE_D]
                # Equal mix of backbone-only and all-atom target coordinates.
                p_bb_only_coord_conditioning: 0.5
            motif_scaffold:
              transform:
                p_internal_coords: ${_p_internal_coords}

    # --- Protein-DNA complexes ---
    na_complex:
      probability: 0.005
      dataset:
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
          crop_spatial_probability: 0.0
          dna_contact_crop_probability: 1.0
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            protein_from_dna_structure_context: {frequency: 40.0}
            protein_from_dna_sequence_context:
              frequency: 40.0
              transform:
                global_design_task_kwargs: null  # Condition on DNA sequence while generating coordinates.
            binder_hotspot_with_3d_target:
              frequency: 3.0
              transform:
                target_chain_types: [POLYPEPTIDE_L, POLYPEPTIDE_D, DNA, RNA]
                # Equal mix of backbone-only and all-atom target coordinates.
                p_bb_only_coord_conditioning: 0.5
            inverse_folding_na:
              frequency: 2.0
              transform:
                _target_: rfproteina.transforms.design_task.InverseFoldingTask
                polymer_types: [dna, rna]
                global_design_task_kwargs: ${datasets.global_design_task_kwargs}
            folding: {frequency: 5.0}
            inverse_folding: {frequency: 10.0}

    # --- RNA monomers ---
    rna_monomer:
      probability: 0.01
      dataset:
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
          loss_weight_cfg: ${_loss_weights}

    # --- Small molecules (OMol) ---
    omol:
      probability: 0.03
      dataset:
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            folding:
              frequency: 1.0
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
            unconditional:
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
            partial_ligand:
              frequency: 3.0
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}

    # --- Protein-ligand complexes (PLINDER) ---
    plinder:
      probability: 0.03
      dataset:
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
          loss_weight_cfg: ${_loss_weights}
          design_tasks:
            tip_atom_partial_ligand:
              frequency: 20.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            tip_atom_pocket:
              frequency: 15.0
              transform:
                p_internal_coords: ${_p_internal_coords}
            unconditional: {frequency: 25.0}
            folding: {frequency: 5.0}
            inverse_folding: {frequency: 5.0}
            partial_ligand: {frequency: 30.0}

    # --- TCR interface distillation ---
    tcr_interfaces_distill:
      probability: 0.005
      dataset:
        transform:
          crop_size: null
          crop_size_range: ${_crop_size_range}
          max_crop_size: ${_max_tokens}
          p_no_subcrop: ${_p_no_subcrop}
          loss_weight_cfg: ${_loss_weights}

  # +--------- Validation datasets ---------+
  # Fixed/no-ligand enzyme variants use the same subset as the main enzyme validation set.
  val:
    mcsa_subset_fixed_ligand:
      dataset: {subset_to_keys: "${datasets.val.mcsa_subset.dataset.subset_to_keys}"}
    mcsa_subset_no_ligand:
      dataset: {subset_to_keys: "${datasets.val.mcsa_subset.dataset.subset_to_keys}"}

# +--------- Generation (validation sampling) ---------+
generation:
  compile_lengths: ${_val_compile_lengths}

# +--------- Dataloaders ---------+
dataloaders:
  batch_size: 8
  val:
    dataloader_params:
      num_workers: 4
      batch_size: 5
      collate_fn:
        fixed_dimensions: {I: "${_val_compile_lengths}"}
  train:
    dataloader_params:
      collate_fn:
        fixed_dimensions: {I: "${_max_tokens}"}

# +--------- Optimization ---------+
opt:
  num_sanity_val_steps: 0
  coordinate_descent_tuning: false
  # Use Adam for input embeddings, output heads, and the pair-recycle projection.
  muon_exclude_param_patterns:
    - '_factory\.'
    - '^nn\.(local_latents_linear|ca_linear|insertion_q_proj|insertion_k_proj)\.'
    - '^nn\.z_cycle_proj\.'

# +--------- Hardware ---------+
hardware:
  nnodes_: 3
  ngpus_per_node_: 8
  ncpus_per_task_train_: 16

# +--------- Logging ---------+
log:
  tags: [pair-256, trimult-256, recycle-last, carry-baseline, bf16-optimized, recycle-adam, bs8]
