# @package _global_

# Released recipe for the 340k EMA checkpoint from
# sequence_probability_no_ncys_adam_readout_v4.
defaults:
  - /datasets/train/ae/afdb_monomer_streaming@_hero_streaming.afdb
  - /datasets/train/ae/rna_monomer_streaming@_hero_streaming.rna
  - /releases/flow/2026_09_18_sequence_probability_hero
  - override /design_tasks/presets@_hero_streaming.rna.dataset.transform.design_tasks: rna_design
  - _self_

run_name_: 2026_09_28_sequence_probability_v4

product_flowmatcher:
  bb_ca:
    stochastic_centering_scope: per_group
    stochastic_centering_group_keys: [molecule_iid]

training:
  n_recycle_max: 9

nn:
  feats_cond_seq: [time_emb_bb_ca, time_emb_local_latents, cath_code, recycle_index]
  feats_seq: [
    "xt_bb_ca",
    "xt_local_latents",
    "token_type",
    "sequence_probabilities",
    "cond_a37coors_nm",
    "cond_a37coors_internal_nm",
    "rasa_binned",
    "secondary_structure",
    "hbond_modernized",
    "pistack",
    "pication",
    "saltbridge",
    "hydrophobic",
    "metal_coord",
    "na_ss_state",
    "hotspot",
    "atom_charge",
    "atomic_element",
    "coord_group_seq",
    "chirality",
    "chain_centroid_xyz",
  ]

hardware:
  nnodes_: 32

datasets:
  train:
    afdb_monomer:
      dataset:
        data: ${_hero_streaming.afdb.dataset.data}
        loader: ${_hero_streaming.afdb.dataset.loader}
        columns_to_load: ${_hero_streaming.afdb.dataset.columns_to_load}
        filters: ["n_standard_amino_acid_residues <= ${_max_tokens}"]
    rna_monomer:
      # Replace the LMDB constructor completely; retain the hero's probability and flow tasks.
      dataset: ${_hero_streaming.rna.dataset}

opt:
  muon_warmup_steps: 0
  adam_warmup_steps: 10000
  muon_exclude_param_patterns:
    - '_factory\.'
    - '^nn\.(local_latents_linear|ca_linear|insertion_q_proj|insertion_k_proj)\.'
    - '^nn\.sequence_readout\.'
