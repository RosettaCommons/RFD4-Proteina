# @package _global_

###################################################################################
# The original experiment config is in experiment/mkazman/batch_5/30_hero_baseline_centroid_rasa_abs_coord.yaml
# This config should reproduce training results for released checkpoint on Friday 6/12/2026.
# There are some reversions in this config to match what was trained on. Any other
# discrepancies are commented throughout this config.
###################################################################################

defaults:
  # Train datasets
  - /datasets/train/flow/afdb_monomer@datasets.train.afdb_monomer
  - /datasets/train/flow/omol@datasets.train.omol
  - /datasets/train/flow/plinder@datasets.train.plinder
  - /datasets/train/flow/ted_dimers@datasets.train.ted_dimers

  # Validation datasets
  - /datasets/val/unconditional@datasets.val.unconditional
  - /datasets/val/motif_scaffolding/unindexed_motif_scaffold_subset@datasets.val.unindexed_motif_scaffold_subset
  - /datasets/val/motif_scaffolding/indexed_motif_scaffold_subset@datasets.val.indexed_motif_scaffold_subset
  - /datasets/val/mcsa/mcsa_subset@datasets.val.mcsa_subset
  - /datasets/val/mcsa/mcsa_subset_fixed_ligand@datasets.val.mcsa_subset_fixed_ligand
  - /datasets/val/mcsa/mcsa_subset_no_ligand@datasets.val.mcsa_subset_no_ligand
  - /datasets/val/adherence/rasa_IAI@datasets.val.rasa_IAI
  - /datasets/val/ppi/ppi_all_atom_subset_12@datasets.val.ppi_all_atom_subset_12

  # Design task presets
  - /design_tasks/presets@_tip_atom_design_tasks: tip_atom_pocket_tasks

  # AF3 refolding oracle
  - override /metrics/refolding_oracles: af3

  - _self_


run_name_: 34_repro_hero_genie_lw_scratch

# pretrain_ckpt_path: /path/to/user-data/mkazman/PFM_runs/train_latents/34_hero_baseline_genie3_lw_fixed/runs/34_hero_baseline_genie3_lw_fixed/checkpoints/chk_epoch_00000169_step_000000680000.ckpt

# NOTE: Loss weights used to be by default off when this was originally trained. Here we turn them off to match what was trained
_loss_weights:
  non_standard: 0.0
  unindexed: 0.0
  sampled_tip_atom: 0.0

datasets:
  global_design_task_kwargs:
    rasa_kwargs:
      p_add_rasa_condition: 0.6
    hbond_kwargs:
      p_add_hbond_condition: 0.2

  train:
    # !! NOTE: We changed the default afdb_monomer dataset to use the new genie3 dataset. This seems strictly better
    # If you want to reproduce this training run exactly you will need to go back to our older version:
    # Squash file: latent_data/train_datasets/afdb_monomer/genie3_afdb_32_512_extracted.sqfs
    # Parquet file: latent_data/train_datasets/afdb_monomer/afdb_genie3_32_512.parquet
    afdb_monomer:
      probability: 0.75
      dataset:
        transform:
          design_tasks: ${_tip_atom_design_tasks}   # RASA 0.6 via all_off (good amount)
          loss_weight_cfg: ${_loss_weights}
    omol:
      probability: 0.1
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
          # NO RASA on omol: p_add_rasa_condition 0.0 on every active task.
          design_tasks:
            folding:
              frequency: 1.0
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
            unconditional:
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
            partial_ligand:
              frequency: 3.0
              transform:
                rasa_kwargs: {p_add_rasa_condition: 0.0}
                hbond_kwargs: {p_add_hbond_condition: 0.0}
                min_coverage_fraction: 0.0
                max_coverage_fraction: 1.0
    ted_dimers:
      probability: 0.05    # low-% PPI dimers; RASA 0.6 via all_off (good amount)
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}
    plinder:
      probability: 0.1
      dataset:
        transform:
          loss_weight_cfg: ${_loss_weights}

  # MCSA validation subsets use 15 supported targets across all three variants.
  val:
    mcsa_subset:
      dataset:
        subset_to_keys: &mcsa_15_keys
          - M0040_13pk
          - M0058_1cju
          - M0092_1dli
          - M0097_1ctt
          - M0151_1q0n
          - M0209_1lij
          - M0349_1e3v
          - M0375_4ts9
          - M0500_1e3i
          - M0552_1fgh
          - M0664_2dhn
          - M0674_1uf7
          - M0732_1xs1
          - M0870_1oh9
          - M0907_1rbl
    mcsa_subset_fixed_ligand:
      dataset:
        subset_to_keys: *mcsa_15_keys
    mcsa_subset_no_ligand:
      dataset:
        subset_to_keys: *mcsa_15_keys

nn:
  feats_seq: [
    "xt_bb_ca",                   # Noised backbone CA coordinates [b, n, 3]
    "xt_local_latents",           # Noised local latents [b, n, latent_dim]
    "token_type",                 # Token type embedding (protein/rna/dna/atomized/unknown) [b, n, token_type_emb_dim]
    "cond_residue_type",          # Conditional residue type (prevents leakage) [b, n, 20]
    "cond_a37coors_nm",           # Conditional atom37 coordinates (prevents leakage) [b, n, 37*4]
    "cond_a37coors_internal_nm",  # Conditional atom37 internal coordinates [b, n, 37*4]
    "rasa_binned",                # RASA surface accessibility [b, n, 37]
    "secondary_structure",        # Secondary structure [b, n, embed_dim]
    "hbond",                      # Hydrogen bonds [b, n, 37]
    # "na_ss_state",                # Nucleic-acid state feature (unspecified/paired/loop) [b, n, 2]  # REMOVED
    "hotspot",                    # Hotspot annotation [b, n, 37]
    "atom_charge",                # Atomic charge embedding for atomized tokens [b, n, 16]
    "atomic_element",             # Atomic element embedding for atomized tokens [b, n, 16]
    coord_group_seq,              # Raw coordinate group in atom37 representation [b, n, 37]
    "chirality",                  # Block-diagonal chirality vector [b, n, 18]
    "chain_centroid_xyz",         # per-chain centroid xyz (nm) [b, n, 3]
  ]
  feats_pair_repr: [
    "xt_bb_ca_pair_dists",        # Pairwise distances from noised CA [b, n, n, xt_pair_dist_dim]
    "bond_mask",                  # Bond existence mask for atomized molecules [b, n, n, 1]
    "bond_order",                 # Kekulé bond order + coordination for atomized molecules [b, n, n, 5]
    "is_aromatic",                # Aromaticity flag for atomized molecule bonds [b, n, n, 1]
    "index_group_pair",           # Binary feature indicating same C_IDXGRP index group [b, n, n, 1]
    "molecule_idx_pair",          # Binary feature indicating same molecule instance [b, n, n, 1]
    "token_bond_path_length",     # Pairwise path lengths in the token bond graph
    "canonical_polymer_ordering", # ±1 ordering of bonded canonical polymer residue pairs [b, n, n, 1]
    # "na_ss_pair",                 # Nucleic acid secondary structure pair feature [b, n, n, 3]  # REMOVED
  ]

log:
  tags: ["insertion-head", "motif-scaffolding", "ame", "omol", "plinder", "muon", "af3-oracle", "baseline"]

dataloaders:
  batch_size: 16
  val:
    dataloader_params:
      num_workers: 4

opt:
  val_start_epoch: 1   # skip prevalidate (no val before first training epoch)
  num_sanity_val_steps: 2

hardware:
  accelerator: gpu
  nnodes_: 3
  ngpus_per_node_: 8
  ncpus_per_task_train_: 16
