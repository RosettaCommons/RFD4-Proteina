# @package _global_
# Autoencoder training recipe corresponding to the 2026-09-04 z16 release.
defaults:
  - /datasets/train/ae/afdb_monomer@datasets.train.afdb_monomer
  - /datasets/train/ae/na_complex@datasets.train.na_complex
  - /datasets/train/ae/rna_monomer@datasets.train.rna_monomer
  - /datasets/train/ae/mgnify_af2_2026@datasets.train.mgnify_af2_2026
  - /datasets/train/ae/ted_dimers@datasets.train.ted_dimers
  - /datasets/train/ae/plinder@datasets.train.plinder
  - /datasets/train/ae/cpsea@datasets.train.cpsea
  - /datasets/train/ae/cpsea_pdb@datasets.train.cpsea_pdb
  - /design_tasks/presets/ae_uncond_folding@_ae_design_tasks
  - /datasets/val/diffusion_loss/pdb_temporal_holdout@datasets.val.pdb_temporal_holdout
  # (Hydra requires `override` entries last in the defaults list.)
  - override /nn_ae@nn_ae: nn_130m_unified
  - override /datasets@datasets: none
  - _self_

run_name_: 2026_09_04_release_ae_z16

_max_tokens: 384
_pdb_max_tokens: 768
_crop_size: ${_max_tokens}

hardware:
  ngpus_per_node_: 8
  nnodes_: 8
  ncpus_per_task_train_: 24

dataloaders:
  num_workers: 24
  train:
    dataloader_params:
      batch_size: 8
      collate_fn:
        fixed_dimensions:
          I: ${_max_tokens}
  val:
    dataloader_params:
      collate_fn:
        # Fixed padding lets training and validation share static compiled graphs.
        fixed_dimensions:
          I: ${_max_tokens}

nn_ae:
  # Compile the AE with reduce-overhead; fixed-size batches avoid graph recompilation.
  use_torch_compile: true
  torch_compile_mode: reduce-overhead
  torch_compile_fullgraph: false
  latent_z_dim: 16
  encoder:
    use_attn_pair_bias: false
    feats_seq: ["token_type", "x1_a37coors_nm", "x1_a37coors_nm_rel", "chain_idx_seq"]
    latent_z_dim: 16
  decoder:
    use_attn_pair_bias: false
    latent_z_dim: 16

loss:
  struct:
    # Requires precompute_atom_permutation on every training dataset below.
    atom_permutation: true
    atom_permutation_align: false

datasets:
  train:
    afdb_monomer:
      probability: 0.36
      dataset:
        filters: ["length <= ${_max_tokens}"]
        transform: {crop_size: "${_crop_size}", design_tasks: "${_ae_design_tasks}", precompute_atom_permutation: true}
    mgnify_af2_2026:
      probability: 0.26
      dataset:
        # The training run memory-mapped local metadata while streaming structures from the blob store.
        data: ${oc.env:DATA_PATH}/train_datasets/mgnify_af2_distill_2026/mgnify_af2_distill_2026.parquet
        memory_map: true
        transform: {crop_size: "${_crop_size}", design_tasks: "${_ae_design_tasks}", precompute_atom_permutation: true}
    ted_dimers:
      probability: 0.14
      dataset:
        data: ${oc.env:DATA_PATH}/train_datasets/ted_dimers/ted_dimers_metadata_annotated.parquet
        filters:
          - "InterfaceLength > 10"
          - "AvgIntPAE < 10"
          - "AvgIntPlddt > 70"
          - "n_res_a + n_res_b <= ${_pdb_max_tokens}"
        columns_to_load:
          - example_id
          - path
          - n_res_a
          - n_res_b
          - InterfaceLength
          - AvgIntPAE
          - AvgIntPlddt
          - MemberCount
          - passes_paper_teddymer
          - on_disk
        transform: {crop_size: "${_crop_size}", design_tasks: "${_ae_design_tasks}", precompute_atom_permutation: true}
    plinder:
      probability: 0.10
      dataset:
        columns_to_load: [example_id, path, n_tokens, n_atoms, n_clashes]
        filters: ["n_tokens <= ${_pdb_max_tokens}"]
        transform: {crop_size: "${_crop_size}", design_tasks: "${_ae_design_tasks}", precompute_atom_permutation: true}
    na_complex:
      probability: 0.05
      dataset: {transform: {crop_size: "${_crop_size}", design_tasks: "${_ae_design_tasks}", precompute_atom_permutation: true}}
    rna_monomer:
      probability: 0.05
      dataset:
        filters:
          - "passes_ribonanza_strict == True"
          - "frac_atoms_clashing_1p0A == 0"
          - "frac_atoms_clashing_1p5A < 0.005"
          - "mean_plddt > 75"
          - "length <= ${_pdb_max_tokens}"
        parser_args:
          _target_: rfproteina.utils.parse_presets.distillation
          save_to_cache: true
          load_from_cache: true
          cache_dir: ${oc.env:LOCAL_DRIVE_MOUNT,/tmp}/${oc.env:USER,shared}/atomworks_parse_cache
        transform: {crop_size: "${_crop_size}", design_tasks: "${_ae_design_tasks}", precompute_atom_permutation: true}
    cpsea:
      probability: 0.02
      dataset: {transform: {crop_size: "${_crop_size}", design_tasks: "${_ae_design_tasks}", precompute_atom_permutation: true}}
    cpsea_pdb:
      probability: 0.02
      dataset: {transform: {crop_size: "${_crop_size}", design_tasks: "${_ae_design_tasks}", precompute_atom_permutation: true}}
  val:
    pdb_temporal_holdout:
      dataset:
        num_replicates: 1
        transform: {precompute_atom_permutation: true}
    unconditional: null

opt:
  val_every_n_epochs: 10

log:
  log_every_n_steps: 10
  projection_every_n: 1000
  tags: ["ae", "release", "130m", "unified", "muon", "2026_09_04", "crop384", "no-pair-bias", "dec-seq", "z16"]
