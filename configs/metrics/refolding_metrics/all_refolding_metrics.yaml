# Post-refolding structure comparison metrics.
# ground_truth = design structure, predicted = refolded structure.
# Tags control which metrics run for each example.

backbone_rmsd:
  _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
  align_mask: is_protein_backbone
  subset_mask: is_protein_backbone
  metric_type: rmsd
  keep_aligned_predicted_structure: false
  required_tags_any:
    - unconditional_refolding
    - ppi_refolding
    - motif_scaffold_refolding
    - internal_coordinate_motif_scaffold_refolding
    - sm_binder_refolding
    - ame_refolding
    - ame_no_ligand_refolding
    - ame_original_benchmark_refolding

target_aligned_binder_rmsd:
  _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
  align_mask: mask_coordinate_1_atom
  subset_mask: ~mask_coordinate_1_atom
  metric_type: rmsd
  keep_aligned_predicted_structure: true
  required_tags_any: [ppi_refolding]

motif_allatom_rmsd:
  _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
  align_mask: mapped_to_coordinate_conditioned_region & is_protein
  subset_mask: mapped_to_coordinate_conditioned_region & is_protein
  gt_coord_annotation_name: annotation_coords-with-insertion_1_atom
  metric_type: rmsd
  keep_aligned_predicted_structure: true
  required_tags_any:
    - motif_scaffold_refolding
    - internal_coordinate_motif_scaffold_refolding
    - ame_refolding
    - ame_no_ligand_refolding
    - ame_original_benchmark_refolding

motif_ca_rmsd:
  _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
  align_mask: "mapped_to_coordinate_conditioned_region & is_protein & (atom_name == 'CA')"
  subset_mask: "mapped_to_coordinate_conditioned_region & is_protein & (atom_name == 'CA')"
  gt_coord_annotation_name: annotation_coords-with-insertion_1_atom
  metric_type: rmsd
  keep_aligned_predicted_structure: false
  required_tags_any:
    - motif_scaffold_refolding
    - internal_coordinate_motif_scaffold_refolding

backbone_aligned_ligand_rmsd:
  _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
  align_mask: is_protein_backbone
  subset_mask: is_ligand
  metric_type: rmsd
  required_tags_any: [sm_binder_refolding]
