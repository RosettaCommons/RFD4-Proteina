# Enzyme active-site design: motif preservation and ligand-context checks.

# --- With ligand ---
ame:
  _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
  metric_thresholds:
    oracle.min_ipae_coi:
      max_exclusive: 1.5
    refolded_backbone_rmsd.rmsd:
      max: 2.0
    refolded_motif_allatom_rmsd.rmsd:
      max: 1.5
    clash_metrics.frac_atoms_clashing_inter_residue_polymer_ligand_1p5A:
      max: 0
  required_tags_any: [ame_refolding]
  prohibited_tags: [no_ligand]

# --- Without ligand ---
ame_no_ligand:
  _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
  metric_thresholds:
    refolded_backbone_rmsd.rmsd:
      max: 2.0
    refolded_motif_allatom_rmsd.rmsd:
      max: 1.5
  required_tags_any: [ame_refolding]
  required_tags_all: [no_ligand]
