# Pre-oracle filters: only forward passing designs to the oracle. Tag-gated like other Metrics.
# NOTE: When benchmarking per-example, disable every pre-oracle filter -- see docs/workflow/metrics.md

# Sequence conditioning is a hard constraint, so a design that breaks it is almost never worth folding.
# NOTE: These two filters gate on the same tags as the metric they threshold -- a filter whose metric
# never ran sees a missing key, which counts as a (non-deleting) failure and drops every design.
sequence_adherence_filter:
  _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
  required_tags_any: ["design"]
  metric_thresholds:
    sequence_adherence.n_violations:
      max: 0

# Likewise for unindexed conditioning: an unindexed token that was never inserted, or was inserted
# onto a residue of the wrong identity, means the design does not contain the requested motif.
unindexed_insertion_mapping_filter:
  _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
  required_tags_all: ["unindexed"]
  metric_thresholds:
    unindexed_insertion_mapping.n_unmapped_tokens:
      max: 0
    unindexed_insertion_mapping.n_sequence_mismatches:
      max: 0

# NOTE: This is `insertion_rmsd` in the sense of rfd3, which only includes unindexed regions
insertion_rmsd_filter:
  _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
  metric_thresholds:
    unindexed_metrics.insertion_rmsd:
      max: 1.0
  required_tags_all:
    - unindexed
    - insertion_rmsd_filter

motif_rmsd_filter:
  _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
  required_tags_all: [motif_rmsd_filter]
  metric_thresholds:
    motif_rmsd.rmsd:
      max: 1.0

ligand_clash_filter:
  _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
  metric_thresholds:
    clash_metrics.frac_atoms_clashing_inter_residue_polymer_ligand_1p5A:
      max: 0
  required_tags_all: [ligand_clash_filter]
  prohibited_tags: [no_ligand]