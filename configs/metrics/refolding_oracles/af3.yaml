# AF3 refolding oracle configurations.
# Tags (via metrics_tags) control which oracle actually runs for each example.

oracle:
  _target_: rfproteina.metrics.oracles.af3_oracle.AF3Oracle
  oracle_name: af3
  aggregation: [median]
  frac_under_thresholds:
    min_ipae_coi: [1, 1.5, 2]
  required_tags_any:
    - af3_refolding
    - unconditional_refolding
    - motif_scaffold_refolding
    - internal_coordinate_motif_scaffold_refolding
    - sm_binder_refolding
    - ame_refolding
    - ame_no_ligand_refolding
    - ame_original_benchmark_refolding
    - disco_refolding

oracle_ppi:
  _target_: rfproteina.metrics.oracles.af3_oracle.AF3Oracle
  oracle_name: af3_ppi
  template_query: "mask_coordinate_1_atom"
  aggregation: [median]
  frac_under_thresholds:
    min_ipae_coi: [1, 1.5, 2]
  required_tags_any:
    - ppi_refolding

oracle_dna:
  _target_: rfproteina.metrics.oracles.af3_oracle.AF3Oracle
  oracle_name: af3_dna
  template_query: "mask_coordinate_1_atom & ~is_nucleic_acid"
  aggregation: [median]
  frac_under_thresholds:
    min_ipae_coi: [1, 1.5, 2]
  required_tags_any:
    - dna_refolding

