rf3_metric_motif_scaffold:
  _target_: proteinfoundation.metrics.rf3_metric.RF3Metric
  ckpt_path: ${oc.env:DATA_PATH}/rf3_checkpoints/rf3-with-confidence-xaira-epoch-0711-fixed.ckpt
  num_steps: 50
  n_recycles: 5
  required_tags_any: ["motif_scaffold_refolding"]
  extra_annots_to_symm_resolve: ["annotation_coords-with-insertion_1_atom"]
  metric_manager:
    _target_: foundry.metrics.metric.MetricManager
    metrics:
      backbone_rmsd:
        _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
        input_kwarg_names:
          ground_truth_atom_array_stack: ground_truth_atom_array_stack
          predicted_atom_array_stack: predicted_atom_array_stack
        align_mask: is_protein_backbone
        subset_mask: is_protein_backbone
        metric_type: rmsd
      motif_allatom_rmsd:
        _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
        input_kwarg_names:
          ground_truth_atom_array_stack: ground_truth_atom_array_stack
          predicted_atom_array_stack: predicted_atom_array_stack
        align_mask: mapped_to_coordinate_conditioned_region & is_protein
        subset_mask: mapped_to_coordinate_conditioned_region & is_protein
        gt_coord_annotation_name: annotation_coords-with-insertion_1_atom
        metric_type: rmsd
      motif_ca_rmsd:
        _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
        input_kwarg_names:
          ground_truth_atom_array_stack: ground_truth_atom_array_stack
          predicted_atom_array_stack: predicted_atom_array_stack
        align_mask: mapped_to_coordinate_conditioned_region & is_protein & (atom_name == 'CA')
        subset_mask: mapped_to_coordinate_conditioned_region & is_protein & (atom_name == 'CA')
        gt_coord_annotation_name: annotation_coords-with-insertion_1_atom
        metric_type: rmsd
  pass_criteria:
    backbone_rmsd.rmsd:
      max: 2.0
    motif_allatom_rmsd.rmsd:
      max: 2.0
    motif_ca_rmsd.rmsd:
      max: 1.0