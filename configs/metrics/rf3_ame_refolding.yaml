# HACK: Should use interpolation in refolding metrics rather than duplicating here!

# This is a stricter version of the ame that enforces global refolding.
# It also aligns on the motif directly rather than using backbone-aligned all-atom RMSD
rf3_metric_ame:
  _target_: proteinfoundation.metrics.rf3_metric.RF3Metric
  ckpt_path: ${oc.env:DATA_PATH}/rf3_checkpoints/rf3-with-confidence-xaira-epoch-0711-fixed.ckpt
  num_steps: 50
  n_recycles: 5
  required_tags_any: ["ame_refolding"]
  extra_annots_to_symm_resolve: ["coords_with_insertion"]
  metric_manager:
    _target_: foundry.metrics.metric.MetricManager
    metrics:
      backbone_rmsd:
        _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
        input_kwarg_names:
          ground_truth_atom_array_stack: ground_truth_atom_array_stack
          predicted_atom_array_stack: predicted_atom_array_stack
        align_mask: is_protein_backbone
        subset_mask: is_protein_backbone
        metric_type: rmsd
      motif_aligned_motif_rmsd:
        _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
        input_kwarg_names:
          ground_truth_atom_array_stack: ground_truth_atom_array_stack
          predicted_atom_array_stack: predicted_atom_array_stack
        align_mask: mapped_to_coordinate_conditioned_region & is_protein
        subset_mask: mapped_to_coordinate_conditioned_region & is_protein
        gt_coord_annotation_name: coords_with_insertion
        metric_type: rmsd
      ligand_clash_metric:
        _target_: proteinfoundation.metrics.design_metrics.LigandClashMetric
        input_kwarg_names:
          # NOTE: After refolding, the "ground-truth" is actually the designed structure!
          predicted_atom_array_stack: ground_truth_atom_array_stack
        ligand_clash_threshold: 1.5
  pass_criteria:
    backbone_rmsd.rmsd:
      max: 2.0
    motif_aligned_motif_rmsd.rmsd:
      max: 1.5
    ligand_clash_metric.n_clashing.allatom_ligand_clashes:
      max: 0
