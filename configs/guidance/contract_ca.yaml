# Test guidance config: contract CA coordinates toward the origin.
#
# Exercises the differentiable-metric guidance path end to end with a trivial, dependency-free
# metric. A negative weight contracts the protein (guidance always maximizes the objective).
#
# Reference from an inference config as a sibling of `search:` / `refinement:`, e.g.:
#   defaults:
#     - guidance: contract_ca

metrics:
  contract_ca:
    _target_: rfproteina.metrics.contract_ca_metric.ContractCAMetric

terms:
  contract_ca.sq_norm: # keyed by "metric_name.output_key"
    bb_ca: # per-modality schedule; omitted modalities contribute 0
      # Constant weight over the first 10% of the trajectory (t in [0, 0.1]; t=0 is noise,
      # t=1 is the clean end), zero afterwards.
      _target_: rfproteina.guidance.schedules.window
      _partial_: true
      w: -0.1 # negative -> contract
      t_start: 0.0
      t_end: 0.1
