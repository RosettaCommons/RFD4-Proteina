# Structure quality reward configuration
# Uses metrics that can be computed directly on generated structures
# No refolding required - very fast!

metrics:
  clash:
    _target_: rfproteina.metrics.design_metrics.ClashMetric

  sse:
    _target_: rfproteina.metrics.sse_metrics.SSEMetrics

  rasa:
    _target_: rfproteina.metrics.rasa_metrics.RASAMetrics

  molprobity:
    _target_: rfproteina.metrics.molprobity_metrics.MolprobityMetrics

  hbonds:
    _target_: rfproteina.metrics.hbonds_metrics.HbondMetrics

weights:
  # Steric clashes
  clash.frac_atoms_clashing_1p5A: -5.0

  # Secondary structure
  sse.helix_fraction: 1.0
  sse.strand_fraction: 1.0

  # Surface accessibility
  rasa.mean_rasa: 2.0

  # Molprobity
  molprobity.clashscore: -3.0
  molprobity.rama_favored: 2.0
  molprobity.rotamer_outliers: -2.0

  # H-bonds
  hbonds.num_hbonds: 1.0


