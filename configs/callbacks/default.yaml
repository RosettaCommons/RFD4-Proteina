set_sampler_epoch_callback:
    _target_: rfproteina.callbacks.sampler_epoch.SetSamplerEpochCallback

skip_nan_grad_callback:
    _target_: rfproteina.utils.training_analysis.SkipNanGradCallback

lightning_timing_callback:
    _target_: rfproteina.callbacks.timing.LightningTimingCallback
    log_every_n: 500

ema_callback:
    _target_: rfproteina.utils.simple_ema.SimpleEMA
    decay: 0.999  # EMA decay rate (higher = more weight to historical params)
    update_every_n: 1  # Update EMA every N steps (1 = every step)

coordinated_gc:
    _target_: rfproteina.callbacks.coordinated_gc.CoordinatedGC
    interval_batches: 128
