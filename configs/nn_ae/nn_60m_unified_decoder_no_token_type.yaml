# Same as nn_60m_unified but decoder does NOT receive token_type
# Ablation: Can the decoder reconstruct protein/RNA/DNA without knowing the token type?
# Encoder still receives token_type, but decoder must infer it from latent alone

name: transformer_ae  # name of architecture

latent_z_dim: &latent_z_dim 8
n_residue_types: &n_residue_types 33  # All UNIFIED_ATOM37_ENCODING types (0-32)
# 0: MASK, 1-20: standard AAs, 21: UNK, 22-25: RNA (A,C,G,U), 26: N (unknown RNA),
# 27-30: DNA (DA,DC,DG,DT), 31: DN (unknown DNA), 32: ATOMISED

encoder:
  nlayers: 12  # number of transformer layers
  token_dim: 512  # dimension of the tokens in the sequence
  nheads: 12  # number of attn heads
  parallel_mha_transition: False  # whether to compute mha and transition as parallel and add them up (AF3 style) or sequentially (normal transformers)
  token_type_emb_dim: 32  # Embedding dimension for token type (protein/rna/dna/atomized/unknown)

  strict_feats: False  # if False, then fills missing features with default values (e.g. chain break with zero, residue sequence index by [0, 1, 2, ...], etc)
  # If True, if some feature is not provided, then it raises an error

  # Encoder receives token_type to encode molecule type information into latent
  feats_seq: ["chain_break_per_res", "x1_aatype", "token_type", "x1_a37coors_nm", "x1_a37coors_nm_rel", "chain_idx_seq"]
  feats_cond_seq:  # Sequence features to include in conditioning variables

  # Parameters for the features we extract
  dim_cond: 128  # dimension of conditioning vector
  idx_emb_dim: 128  # dimension of the sequence position [0, 1, 2, ...] (if contiguous residues) embeddings

  feats_pair_repr: ["rel_seq_sep", "ca_coors_nm_pair_dists"]  # Features to include in the pair representation

  seq_sep_dim: 127  # should be odd >= 5
  pair_repr_dim: 256

  update_pair_repr: False  # whether to update pair representation
  update_pair_repr_every_n: 3  # Update the pair representation every n layers
  use_tri_mult: False  # whether to use triangular multiplication layers in pair update, ignored if not updating pair representation

  use_qkln: True

  normalize_latent: false
  latent_z_dim: *latent_z_dim
  n_residue_types: *n_residue_types  # Pass to feature factory

decoder:
  nlayers: 12  # number of transformer layers
  token_dim: 512  # dimension of the tokens in the sequence

  abs_coors: False  # Compute absolute coors or use relative to CA

  nheads: 12  # number of attn heads
  # ABLATION: Set token_type_emb_dim to 0 so decoder doesn't use token type
  token_type_emb_dim: 0
  parallel_mha_transition: False  # whether to compute mha and transition as parallel and add them up (AF3 style) or sequentially (normal transformers)

  strict_feats: False  # if False, then fills missing features with default values (e.g. chain break with zero, residue sequence index by [0, 1, 2, ...], etc)
  # If True, if some feature is not provided, then it raises an error

  # ABLATION: Decoder does NOT receive token_type - must reconstruct from latent alone
  feats_seq: ["ca_coors_nm", "z_latent_seq"]  # No token_type here
  feats_cond_seq:  # Sequence features to include in conditioning variables

  # Parameters for the features we extract
  dim_cond: 128  # dimension of conditioning vector
  idx_emb_dim: 128  # dimension of the sequence position [0, 1, 2, ...] (if contiguous residues) embeddings

  feats_pair_repr: ["rel_seq_sep", "ca_coors_nm_pair_dists"]  # Features to include in the pair representation

  seq_sep_dim: 127  # should be odd >= 5
  pair_repr_dim: 256

  update_pair_repr: False  # whether to update pair representation
  update_pair_repr_every_n: 3  # Update the pair representation every n layers
  use_tri_mult: False  # whether to use triangular multiplication layers in pair update, ignored if not updating pair representation

  use_qkln: True
  latent_z_dim: *latent_z_dim
