# Execution and numerical kernel selection are independent.
inference:
  flow: ${inference_backend}
  encoder: ${inference_backend}
  decoder: ${inference_backend}
  length_buckets: ${compile_lengths}
  tri_mult: cuequivariance
  compile_scope: blocks
bioir:
  dtype: bfloat16
  attention_backend: SDPA
  cuda_graph: true
  # Each retained shape consumes graph memory; keep one unless explicitly qualified.
  max_graphs: 1
  flow_prefix_masks: true
  # Experimental KF needs a separately qualified MR229 runtime; shared preserves training parity.
  triangle_backend: shared
