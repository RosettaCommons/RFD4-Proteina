# Execution and numerical kernel selection are independent.
inference:
  flow: ${inference_backend}
  encoder: ${inference_backend}
  decoder: ${inference_backend}
  length_buckets: ${compile_lengths}
  tri_mult: cuequivariance
  compile_scope: blocks
bioir:
  dtype: bfloat16
  # Full workflow selects the BioIR default; mixed blocks retain SDPA.
  attention_backend: null
  cuda_graph: true
  # Null: full workflow retains each recycling depth for a full batch and tail;
  # mixed block policies retain one graph. Explicit values always mean actual slots.
  max_graphs: null
  # Full BioIR uses automatic KF where eligible; reports cache state and availability.
