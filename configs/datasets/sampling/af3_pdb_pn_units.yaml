# AF-3 cluster-weighted sampling for pdb_pn_units

weights:
  _target_: atomworks.ml.samplers.calculate_weights_for_pdb_dataset_df
  cluster_column: cluster
  altloc_seed_column: altloc_seed
  pdb_id_column: pdb_id
  beta: 0.5        # AF-3 pn_units beta (interfaces uses 1.0)
  alphas:
    a_prot: 3.0    # 3 for AF-3
    a_nuc: 3.0     # 3 for AF-3
    a_ligand: 1.0  # 1 for AF-3
    a_loi: 5.0     # 5 for RF-3 (not specified in AF-3)
