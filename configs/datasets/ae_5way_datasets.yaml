# =============================================================================
# Autoencoder Dataset Mix: AFDB + TED Dimers
# =============================================================================
# Protein-only AE training mix (no RNA / NA complex until squash mounts exist).
#
# Dataset Mix (50% each, probabilities sum to 1.0):
#   - 50% AFDB monomers (unified parquet, length-only filters)
#   - 50% TED dimers (paper Teddymer quality filters)
#
# Usage in experiment config:
#   defaults:
#     - /datasets/ae_5way_datasets@datasets
# =============================================================================

defaults:
  - /datasets/train/distill/afdb_monomer_genie3@train.afdb_monomer
  - /datasets/train/ae/base@train.afdb_monomer
  - train/ae/ted_dimers@train.ted_dimers
  - _self_

train:
  afdb_monomer:
    probability: 0.5

  ted_dimers:
    probability: 0.5
