compute_loss: true

defaults:
  # package reference needed for validation using `+datasets/val@generation=ppi_subset`
  - /datasets/val@_here_: cleaned_ppi
  - _self_

dataset:
  name: ppi_subset
  subset_to_keys:
    # easy
    - 04_IFNAR2
    - rfd3_insulinr # can reveal topology-mimicking if present
    # medium
    - rfd3_il7ra
    - 15_DerF7
    # hard
    - rfd3_tie2
    - 36_VEGFA

  num_replicates: 200
