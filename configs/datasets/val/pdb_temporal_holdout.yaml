# PDB interfaces deposited >= 2024-01-01 (inverse of the training cutoff), as annotated
# CIFs from src/script_utils/build_val_cifs.py. Loss on held-out structures.

compute_loss: true  # stratified val loss on the default t grid (override with t_grid: [...])
generate: false  # loss-only: no generation/AF3 folding (set generate: true to also generate)

dataset:
  _target_: rfproteina.inference_utils.datasets.DesignProblemDataset
  dir_path_or_file_paths: ${oc.env:DATA_PATH}/val_datasets/pdb_temporal_holdout
  num_replicates: 90  # samples per structure; t levels are balanced across the whole set

  transform:
    _target_: rfproteina.datapipes.pipeline.build_design_validation_pipeline
