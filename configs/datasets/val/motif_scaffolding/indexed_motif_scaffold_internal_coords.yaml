compute_loss: true

dataset:
  _target_: rfproteina.inference_utils.datasets.DesignProblemDataset

  # Required parameters for each inheriting dataset
  dir_path_or_file_paths: ${oc.env:PROJECT_ROOT}/data/benchmarks/motif_indexed_internal_coords
  
  num_replicates: 100

  subset_to_keys:
    - 1PRW_AA
    - 1BCF_AA
    - 1QJG_AA
    - 5YUI_AA
    - 5IUS_AA
    - 6VW1_AA
    - 4JHW_AA
    - 2KL8_AA

  transform:
    _target_: rfproteina.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - design
      - 3d_coordinate_conditioning
      - internal_coordinate_conditioning
      - internal_coordinate_motif_scaffold_refolding
