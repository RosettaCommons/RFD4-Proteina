# DNA-binder validation (120-150 AA) on 6 fixed DNA targets: full scoreboard with
# oracle refold (binder/backbone RMSDs) plus inline design metrics. DNA chains
# fixed as context, protein contig 120-150, central-6bp major-groove H-bond
# conditioning labels. Shares its input JSON with dna_binder_120_150_helicity
# (they differ only in num_replicates and metrics_tags). This set runs the refold
# oracle, so it is expensive — set its (less frequent) val cadence via
# run_every_n_val_epochs at the experiment level.

dataset:
  _target_: proteinfoundation.inference_utils.datasets.ContigJsonDataset
  data: ${oc.env:PROJECT_ROOT}/benchmarks/dna_binder_120_150_campaign.json
  name: dna_binder_120_150_campaign
  subset_to_keys:
    - TATA_120_150
    - oct4_pt1_120_150
    - oct4_pt2_120_150
    - PRNP1_120_150
    - PCSK9_120_150
    - CAG_120_150
  num_replicates: 25

  transform:
    _target_: proteinfoundation.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - design
      - dna_refolding
      - interchain_interactions
