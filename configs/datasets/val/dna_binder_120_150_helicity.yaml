# DNA-binder validation (120-150 AA) on 6 fixed DNA targets: a small, cheap
# percent-helicity check meant to be run frequently. No refolding oracle — only
# inline design metrics on the generated backbones (helix fraction + interchain
# interaction metrics), so it is fast enough to run every val epoch. Same input JSON as
# dna_binder_120_150_campaign (identical targets, contigs, and central-6bp H-bond
# conditioning labels); differs only in num_replicates and metrics_tags. Set its
# val cadence via run_every_n_val_epochs at the experiment level.

dataset:
  _target_: rfproteina.inference_utils.datasets.ContigJsonDataset
  data: ${oc.env:PROJECT_ROOT}/data/benchmarks/dna_binder_120_150_campaign.json
  name: dna_binder_120_150_helicity
  subset_to_keys:
    - TATA_120_150
    - oct4_pt1_120_150
    - oct4_pt2_120_150
    - PRNP1_120_150
    - PCSK9_120_150
    - CAG_120_150
  num_replicates: 20

  transform:
    _target_: rfproteina.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - design
      - interchain_interactions
