dataset:
  _target_: proteinfoundation.inference_utils.datasets.ContigJsonDataset

  # Required parameters for each inheriting dataset
  data: ${oc.env:PROJECT_ROOT}/projects/proteinfoundation/benchmarks/sm_binder_hbonds.json
  name: sm_binder_hbonds-design
  subset_to_keys:
    - FAD
    - IAI
    - OQO
    - SAM

  transform:
    _target_: proteinfoundation.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - hbond_conditioning
      - sm_binder_refolding