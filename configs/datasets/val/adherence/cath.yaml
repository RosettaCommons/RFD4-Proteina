  dir_path_or_file_paths:
    - ${oc.env:PROJECT_ROOT}/data/benchmarks/adherence/monomer_helical/monomer-short.cif.zst
    - ${oc.env:PROJECT_ROOT}/data/benchmarks/adherence/monomer_helical/monomer-medium.cif.zst
    - ${oc.env:PROJECT_ROOT}/data/benchmarks/adherence/monomer_helical/monomer-long.cif.zst
