# AFDB secondary-structure conditioning benchmark (P-SEA labels).
# 10 balanced AFDB monomers (3 alpha / 3 beta / 4 mixed), per-residue SS conditioning
# annotated by biotite P-SEA. Per-structure class + SS composition (P-SEA and DSSP):
# benchmarks/afdb_ss/manifest.csv. Structures are AFDB (AlphaFold) predictions from
# the clustered AFDB set.
compute_loss: true

dataset:
  _target_: proteinfoundation.inference_utils.datasets.DesignProblemDataset
  dir_path_or_file_paths: ${oc.env:PROJECT_ROOT}/projects/proteinfoundation/benchmarks/afdb_ss
  num_replicates: 20

  transform:
    _target_: proteinfoundation.datapipes.pipeline.build_design_validation_pipeline
    # `design` is what selects the SSE metrics (sse_accuracy / sse_distribution
    # require_tags_any: ["design"]); `secondary_structure_conditioning` is
    # informational and mirrors ss_conditioned.yaml.
    metrics_tags:
      - design
      - secondary_structure_conditioning
