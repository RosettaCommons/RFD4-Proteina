defaults:
  - /recycle_strategy@generation: medium/front_loaded
  - _self_

dataset:
  _target_: rfproteina.inference_utils.datasets.DesignProblemDataset

  # Required parameters for each inheriting dataset
  dir_path_or_file_paths: ${oc.env:PROJECT_ROOT}/data/benchmarks/ppi/ppi_all_atom

  num_replicates: 200

  transform:
    _target_: rfproteina.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - design
      - 3d_coordinate_conditioning
      - hotspot_conditioning
      - ppi_refolding
