compute_loss: true

dataset:
  _target_: proteinfoundation.inference_utils.datasets.DesignProblemDataset
  dir_path_or_file_paths: ${oc.env:PROJECT_ROOT}/projects/proteinfoundation/benchmarks/tip_atom_no_ligand_training_examples

  parser_args:
    add_missing_atoms: False
    sanitize_bonds_and_charges: False
    fix_ligands_at_symmetry_centers: False

  num_replicates: 50  # note we don't sample different lengths for each entry

  transform:
    _target_: proteinfoundation.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - unindexed
      - 3d_coordinate_conditioning
      - ame_refolding
      - no_ligand

