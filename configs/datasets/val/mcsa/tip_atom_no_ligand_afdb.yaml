compute_loss: true

dataset:
  _target_: rfproteina.inference_utils.datasets.DesignProblemDataset
  dir_path_or_file_paths: ${oc.env:PROJECT_ROOT}/data/benchmarks/tip_atom_no_ligand_training_examples

  num_replicates: 50  # note we don't sample different lengths for each entry

  transform:
    _target_: rfproteina.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - design
      - unindexed
      - ame_refolding
      - no_ligand
