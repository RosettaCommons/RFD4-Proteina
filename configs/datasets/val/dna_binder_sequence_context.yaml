# DNA-binder validation (50-80 AA): de novo protein design with only the DNA
# sequence provided as context (DNA structure is co-generated). 3 targets x 25
# replicates. Tags: design (inline geometry + % helicity), dna_refolding (oracle
# refold + backbone RMSD). No interchain_interactions since the DNA structure is
# co-generated (no fixed motif).

dataset:
  _target_: rfproteina.inference_utils.datasets.ContigJsonDataset
  data: ${oc.env:PROJECT_ROOT}/data/benchmarks/dna_binder_denovo_val.json
  name: dna_binder_sequence_context
  subset_to_keys:
    - 7n5u_sequence_context
    - 7m5w_sequence_context
    - 7rte_sequence_context
  num_replicates: 25

  transform:
    _target_: rfproteina.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - design
      - dna_refolding
