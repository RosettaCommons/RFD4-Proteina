run_every_n_val_epochs: 3
compute_loss: true

dataset:
  _target_: proteinfoundation.inference_utils.datasets.ContigJsonDataset

  # Required parameters for each inheriting dataset
  data: ${oc.env:PROJECT_ROOT}/benchmarks/rna_sm_aptamer.json
  name: rna_sm_aptamer_fixed-design
  subset_to_keys:
    - RNA_cortisol_aptamer

  num_replicates: 50

  transform:
    _target_: proteinfoundation.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - interchain_interactions
      - sm_binder_refolding
