run_every_n_val_epochs: 3
compute_loss: true

dataset:
  _target_: rfproteina.inference_utils.datasets.DesignProblemDataset

  # Required parameters for each inheriting dataset
  dir_path_or_file_paths: ${oc.env:PROJECT_ROOT}/data/benchmarks/rna_sm_aptamer
  subset_to_keys:
    - RNA_cortisol_aptamer

  num_replicates: 50

  transform:
    _target_: rfproteina.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - interchain_interactions
      - sm_binder_refolding
