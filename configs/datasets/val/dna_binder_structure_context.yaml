# DNA-binder validation (50-80 AA): de novo protein design with the DNA chain
# provided as full context (structure + sequence). 3 targets x 25 replicates.
# Tags: design (inline geometry + % helicity), dna_refolding (oracle refold +
# binder/backbone RMSDs), hbond_conditioning (H-bond metrics on the design).

dataset:
  _target_: proteinfoundation.inference_utils.datasets.ContigJsonDataset
  data: ${oc.env:PROJECT_ROOT}/projects/proteinfoundation/benchmarks/dna_binder_denovo_val.json
  name: dna_binder_structure_context
  subset_to_keys:
    - 7n5u_structure_context
    - 7m5w_structure_context
    - 7rte_structure_context
  num_replicates: 25

  transform:
    _target_: proteinfoundation.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - design
      - dna_refolding
      - hbond_conditioning
