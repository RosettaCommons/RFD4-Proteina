dataset:
  _target_: proteinfoundation.inference_utils.datasets.ContigJsonDataset
  data: ${oc.env:PROJECT_ROOT}/benchmarks/dna_binder_short_site.json
  name: dna_binder_specificity_7n5u
  subset_to_keys:
    - 7n5u_short_site_fixed_dna_HB-conditioned
    - 7n5u_short_site_fixed_dna_uncond
  num_replicates: 8

  transform:
    _target_: proteinfoundation.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - dna_binder_refolding
      - dna_binder_specificity
      - hotspot_conditioning
      - interchain_interactions
