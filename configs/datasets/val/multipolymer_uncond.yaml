dataset:
  _target_: proteinfoundation.inference_utils.datasets.ContigJsonDataset

  data: ${oc.env:PROJECT_ROOT}/benchmarks/multipolymer_uncond.json
  name: multipolymer_uncond
  subset_to_keys:
    - multipolymer_120p_70r
    - multipolymer_90p_60r_25d_25d
    - rna_60
    - dna_60
    - protein_60


  num_replicates: 20

  transform:
    _target_: proteinfoundation.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - unconditional_refolding
      