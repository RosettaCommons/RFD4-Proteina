compute_loss: true

dataset:
  _target_: proteinfoundation.inference_utils.datasets.ContigJsonDataset

  # Required parameters for each inheriting dataset
  data: ${oc.env:PROJECT_ROOT}/projects/proteinfoundation/benchmarks/all_ppi_ig.yaml  
  name: ppi_subset
  subset_to_keys:
    # easy
    - 04_IFNAR2 
    - rfd3_insulinr # can reveal topology-mimicking if present
    # medium
    - 31_IL7RA
    - 15_DerF7
    # hard
    - rfd3_tie2
    - 36_VEGFA
  
  num_replicates: 200

  transform:
    _target_: proteinfoundation.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - design
      - 3d_coordinate_conditioning
      - hotspot_conditioning
      - ppi_refolding