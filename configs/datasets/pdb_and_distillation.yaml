# Combined dataset configuration: PDB + Monomer Distillation
# Combines PDB interfaces (PPI tasks) with AFDB monomers (unconditional generation)

defaults:
  - train/pdb/pdb_interfaces@train.pdb_interfaces
  - train/distill/afdb_monomer@train.afdb_monomer
  - train/distill/rna_monomer@train.rna_monomer
  - train/distill/na_complex@train.na_complex
  - train/distill/mgnify@train.mgnify
  # Validation datasets
  - val/unconditional@val.unconditional
  - val/unindexed@val.unindexed
  - _self_

train:
  pdb_interfaces:
    probability: 0.2 
  afdb_monomer:
    probability: 0.2 
  rna_monomer:
    probability: 0.2 
  na_complex:
    probability: 0.2 
  mgnify:
    probability: 0.2