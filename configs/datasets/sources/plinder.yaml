# PLINDER protein-ligand systems, May 2026 (~275K rows).

defaults:
  - backend_blob
  - _self_

name: plinder_train
data: ${oc.env:DATASET_STORE_ROOT}/train_datasets/streaming-latest/pdb/2026_05_20_plinder/examples.parquet
memory_map: True

loader:
  blob_dir: ${oc.env:DATASET_STORE_ROOT}/train_datasets/streaming-latest/pdb/2026_05_20_plinder/blob
  record_id_colname: path

columns_to_load:
  - example_id
  - path
  - pli_unique_qcov__50__community
  - n_standard_amino_acid_residues
  - n_dna_residues
  - n_rna_residues
  - n_other_heavy_atoms
