# PLINDER protein-ligand systems, May 2026 (~275K rows).

name: plinder_train
data: ${oc.env:DATA_PATH}/train_datasets/plinder/2026_05_20_plinder_systems.parquet
memory_map: True

loader:
  base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/plinder
  parser_args:
    # Cache parsed structures to node-local NVMe.
    save_to_cache: true
    load_from_cache: true

columns_to_load:
  - example_id
  - path
  - pli_unique_qcov__50__community
