# PDB interfaces restricted to antibody/antigen pairs, with CDR and antigen annotations.

defaults:
  - pdb_interfaces
  - _self_

name: antibody_interfaces_pdb
data: ${oc.env:DATA_PATH}/train_datasets/pdb/ig_interfaces_df.parquet

# Spelled out in full because Hydra replaces lists on merge. This table carries no
# `validated` column, so the validation gate pdb_interfaces applies is unavailable here.
filters:
  - "deposition_date < '2024-01-01'"
  - "resolution < 9.0"
  - "num_polymer_pn_units <= 30"
  - "interface_cluster.notnull()"
  - "~(pn_unit_1_non_polymer_res_names.notnull() and pn_unit_1_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
  - "~(pn_unit_2_non_polymer_res_names.notnull() and pn_unit_2_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
  - "is_inter_molecule"
  - "n_nuc == 0"  # exclude interfaces in assemblies containing nucleic acids
  # Ig-specific gates
  - "cdr_annotations.notnull()"
  - "involves_ig"
  - "ig_type == 'antibody'"

columns_to_load:
  - example_id
  - pdb_id
  - assembly_id
  - altloc_seed
  - path
  - deposition_date
  - resolution
  - num_polymer_pn_units
  - method
  - interface_cluster
  - n_prot
  - n_nuc
  - n_ligand
  - n_peptide
  - total_num_atoms_in_unprocessed_assembly
  - pn_unit_1_iid
  - pn_unit_2_iid
  - pn_unit_1_non_polymer_res_names
  - pn_unit_2_non_polymer_res_names
  - is_inter_molecule
  - all_pn_unit_iids_after_processing
  - involves_loi
  - pn_unit_1_type
  - pn_unit_2_type
  # Ig-specific columns; antigen_cluster and cdr_cluster are alternative clusterings.
  - cdr_annotations
  - antigen_cluster
  - cdr_cluster
  - ig_pn_unit_iid
  - antigen_pn_unit_iid
  - ig_type
  - involves_ig
