# Antibody/antigen interfaces from the Protein Data Bank
# Annotated with ig_region mmCIF annotations for downstream sampling of conditions

defaults:
  - pdb_interface_common
  - _self_

name: antibody_interfaces_pdb
data: ${oc.env:DATASET_STORE_ROOT,${oc.env:DATA_PATH}}/train_datasets/pdb/ig_interfaces_df_2026_09_10.parquet

loader:
  parser_args:
    # Identifies CDRs and framework regions in the antibody chains
    extra_fields: [ig_region]

filters:
  mapping:
    involves_ig: "involves_ig"
    ig_type: "ig_type == 'antibody'"

columns_to_load:
  mapping:
    immune:
      - involves_ig
      - ig_type
