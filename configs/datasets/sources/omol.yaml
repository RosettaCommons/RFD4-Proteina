# OMol annotated structures, keyed by the source LMDB's global record index.

defaults:
  - backend_blob
  - _self_

name: omol
data: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/omol_annotated/examples.parquet
memory_map: True

loader:
  blob_dir: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/omol_annotated/blob
  record_id_colname: lmdb_idx

columns_to_load:
  - example_id
  - lmdb_idx
  - data_id
  - n_atoms
  - n_standard_amino_acid_residues
  - n_other_heavy_atoms

filters:
  - "data_id not in ['community/trans1x', 'reactivity/rgd', 'reactivity/RGD_radical', 'reactivity/pmechdb', 'reactivity/rmechdb', 'metal_complexes/reactivity', 'elytes/reactivity']"
  - "n_other_heavy_atoms <= ${oc.select:..transform.max_crop_size,${..transform.crop_size}}"
