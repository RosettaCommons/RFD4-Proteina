# QCell biomolecular QM fragments, stored as bonded CIF bytes in sharded LMDB.

name: qcell
lmdb_path: ${oc.env:DATA_PATH}/train_datasets/qcell/data
data: ${oc.env:DATA_PATH}/train_datasets/qcell/qcell.parquet
lmdb_idx_column: lmdb_idx
memory_map: True

columns_to_load:
  - example_id
  - lmdb_idx
  - data_id
  - qcell_category
  - num_atoms
  - num_bonds
  - num_components
  - charge
  - energy
  - bond_method
  - passes_bond_validation
  - passes_rdkit_sanitize
  - passes_chemistry_validation

filters:
  # Coordinate-only inputs are retained in the archive, but training accepts
  # only graphs that use the primary bond perception path, sanitize in RDKit,
  # reproduce QCell's formal charge, and have the expected component count.
  - "passes_chemistry_validation == True"
  - "num_atoms <= 256"

parser_args:
  # QCell includes explicit hydrogens and ion-water clusters. Unlike the
  # generic distillation preset, this preserves water and all custom residues.
  _target_: rfproteina.utils.parse_presets.annotated_cif
