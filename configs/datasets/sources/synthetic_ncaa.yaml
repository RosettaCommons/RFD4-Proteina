# ESMFold2 modification-conditioned peptide conformers, with CCD-grafted CREST/GFN-FF supplements.
# Chemistry/PoseBusters-audited; training selects in-vocabulary PTMs.
defaults:
  - backend_blob
  - _self_

name: synthetic_ncaa_strict
memory_map: true
data: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/ncaa/2026_09_21_ptm_esmfold2/examples.parquet

columns_to_load:
  - example_id
  - n_standard_amino_acid_residues
  - n_other_heavy_atoms
  - has_in_vocabulary_ptm
  - passes_structure_validation
  - passes_bond_filters
  - passes_posebusters

filters:
  - "passes_structure_validation == True"
  - "passes_bond_filters == True"
  - "passes_posebusters == True"
  - "has_in_vocabulary_ptm == True"

loader:
  blob_dir: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/ncaa/2026_09_21_ptm_esmfold2/blob
  parser_args:
    _target_: rfproteina.utils.parse_presets.annotated_cif
