# Bicyclic-peptide distillation set prepared from the 2026-05-27 combined manifest.
#
# Remote artifacts (object storage):
#   s3://YOUR_DATASET_STORE/train_datasets/bicycle_distillation/bicycle_distillation_2026_05_27.parquet
#   s3://YOUR_DATASET_STORE/train_datasets/bicycle_distillation/data/bicycle_distillation_2026_05_27.sqfs
#
# The parquet contains paths relative to the squashfs root and one row per query
# PN unit. It retains the original absolute path and example ID in provenance
# columns, while `path` and `example_id` are portable and globally unique.

name: bicycle_distillation_2026_05_27
data: ${oc.env:DATA_PATH}/train_datasets/bicycle_distillation/bicycle_distillation_2026_05_27.parquet
memory_map: True

loader:
  _target_: atomworks.ml.datasets.loaders.create_loader_with_query_pn_units
  base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/bicycle_distillation
  pn_unit_iid_colnames: ["q_pn_unit_iid"]
  example_id_colname: example_id
  assembly_id_colname: assembly_id
  altloc_seed_colname: null

filters:
  - "atomworks_parse_ok == True"

columns_to_load:
  - example_id
  - path
  - assembly_id
  - q_pn_unit_iid
  - q_pn_unit_type
  - q_pn_unit_is_polymer
  - q_pn_unit_is_loi
  - n_prot
  - n_peptide
  - n_nuc
  - n_ligand
  - source
  - atomworks_parse_ok
