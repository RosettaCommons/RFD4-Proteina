# Experimental PDB environments within 7 A of parent-mapped noncanonical peptide CCDs, excluding MSE.
# Spatial crops, not sequence windows; chemistry/PoseBusters and PTM-vocabulary gates below.
defaults:
  - backend_blob
  - _self_

name: pdb_ptm_strict
memory_map: true
data: ${oc.env:DATASET_STORE_ROOT}/train_datasets/streaming-latest/pdb/2026_09_19_ptm_crop/examples.parquet

columns_to_load:
  - example_id
  - n_standard_amino_acid_residues
  - n_rna_residues
  - n_other_heavy_atoms
  - deposition_date
  - ptm_experiment_split
  - has_in_vocabulary_ptm
  - passes_structure_validation
  - passes_bond_filters
  - passes_posebusters

filters:
  - "passes_structure_validation == True"
  - "passes_bond_filters == True"
  - "passes_posebusters == True"
  - "deposition_date < '2024-01-01'"
  - "ptm_experiment_split == 'train'"
  - "has_in_vocabulary_ptm == True"

loader:
  blob_dir: ${oc.env:DATASET_STORE_ROOT}/train_datasets/streaming-latest/pdb/2026_09_19_ptm_crop/blob
  parser_args:
    _target_: rfproteina.utils.parse_presets.annotated_cif
