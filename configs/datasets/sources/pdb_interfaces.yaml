name: pdb_interfaces
data: ${oc.env:DATASET_STORE_ROOT,${oc.env:DATA_PATH}}/train_datasets/pdb/pdb_interfaces_2026_01_06_proc_2026_06_18.parquet

columns_to_load:
  mapping:
    standard_interface:
      - pn_unit_1_type
      - pn_unit_2_type
