# PDB interfaces read from the configured blob store.
# Consumers add only design tasks, and a sampling weight if they want a different one.

defaults:
  - pdb_interface_common
  - _self_

name: pdb_interfaces
data: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/pdb/2026_10_04_tmol_plip_cath/sampling/interfaces.parquet

columns_to_load:
  mapping:
    standard_interface:
      - pn_unit_1_type
      - pn_unit_2_type
