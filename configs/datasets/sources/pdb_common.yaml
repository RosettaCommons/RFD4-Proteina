# Shared loader, quality filters, and metadata columns for all PDB training datasets
# NOTE: Named mapping merge by key

defaults:
  - backend_blob
  - _self_

loader:
  blob_dir: ${oc.env:DATASET_STORE_ROOT,${oc.env:DATA_PATH}}/train_datasets/pdb/data/blob_annotated_2026_09_09
  record_id_colname: path
  assembly_id_colname: assembly_id

filters:
  _target_: rfproteina.utils.hydra.non_null_values
  mapping:
    # Date cutoff
    deposition_date: "deposition_date < '2024-01-01'"

    # Structure quality
    resolution: "resolution < 9.0"
    charge_validation: "validated != False"

    # Exclude enormous assemblies
    polymer_pn_unit_count: "num_polymer_pn_units <= 300"

columns_to_load:
  _target_: rfproteina.utils.hydra.flatten_unique_values
  mapping:
    common:
      - example_id
      - pdb_id
      - assembly_id
      - altloc_seed
      - path
      - deposition_date
      - resolution
      - num_polymer_pn_units
      - all_pn_unit_iids_after_processing
      - method

      # Type of the query chain(s)
      # Sums to 1 for pn_unit datasets and 2 for interface datasets
      # NOTE: This is NOT the number of these chains in the complex!
      - n_prot
      - n_nuc
      - n_ligand
      - n_peptide

    charge_validation:
      - validated
