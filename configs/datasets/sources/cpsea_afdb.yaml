# Annotated cyclic peptide complexes, sampled uniformly without metadata filters.
defaults:
  - backend_blob
  - _self_

name: cpsea_afdb
data: ${oc.env:DATASET_STORE_ROOT}/train_datasets/streaming-latest/synthetic/2026_10_04_cpsea_afdb/metadata.parquet

columns_to_load:
  - example_id
  - n_standard_amino_acid_residues
  - n_other_heavy_atoms

loader:
  blob_dir: ${oc.env:DATASET_STORE_ROOT}/train_datasets/streaming-latest/synthetic/2026_10_04_cpsea_afdb/blob
  parser_args:
    _target_: rfproteina.utils.parse_presets.annotated_cif
