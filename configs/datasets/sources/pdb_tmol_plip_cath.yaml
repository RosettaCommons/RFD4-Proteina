# Loader and conformer QC shared by the tmol/PLIP/CATH PDB sampling tables.

loader:
  blob_dir: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/pdb/2026_09_19_tmol_plip_cath/blob

filters:
  mapping:
    charge_validation: "passes_protein_ligand_quality_validation != False"
    long_polymer_bonds: "n_long_polymer_bonds == 0"

columns_to_load:
  mapping:
    charge_validation:
      - passes_protein_ligand_quality_validation
    conformer_quality:
      - n_long_polymer_bonds
