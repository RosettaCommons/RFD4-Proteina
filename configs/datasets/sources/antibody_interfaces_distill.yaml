# Quality-filtered antibody-antigen complexes from distillation of known binders
# Predicted with 10 seeds with Protenix-v2; chose structure by confidence

# Annotated with mmCIF ``ig_region`` annotations for downstream sampling of conditions
# Displaced-coordinate residues are NaN-masked and removed by the training pipeline.

defaults:
  - backend_blob
  - _self_

name: antibody_interfaces_distill
data: ${oc.env:DATASET_STORE_ROOT,${oc.env:DATA_PATH}}/train_datasets/abag_protenix_v2_2026/abag_protenix_v2_2026_09_10.parquet

transform:
  b_factor_occupancy_min: 80.0

loader:
  blob_dir: ${oc.env:DATASET_STORE_ROOT,${oc.env:DATA_PATH}}/train_datasets/abag_protenix_v2_2026/data/blob

  parser_args:
    # Identifies CDRs and framework regions in the antibody chains
    extra_fields: [ig_region]

columns_to_load:
  - example_id
  - interface_cluster
  - pae_min_ab_ag
  # Geometric antibody metrics
  - n_contact_pairs
  - fw_to_cdr_native_pct_strict
  - tors_total

filters:
  # Structure prediciton confidence metrics
  - "pae_min_ab_ag < 1.5"
  # Geometric antibody metrics
  - "n_contact_pairs >= 30"
  - "fw_to_cdr_native_pct_strict.fillna(1.0) <= 0.50"
  - "tors_total.fillna(0) >= 0"  # negative values mark CDR torsions outside native 2σ support
