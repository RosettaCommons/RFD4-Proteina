# MGnify metagenomic sequences predicted with AlphaFold2, 2026.
# Streamed from cloud-native blob storage; filtered for confidence and length

defaults:
  - backend_blob
  - _self_

name: mgnify_af2_distill_2026
data: ${oc.env:DATASET_STORE_ROOT,${oc.env:DATA_PATH}}/train_datasets/streaming-latest/synthetic/mgnify_af2_2026/examples.parquet

loader:
  blob_dir: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/mgnify_af2_2026/blob

columns_to_load:
  - example_id
  - n_standard_amino_acid_residues
  - mean_plddt
  - ptm

filters:
  # Confidence floor.
  - "mean_plddt >= 85"
  - "ptm >= 0.80"
  # Length gate, tracking the crop (default: 256)
  - "n_standard_amino_acid_residues <= ${oc.select:_max_tokens,256}"
