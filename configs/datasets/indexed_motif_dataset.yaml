# Dataset config for indexed motif scaffolding finetuning
# 100% AFDB monomers with indexed motif scaffolding (no unindexing)
# Uses Hydra composition to reference existing dataset configs

# Reference indexed motif dataset config
defaults:
  - train/distill/afdb_monomer_indexed_motif@train.afdb_monomer_indexed_motif
  - _self_

# Single dataset
train:
  afdb_monomer_indexed_motif:
    probability: 1.0

