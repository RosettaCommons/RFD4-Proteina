# =============================================================================
# Autoencoder Dataset Mix: RNA + PDB Multipolymer
# =============================================================================
# Unified AE mix for debugging current atom37 compatibility using:
#   - RNA monomers
#   - PDB interfaces
#   - PDB polymer-nucleotide units
# The PDB datasets intentionally keep nucleic-acid-containing assemblies.
# =============================================================================

defaults:
  - train/ae/rna_monomer@train.rna_monomer
  - train/ae/pdb_interfaces_multipolymer@train.pdb_interfaces
  - train/ae/pdb_pn_units_multipolymer@train.pdb_pn_units
  - _self_

train:
  rna_monomer:
    probability: 0.10

  pdb_interfaces:
    probability: 0.50

  pdb_pn_units:
    probability: 0.40
