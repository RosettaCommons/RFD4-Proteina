# =============================================================================
# Autoencoder Dataset Mix: Protein + RNA + DNA
# =============================================================================
# Mixed dataset for training the unified autoencoder with all residue types.
# All samples are unconditional (design_task frequency: 1) for AE training.
#
# Dataset Mix (probabilities must sum to 1.0):
#   - 50% AFDB monomers (protein structures from AlphaFold DB)
#   - 25% RNA monomers (single-chain RNA structures)
#   - 25% NA complexes (protein-DNA/RNA transcription factor complexes)
#
# Usage in experiment config:
#   defaults:
#     - /datasets/ae_protein_rna_dna_datasets@datasets
# =============================================================================

defaults:
  - /datasets/train/distill/afdb_monomer_genie3@train.afdb_monomer
  - /datasets/train/ae/base@train.afdb_monomer
  - train/ae/rna_monomer@train.rna_monomer
  - train/ae/na_complex@train.na_complex
  - _self_

# Mixed dataset with probabilities (must sum to 1.0)
train:
  # Protein monomers from AlphaFold Database (50% of training samples)
  afdb_monomer:
    probability: 0.5
  
  # RNA monomer structures (25% of training samples)
  rna_monomer:
    probability: 0.25
  
  # Protein-DNA/RNA complexes (25% of training samples)
  na_complex:
    probability: 0.25

