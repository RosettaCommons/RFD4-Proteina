# =============================================================================
# Autoencoder Dataset: NA Complex Only
# =============================================================================
# Dataset config for NA-complex-focused AE training.
# Currently set to 100% NA complexes for debugging DNA/RNA support.
#
# For balanced protein+RNA+DNA training, use ae_protein_rna_dna_datasets.yaml:
#   defaults:
#     - /datasets/ae_protein_rna_dna_datasets@datasets
#
# Probabilities must sum to 1.0. Adjust as needed for your experiment.
# =============================================================================

defaults:
  - /datasets/train/distill/afdb_monomer_genie3@train.afdb_monomer
  - /datasets/train/ae/base@train.afdb_monomer
  - train/ae/na_complex@train.na_complex
  - train/ae/rna_monomer@train.rna_monomer
  - _self_

# Mixed dataset with probabilities (must sum to 1.0)
train:
  # Protein monomers from AlphaFold Database
  afdb_monomer:
    probability: 0.0

  # Protein-DNA/RNA complexes (transcription factors)
  na_complex:
    probability: 1.0

  # RNA monomer structures
  rna_monomer:
    probability: 0.0
