# PLINDER training dataset.
# Source: ${DATA_PATH}/train_datasets/plinder/2026_05_20_plinder_systems.parquet
# (275123 rows, May 2026).
# Squashfs (CIFs): /squash/plinder (mounted from
# 2026_05_20_plinder_systems.sqfs).
# Weighted sampling: inverse cluster size on `pli_unique_qcov__50__community`.

defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/tip_atom_tasks@dataset.transform.design_tasks
  - _self_

probability: 1.0  # default for mixed samples; experiment configs override

dataset:
  name: plinder_train
  data: ${oc.env:DATA_PATH}/latent_data/train_datasets/plinder/2026_05_20_plinder_systems.parquet
  memory_map: True

  loader:
    _target_: atomworks.ml.datasets.loaders.create_base_loader
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/plinder
    example_id_colname: example_id
    path_colname: path
    assembly_id_colname: None
    parser_args:
      _target_: proteinfoundation.utils.parse_presets.distillation

  columns_to_load:
    - example_id
    - path
    - pli_unique_qcov__50__community

  transform: {}

weights:
  _target_: atomworks.ml.samplers.calculate_weights_by_inverse_cluster_size
  cluster_column: pli_unique_qcov__50__community
