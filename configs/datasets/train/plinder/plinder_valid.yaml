# PLINDER Valid Dataset - Protein-Ligand Complexes
# 91,917 validated protein-ligand complexes from PLINDER
# Uses system.cif files with protein and ligand structures

defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/tip_atom_tasks@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: plinder_valid_train
  
  # CSV file with paths to CIF files
  data: ${oc.env:DATA_PATH}/train_datasets/plinder_valid/plinder_valid.csv
  
  # Use PandasDataset (can read CSV files)
  # Note: CSVDataset doesn't exist in atomworks
  
  loader:
    _target_: atomworks.ml.datasets.loaders.create_base_loader
    example_id_colname: example_id
    path_colname: path
    assembly_id_colname: None
    parser_args:
      _target_: proteinfoundation.utils.parse_presets.rcsb_with_metals
      save_to_cache: True
      load_from_cache: True
      cache_dir: ${oc.env:CACHE_DIR}/plinder_valid
  
  # Optional filters (can be uncommented to filter dataset)
  # filters:
  #   - "num_residues_protein >= 50"
  #   - "num_residues_protein <= 500"
  #   - "num_heavy_atoms_ligand >= 10"
  #   - "num_heavy_atoms_ligand <= 100"
  
  # Columns to load
  columns_to_load:
    - example_id
    - complex_name
    - path
    - num_residues_protein
    - num_heavy_atoms_ligand

  # Transform pipeline (uses defaults from base + design_tasks)
  transform: {}

