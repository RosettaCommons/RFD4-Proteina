# Transform pipeline defaults shared by every training dataset, regardless of backend.

id_column: example_id

transform:
  # Default transform args applied to all training datasets
  _target_: proteinfoundation.datapipes.pipeline.build_design_train_pipeline
  crop_size: 256
  crop_contiguous_probability: 0.0
  crop_spatial_probability: 1.0
  crop_center_cutoff_distance: 15.0
  max_atoms_in_crop: 10000
  b_factor_occupancy_min: null  # Change for distillation sets where you want to not loss low confidence residues
  p_random_rotation: 1.0
  load_msa: False
  max_msa_sequences: 10000
  msa_featurize_n_recycles: 1
  msa_featurize_n_msa: 1024
  # BFS depth for token bond-graph path lengths. Should be >= (nn.seq_sep_dim - 2)
  # so the model's exact-distance bins can be fully populated; smaller is fine but
  # high-distance bins will always be empty. Bounding BFS keeps featurization fast.
  path_length_search_cutoff: 64
