# Default transform arguments for training datasets

_target_: atomworks.ml.datasets.PandasDataset
name: ???
data: ???
id_column: example_id

loader:
  _target_: atomworks.ml.datasets.loaders.create_base_loader
  example_id_colname: example_id
  path_colname: path
  assembly_id_colname: None
  parser_args:
    add_missing_atoms: False  # Default for distillation
    fix_formal_charges: False  # Default for distillation
    cache_dir: ${oc.env:CACHE_DIR}
    save_to_cache: False  # Default for distillation
    load_from_cache: False  # Default for distillation
    long_bond_policy: "keep"  # "keep," "raise," "warn," or "filter"
    hydrogen_policy: "remove"

transform:  # Some default transform args
  _target_: proteinfoundation.datapipes.pipeline.build_design_train_pipeline
  crop_size: 256
  crop_contiguous_probability: 0.0
  crop_spatial_probability: 1.0
  crop_center_cutoff_distance: 15.0
  p_random_rotation: 1.0
  load_msa: False
  max_msa_sequences: 10000
  msa_featurize_n_recycles: 1
  msa_featurize_n_msa: 1024
