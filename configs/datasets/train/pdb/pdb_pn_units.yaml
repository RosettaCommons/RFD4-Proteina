defaults:
  - ../base_pandas@dataset
  - af3_weighted_sampling
  - /design_tasks/presets/tip_atom_pocket_tasks@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset: 
  name: pdb_pn_units_train
  data: ${oc.env:DATA_PATH}/train_datasets/pdb/pdb_pn_units.parquet
  memory_map: True

  loader:
    _target_: atomworks.ml.datasets.loaders.create_loader_with_query_pn_units
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/pdb
    pn_unit_iid_colnames: ["q_pn_unit_iid"]
    example_id_colname: example_id
    assembly_id_colname: assembly_id
    altloc_seed_colname: null  # normally we would want this but this version already has altlocs in separate files so we don't need to load them now
    parser_args:
      _target_: rfproteina.utils.parse_presets.distillation
      # Annotated CIFs: load the StandardAnnotations the interaction conditions read from.
      load_standard_annotations: true
      save_to_cache: True
      load_from_cache: True
      cache_dir: ${oc.env:LOCAL_DRIVE_MOUNT,/tmp}/${oc.env:USER,shared}/atomworks_parse_cache

  filters:
    # filters common across all PDB datasets
    - "deposition_date < '2024-01-01'"
    - "resolution < 9.0"
    - "num_polymer_pn_units <= 30"
    - "cluster.notnull()"
    - "pdb_id not in ${resolve_import:atomworks.ml.preprocessing.constants,PDB_IDS_WITH_UNPHYSICAL_BONDS}"
    # pn_unit specific filters
    - "~(q_pn_unit_non_polymer_res_names.notnull() and q_pn_unit_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
    - "n_nuc == 0"  # exclude pn_units in assemblies containing nucleic acids
    # Re-enable once we have the within_{20,50}_closest_chains column in the PDB parquet.
    # - "within_20_closest_chains"

  columns_to_load:
    # columns common across all PDB datasets
    - example_id
    - pdb_id
    - assembly_id
    - altloc_seed
    - path
    - deposition_date
    - resolution
    - num_polymer_pn_units
    - method
    - cluster
    - n_prot
    - n_nuc
    - n_ligand
    - n_peptide
    - total_num_atoms_in_unprocessed_assembly
    # pn_unit specific columns
    - q_pn_unit_iid
    - q_pn_unit_non_polymer_res_names
    - all_pn_unit_iids_after_processing
    - q_pn_unit_is_loi
    # closest chains columns
    # - within_20_closest_chains
    # - within_50_closest_chains
  
  # Transform pipeline
  transform: {}  # Force merge behavior from base and design_tasks

weights:
  beta: 0.5  # AF-3 pn_units beta (interfaces uses 1.0)