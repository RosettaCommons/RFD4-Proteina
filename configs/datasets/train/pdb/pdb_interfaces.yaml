# PDB Training Dataset - Multi-chain protein complexes
# Uses PDB interfaces with atomworks processing for PPI training

defaults:
  - ../base_pandas@dataset
  - af3_weighted_sampling
  - /design_tasks/presets/ppi_motif_scaffold@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: pdb_interfaces_train
  data: ${oc.env:DATA_PATH}/train_datasets/pdb/pdb_interfaces.parquet
  memory_map: True
  loader:
    _target_: atomworks.ml.datasets.loaders.create_loader_with_query_pn_units
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/pdb
    pn_unit_iid_colnames: ["pn_unit_1_iid", "pn_unit_2_iid"]
    example_id_colname: example_id
    assembly_id_colname: assembly_id
    altloc_seed_colname: null  # normally we would want this but this version already has altlocs in separate files so we don't need to load them now
    parser_args:
      _target_: proteinfoundation.utils.parse_presets.distillation
      save_to_cache: True
      load_from_cache: True
      cache_dir: ${oc.env:CACHE_DIR}/pdb

  # Filters for PDB interfaces dataset
  filters:
    - "deposition_date < '2024-01-01'"
    - "resolution < 9.0"
    - "num_polymer_pn_units <= 30"
    - "interface_cluster.notnull()"
    - "~(pn_unit_1_non_polymer_res_names.notnull() and pn_unit_1_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
    - "~(pn_unit_2_non_polymer_res_names.notnull() and pn_unit_2_non_polymer_res_names.str.contains('${resolve_import:atomworks.constants,AF3_EXCLUDED_LIGANDS_REGEX}', regex=True))"
    - "is_inter_molecule"
    - "n_nuc == 0"  # exclude interfaces in assemblies containing nucleic acids

  # Columns to load from parquet
  columns_to_load:
    - example_id
    - pdb_id
    - assembly_id
    - altloc_seed
    - path
    - deposition_date
    - resolution
    - num_polymer_pn_units
    - method
    - interface_cluster
    - n_prot
    - n_nuc
    - n_ligand
    - n_peptide
    - total_num_atoms_in_unprocessed_assembly
    - pn_unit_1_iid
    - pn_unit_2_iid
    - pn_unit_1_non_polymer_res_names
    - pn_unit_2_non_polymer_res_names
    - is_inter_molecule
    - all_pn_unit_iids_after_processing
    - involves_loi
    - pn_unit_1_type
    - pn_unit_2_type

  # Transform pipeline
  transform: {}  # Force merge behavior from base and design_tasks

weights:
  beta: 1.0  # AF-3 interfaces beta (pn_units uses 0.5)
  cluster_column: interface_cluster  # pdb_interfaces.parquet uses interface_cluster, not cluster
