# Subset of the PDB used for Complexa training

defaults:
  - ../base@dataset
  - /design_tasks/presets/ppi_motif_scaffold@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: complexa_filtered_pdb
  data: ${oc.env:DATA_PATH}/latent_train_parquet_files/complexa_filtered_pdb.parquet
  loader:
    _target_: atomworks.ml.datasets.loaders.create_base_loader
    example_id_colname: example_id
    assembly_id_colname: None
    parser_args:
      add_missing_atoms: True
      save_to_cache: True
      load_from_cache: True
      fix_formal_charges: True

  # Transform pipeline
  transform: {}  # Force merge behavior from base and design_tasks

