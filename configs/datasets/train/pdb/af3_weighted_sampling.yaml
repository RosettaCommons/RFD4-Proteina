# Shared AF-3 cluster-weighted sampling config for PDB datasets.
# `beta` is intentionally omitted — set it per sub-dataset
# (1.0 for interfaces, 0.5 for pn_units in the AF-3 paper).

weights:
  _target_: atomworks.ml.samplers.calculate_weights_for_pdb_dataset_df
  cluster_column: cluster
  altloc_seed_column: altloc_seed
  pdb_id_column: pdb_id
  alphas:
    a_prot: 3.0   # 3 for AF-3
    a_nuc: 3.0    # 3 for AF-3
    a_ligand: 1.0 # 1 for AF-3
    a_loi: 5.0    # 5 for RF-3 (not specified in AF3)
