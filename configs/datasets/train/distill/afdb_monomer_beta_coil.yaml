# AFDB Monomer — La-Proteina beta + coil filters (~344,507 rows).
# Adds prop_coil and max_consec_coil constraints on top of beta filters.

defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/motif_pretraining@dataset.transform.design_tasks
  - _self_

probability: 1.0

dataset:
  name: afdb_monomer_beta_coil
  data: ${oc.env:DATA_PATH}/latent_data/train_datasets/afdb_monomer/afdb_monomer.parquet
  memory_map: True
  columns_to_load:
    - example_id
    - path
    - length
    - plddt_avg
    - plddt_std
    - prop_alpha
    - prop_beta
    - prop_coil
    - max_consec_coil
    - on_disk
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/afdb_monomer
  filters:
    - "length >= 33 and length <= 511"
    - "plddt_avg >= 80 and plddt_avg <= 100"
    - "prop_beta >= 0.0100250626566416"
    - "prop_coil < 0.5"
    - "max_consec_coil < 20"
    - "on_disk == True"
  transform:
    crop_size: 512
