# MGnify Dec 2025 Distillation Dataset
# Newer MGnify structures with RF3 distillation.

defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/motif_pretraining@dataset.transform.design_tasks
  - _self_

probability: 1.0

dataset:
  name: mgnify_dec_2025
  data: ${oc.env:DATA_PATH}/train_datasets/mgnify_dec_2025/mgnify_dec_2025.parquet
  columns_to_load:
    - example_id
    - path
    - ptm
    - n_tokens
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/mgnify_dec_2025
  filters:
    # Match afdb_monomer_256 context length (co-trained).
    - "ptm > 0.75"
    - "n_tokens <= 256"
