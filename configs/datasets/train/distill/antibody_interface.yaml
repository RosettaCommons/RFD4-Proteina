# Antibody interface distillation created by David Binder from the Natural Antibody affinity dataset

defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/ig_design@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: antibody_interface_distill
  data: ${oc.env:DATA_PATH}/train_datasets/antibody_antigen_distill/ab_ag_distill.parquet
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/antibody_antigen_distill
    parser_args:
      _target_: rfproteina.utils.parse_presets.distillation