defaults:
  - ../base@dataset
  - /design_tasks/default@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: rna_monomer_distillation
  data: ${oc.env:DATA_PATH}/train_datasets/rna_monomer/rna_monomer.parquet
  columns_to_load:
    - example_id
    - path
    - cluster_id  # TODO: What are the rest of these used for? Do we need filters?
    - seq_hash
    - overall_plddt
    - overall_pde
    - overall_pae

  # Transform pipeline
  transform:
    # Override task frequencies for monomer distillation (no PPI tasks)
    design_tasks:
      unconditional:
        frequency: 0.6
      folding:
        frequency: 0.05
      inverse_folding:
        frequency: 0.05
      motif_scaffold:
        frequency: 0.3
      # Disable all other tasks by setting frequency to 0
      random_atom_distance:
        frequency: 0.0
      tip_atom:
        frequency: 0.0
      tip_atom_distance:
        frequency: 0.0
      tip_atom_partial_ligand:
        frequency: 0.0
      tip_atom_partial_ligand_distance:
        frequency: 0.0
      motif_scaffold_2d:
        frequency: 0.0
      ppi_hotspot_with_internal_coord_target_motif:
        frequency: 0.0
      ppi_hotspot_with_3d_target:
        frequency: 0.0