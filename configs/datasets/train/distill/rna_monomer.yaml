defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/all_off@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: rna_monomer_distillation
  data: ${oc.env:DATA_PATH}/train_datasets/rna_monomer/rna_monomer.parquet
  columns_to_load:
    - example_id
    - path
    - cluster_id  # TODO: What are the rest of these used for? Do we need filters?
    - seq_hash
    - overall_plddt
    - overall_pde
    - overall_pae

  # Monomer distillation mix; all non-listed tasks inherit frequency 0 from all_off.
  transform:
    design_tasks:
      unconditional:   {frequency: 0.6}
      folding:         {frequency: 0.05}
      inverse_folding: {frequency: 0.05}
      motif_scaffold:  {frequency: 0.3}