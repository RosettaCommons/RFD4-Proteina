# AFDB Monomer — Genie2 / beta-only filters (~544,501 rows).
# length 33–511, pLDDT 80–100, prop_beta >= 0.01 (no coil constraints).

defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/motif_pretraining@dataset.transform.design_tasks
  - _self_

probability: 1.0

dataset:
  name: afdb_monomer_beta
  data: ${oc.env:DATA_PATH}/train_datasets/afdb_monomer/afdb_monomer_annotated.parquet
  memory_map: True
  columns_to_load:
    - example_id
    - path
    - length
    - plddt_avg
    - plddt_std
    - prop_alpha
    - prop_beta
    - prop_coil
    - max_consec_coil
    - on_disk
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/afdb_monomer
    parser_args:
      load_standard_annotations: true
  filters:
    - "length >= 33 and length <= 511"
    - "plddt_avg >= 80 and plddt_avg <= 100"
    - "prop_beta >= 0.0100250626566416"
    - "on_disk == True"
  transform:
    crop_size: 512
