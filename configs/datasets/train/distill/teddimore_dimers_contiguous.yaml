
defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/ppi_motif_scaffold@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: teddimore_dimers_contiguous
  data: ${oc.env:DATA_PATH}/train_datasets/teddimore_dimers/contiguous_teddimore_dimers.parquet
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/teddimore_dimers
    parser_args:
      _target_: rfproteina.utils.parse_presets.distillation
  transform:
    b_factor_occupancy_min: null  # 0.7  # Any token with atom plddt < 70 will not be lossed