# AFDB Monomer 512 Distillation Dataset
# AFDB single-chain structures pre-filtered to <= 512 residues.

defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/motif_pretraining@dataset.transform.design_tasks
  - _self_

probability: 1.0

dataset:
  name: afdb_monomer_512
  data: ${oc.env:DATA_PATH}/train_datasets/afdb_512_extracted/metadata.parquet
  memory_map: True
  columns_to_load:
    - example_id
    - path
    - length
    - plddt
  loader:
    base_path: ${oc.env:DATA_PATH}/train_datasets/afdb_512_extracted
  transform:
    crop_size: 512
