# OMol-1 (55M) Training — Pure small-molecule data (no protein) in LMDB format.

defaults:
  - ../base_lmdb@dataset
  - /design_tasks/presets/all_off@dataset.transform.design_tasks
  - _self_

probability: 1.0

dataset:
  name: omol
  lmdb_path: ${oc.env:DATA_PATH}/train_datasets/omol_annotated/data
  memory_map: True
  data: ${oc.env:DATA_PATH}/train_datasets/omol/omol.parquet
  lmdb_idx_column: lmdb_idx

  columns_to_load:
    - example_id
    - lmdb_idx
    - data_id
    - num_atoms
    # - passes_stereo_chemical_validation

  filters:
    - "data_id not in ['community/trans1x', 'reactivity/rgd', 'reactivity/RGD_radical', 'reactivity/pmechdb', 'reactivity/rmechdb', 'metal_complexes/reactivity', 'elytes/reactivity']"
    - "num_atoms <= 256"
    # - "passes_stereo_chemical_validation == True"

  parser_args:
    _target_: rfproteina.utils.parse_presets.distillation
    # Annotated CIFs: load the StandardAnnotations the interaction conditions read from.
    load_standard_annotations: true

  transform:
    design_tasks:
      folding:       {frequency: 5.0}
      unconditional: {frequency: 1.0}
      # Fix ligand surroundings with p=0.5 (default is p=0.0) so we see frozen pockets
      partial_ligand:
        frequency: 1.0
        transform:
          p_fix_ligand_surroundings: 0.5
