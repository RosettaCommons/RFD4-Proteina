# OMol-1 (55M) Training - Small molecules in LMDB format
defaults:
  - ../base@dataset
  - /design_tasks/presets/folding_only@dataset.transform.design_tasks
  - _self_

probability: 1.0

dataset:
  _target_: atomworks.ml.datasets.lmdb_dataset.LmdbDataset
  name: omol
  lmdb_path: ${oc.env:DATA_PATH}/train_datasets/omol/data
  memory_map: True
  data: ${oc.env:DATA_PATH}/train_datasets/omol/omol.parquet
  id_column: example_id
  lmdb_idx_column: lmdb_idx

  columns_to_load:
    - example_id
    - lmdb_idx
    - data_id
    - num_atoms

  filters:
    - "data_id not in ['community/trans1x', 'reactivity/rgd', 'reactivity/RGD_radical', 'reactivity/pmechdb', 'reactivity/rmechdb', 'metal_complexes/reactivity', 'elytes/reactivity']"
    - "num_atoms <= 256"

  # LmdbDataset accepts ``parser_args`` directly and builds its own cif_bytes_loader.
  # TODO: Drop this ``loader: null`` workaround once datasets/train/base.yaml
  # is split — the file-loader block there (_target_: create_base_loader, with
  # ``example_id_colname``/``path_colname`` kwargs) is specific to PandasDataset and
  # shouldn't be inherited by LMDB datasets. Move those defaults into a separate
  # ``_loader_file.yaml`` partial so file-based datasets inherit both and LMDB
  # datasets inherit only the shared base (dataset + transform).
  loader: null
  parser_args: ${resolve_import:proteinfoundation.utils.parse_presets,DISTILLATION_ARGS}
