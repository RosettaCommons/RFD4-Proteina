# TCR <> peptide-mHC distillation set created by Phil Bradley using a fine-tuned AF2 model

defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/ig_design@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: tcr_interface_distill
  data: ${oc.env:DATA_PATH}/train_datasets/tcr_distill/tcr_distill_interfaces_train.parquet
  loader:
    base_path: ${oc.env:DATA_PATH}/train_datasets/tcr_distill/data
    parser_args:
      _target_: rfproteina.utils.parse_presets.distillation