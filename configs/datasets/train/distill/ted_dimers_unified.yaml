# Shared TED dimers metadata parquet (~587k rows). Subsets via filters in leaf configs.
# Same file as protein-foundation-models ted_dimers_metadata / paper_teddymer configs.

defaults:
  - ../base_pandas@dataset
  - _self_

probability: 1.0

dataset:
  name: ted_dimers_unified
  data: ${oc.env:DATA_PATH}/train_datasets/ted_dimers/data/ted_dimers_annotated.parquet
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/ted_dimers
    parser_args:
      # Annotated CIFs: load the StandardAnnotations the interaction conditions read from.
      load_standard_annotations: true
  columns_to_load:
    - example_id
    - path
