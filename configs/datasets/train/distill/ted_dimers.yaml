# TED Dimers Training Dataset - Protein dimers for PPI design
# Uses TED (Tertiary structure-based Evaluation of Dimers) dataset

defaults:
  - ../base@dataset
  - /design_tasks/presets/ppi_motif_scaffold@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: ted_dimers_train
  data: ${oc.env:DATA_PATH}/train_datasets/ted_dimers/ted_dimers.parquet
  loader:
    base_path: /squash/ted_dimers
    parser_args:
      add_missing_atoms: False
      sanitize_bonds_and_charges: False

