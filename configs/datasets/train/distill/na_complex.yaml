defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/all_off@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: na_complex_distillation
  data: ${oc.env:DATA_PATH}/train_datasets/na_complex/na_complex.csv
  columns_to_load:
    - example_id
    - path

  # PPI-focused mix; all non-listed tasks inherit frequency 0 from all_off.
  transform:
    design_tasks:
      unconditional:              {frequency: 0.2}
      folding:                    {frequency: 0.05}
      inverse_folding:            {frequency: 0.05}
      motif_scaffold:             {frequency: 0.2}
      ppi_hotspot_with_3d_target: {frequency: 0.5}