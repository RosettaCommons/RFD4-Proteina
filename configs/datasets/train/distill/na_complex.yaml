defaults:
  - ../base@dataset
  - /design_tasks/default@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: na_complex_distillation
  data: ${oc.env:DATA_PATH}/train_datasets/na_complex/na_complex.csv
  columns_to_load:
    - example_id
    - path

  # Transform pipeline
  transform:
    # Override task frequencies for dimers (focused on PPI)
    design_tasks:
      unconditional:
        frequency: 0.2
      folding:
        frequency: 0.05
      inverse_folding:
        frequency: 0.05
      motif_scaffold:
        frequency: 0.2
      ppi_hotspot_with_3d_target:
        frequency: 0.5
      # Disable tasks not relevant for dimers
      random_atom_distance:
        frequency: 0.0
      tip_atom:
        frequency: 0.0
      tip_atom_distance:
        frequency: 0.0
      tip_atom_partial_ligand:
        frequency: 0.0
      tip_atom_partial_ligand_distance:
        frequency: 0.0
      motif_scaffold_2d:
        frequency: 0.0
      ppi_hotspot_with_internal_coord_target_motif:
        frequency: 0.0