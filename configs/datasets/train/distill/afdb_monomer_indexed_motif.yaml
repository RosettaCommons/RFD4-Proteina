# Monomer Distillation Dataset - AFDB monomers with INDEXED motif scaffolding
# Uses AlphaFold Database structures with indexed motif scaffolding (no unindexing)

defaults:
  - ../base@dataset
  - /design_tasks/presets/indexed_motif_pretraining@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: afdb_monomer_indexed_motif
  data: ${oc.env:DATA_PATH}/train_datasets/afdb_monomer/afdb_monomer_512.parquet
  loader:
    base_path: /squash/afdb_monomer
    parser_args:
      add_missing_atoms: False
      sanitize_bonds_and_charges: False

