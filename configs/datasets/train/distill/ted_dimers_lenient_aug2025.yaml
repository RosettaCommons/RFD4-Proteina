# TED dimers — Aug 2025 lenient subset (~271k). See PFM script_utils/dataset_prep/build_ted_dimers_subset_parquet.py

defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/ppi_motif_scaffold@dataset.transform.design_tasks
  - _self_

probability: 1.0

dataset:
  name: ted_dimers_lenient_aug2025
  data: ${oc.env:DATA_PATH}/latent_data/train_datasets/ted_dimers/subsets/ted_dimers_lenient_aug2025.parquet
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/ted_dimers_lenient_aug2025
    parser_args:
      _target_: proteinfoundation.utils.parse_presets.distillation
  columns_to_load:
    - example_id
    - path
    - tm_score
