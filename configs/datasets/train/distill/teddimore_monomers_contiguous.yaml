defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/motif_pretraining@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: teddimore_monomers_contiguous
  data: ${oc.env:DATA_PATH}/train_datasets/teddimore_monomers/contiguous_teddimore_monomers.parquet
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/teddimore_monomers
    parser_args:
      _target_: proteinfoundation.utils.parse_presets.distillation
  transform:
    b_factor_occupancy_min: null  # 0.7  # Any token with atom plddt < 70 will not be lossed