# AFDB Monomer 256 Distillation Dataset
# AFDB single-chain structures pre-filtered to <= 256 residues, ~278k samples.

defaults:
  - ../base_pandas@dataset
  - /design_tasks/presets/motif_pretraining@dataset.transform.design_tasks
  - _self_

probability: 1.0

dataset:
  name: afdb_monomer_256
  data: ${oc.env:DATA_PATH}/train_datasets/afdb_monomer/afdb_genie3_32_512.parquet
  memory_map: True
  columns_to_load:
    - example_id
    - path
    - length
  filters:
    - 'length <= 256'
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/afdb_monomer
  transform:
    crop_size: 256
