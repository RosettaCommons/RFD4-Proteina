# AFDB Monomer 256 Dataset - Subset filtered to max 256 residues
# Uses AlphaFold Database structures with residue_count <= 256
# Contains 278,239 samples

defaults:
  - ../base@dataset
  - /design_tasks/presets/motif_pretraining@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: afdb_monomer_256
  data: ${oc.env:DATA_PATH}/train_datasets/afdb_monomer/afdb_monomer_256.parquet
  loader:
    base_path: /squash/afdb_monomer
    parser_args:
      add_missing_atoms: False
      sanitize_bonds_and_charges: False
