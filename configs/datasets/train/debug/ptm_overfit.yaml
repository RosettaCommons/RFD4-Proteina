# PTM diagnostic: two-example overfit train dataset.
#
# Trains on exactly two CIFs in ``ptm_diagnostic/overfit/`` (one with the
# TYR51.OH <-> A5O.P PTM bond, one without — and with the A5O ligand
# translated +100 A along x so it is spatially detached).
#
# Only UnconditionalTask is sampled, with every auxiliary conditioning
# probability zeroed out, so no extra signal leaks beyond what the base
# inference pipeline naturally provides.

probability: 1.0

dataset:
  _target_: rfproteina.inference_utils.datasets.DesignProblemDataset
  dir_path_or_file_paths: /path/to/home
  # Large replicate count so the loader doesn't run out of "epoch" before
  # the user wants to stop.
  num_replicates: 1000

  transform:
    _target_: rfproteina.datapipes.pipeline.build_design_train_pipeline
    # No cropping (both examples are <= 256 tokens).
    crop_size: null
    crop_contiguous_probability: 0.0
    crop_spatial_probability: 0.0
    # No augmentation: we are overfitting.
    p_random_rotation: 0.0
    p_atomize_residues: 0.0
    p_mirror: 0.0
    # Train pipeline branch (not is_inference) so design tasks are sampled.
    is_inference: false
    # Only UnconditionalTask, with all auxiliary conditioning probs at 0.
    design_tasks:
      task:
        frequency: 1.0
        transform:
          _target_: rfproteina.transforms.design_task.UnconditionalTask
          global_design_task_kwargs: ${datasets.global_design_task_kwargs}
