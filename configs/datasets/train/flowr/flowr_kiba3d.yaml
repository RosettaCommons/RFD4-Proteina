# FLOWR KIBA-3D Dataset
# Protein-Ligand complexes from the FLOWR.root project

defaults:
  - ../base@dataset
  - /design_tasks/presets/tip_atom_tasks@dataset.transform.design_tasks
  - _self_

probability: 1.0

dataset:
  name: flowr_kiba3d
  data: ${oc.env:DATA_PATH}/train_datasets/flowr_kiba3d/flowr_kiba3d.parquet
  loader:
    _target_: atomworks.ml.datasets.loaders.create_base_loader
    base_path: /squash/flowr_kiba3d
    example_id_colname: example_id
    assembly_id_colname: None

  transform: {}
