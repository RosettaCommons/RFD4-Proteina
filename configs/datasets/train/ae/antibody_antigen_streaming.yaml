defaults:
  - /datasets/train/pipeline_defaults@dataset
  - /datasets/sources/backend_blob@dataset
  - /design_tasks/presets@dataset.transform.design_tasks: unconditional
  - _self_

probability: 1.0
dataset:
  memory_map: true
  name: antibody_antigen
  data: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/2026_09_18_antibody_antigen_esmfold2/examples.parquet
  columns_to_load: [example_id, n_tok, overall_plddt, pae_min_ab_ag, n_contact_pairs]
  filters:
    # ESMFold2 confidence is stored on a 0–1 scale.
    - "overall_plddt >= 0.75"
    - "pae_min_ab_ag < 2"
    - "n_contact_pairs >= 25"
  loader:
    blob_dir: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/2026_09_18_antibody_antigen_esmfold2/blob
