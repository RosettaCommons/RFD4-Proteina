# CP-SEA designed macrocycles (5-16 residues), cyclized head-to-tail, isopeptide or disulfide.

defaults:
  - /datasets/train/backend_pandas@dataset
  - /design_tasks/presets@dataset.transform.design_tasks: unconditional
  - _self_

probability: 1.0

dataset:
  name: cpsea_ae
  data: ${oc.env:DATA_PATH}/train_datasets/cpsea/cpsea.parquet
  memory_map: True
  columns_to_load:
    - example_id
    - path
    - worst_pLDDT
    - rosetta_dG
    - accept_rate
    - favoured_rate
    - n_tokens
    - n_atoms
  filters:
    # Suggested quality filters from CP-SEA manuscript
    - "worst_pLDDT >= 90"
    - "rosetta_dG <= -30"
    - "accept_rate >= 1.0"
    - "favoured_rate >= 0.8"

    # (Dynamically filter on `n_tokens` to avoid cropping)
    - "n_tokens <= ${oc.select:_pdb_max_tokens,384}"
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/cpsea
