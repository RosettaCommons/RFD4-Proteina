defaults:
  - /datasets/train/pipeline_defaults@dataset
  - /datasets/sources/backend_blob@dataset
  - /design_tasks/presets@dataset.transform.design_tasks: unconditional
  - _self_

probability: 1.0
dataset:
  memory_map: true
  name: pdb_ptm_strict
  # Cropped structures define their own PN units; do not load parent-assembly selection metadata.
  columns_to_load: [example_id, passes_ae_audit, deposition_date, ptm_experiment_split, has_in_vocabulary_ptm]
  data: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/pdb/2026_09_19_ptm_crop/examples.parquet
  filters:
    - "passes_ae_audit == True"
    - "deposition_date < '2024-01-01'"
    - "ptm_experiment_split == 'train'"
    - "has_in_vocabulary_ptm == True"
  loader:
    blob_dir: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/pdb/2026_09_19_ptm_crop/blob
    parser_args:
      _target_: rfproteina.utils.parse_presets.annotated_cif
