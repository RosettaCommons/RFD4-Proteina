defaults:
  - /datasets/train/pipeline_defaults@dataset
  - /datasets/sources/backend_blob@dataset
  - /design_tasks/presets@dataset.transform.design_tasks: unconditional
  - _self_

probability: 1.0
dataset:
  memory_map: true
  name: na_complex
  data: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/2026_09_22_protein_dna_esmfold2/examples.parquet
  columns_to_load: [example_id, source_total_token_count, winner, strict_pass, structural_gates_pass]
  filters: ["winner == True", "strict_pass == True", "structural_gates_pass == True"]
  loader:
    blob_dir: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/2026_09_22_protein_dna_esmfold2/blob
