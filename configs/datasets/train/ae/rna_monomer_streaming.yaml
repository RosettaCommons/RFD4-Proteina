defaults:
  - /datasets/train/pipeline_defaults@dataset
  - /datasets/sources/backend_blob@dataset
  - /design_tasks/presets@dataset.transform.design_tasks: unconditional
  - _self_

probability: 1.0
dataset:
  memory_map: true
  name: rna_monomer
  data: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/2026_09_21_rna_monomers/examples.parquet
  columns_to_load:
    - example_id
    - source_training_eligible
    - n_rna_residues
    - passes_structure_validation
    - passes_bond_filters
    - passes_ribonanza_filters
    - passes_clash_filters
  filters:
    - "source_training_eligible == True"
    - "passes_structure_validation == True"
    - "passes_bond_filters == True"
    - "passes_ribonanza_filters == True"
    - "passes_clash_filters == True"
    - "n_rna_residues <= 768"
  loader:
    blob_dir: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/2026_09_21_rna_monomers/blob
