# RNA Monomer Dataset - RNA structures for autoencoder training.
# Uses filtered RNA distillation data.

defaults:
  - base
  - _self_

dataset:
  name: rna_monomer_ae
  data: ${oc.env:DATA_PATH}/train_datasets/rna_monomer/rna_monomer.parquet
  columns_to_load:
    - example_id
    - path
    - cluster_id
    - seq_hash
    - overall_plddt
    - overall_pde
    - overall_pae
