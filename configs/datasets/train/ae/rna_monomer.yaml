# RNA Monomer Dataset - RNA structures for autoencoder training
# Uses filtered RNA distillation data

defaults:
  - ../base@dataset
  - /design_tasks/default@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: rna_monomer_ae
  data: ${oc.env:DATA_PATH}/latent_train_parquet_files/rna_distillation_filtered_df.parquet
  columns_to_load:
    - example_id
    - path
    - cluster_id
    - seq_hash
    - overall_plddt
    - overall_pde
    - overall_pae
  loader:
    parser_args:
      add_missing_atoms: False
      sanitize_bonds_and_charges: False

  # Transform pipeline
  transform:
    crop_size: 384
    # Override task frequencies for RNA monomer (unconditional only for autoencoder)
    design_tasks:
      unconditional:
        frequency: 1
      folding:
        frequency: 0.0
      inverse_folding:
        frequency: 0.0
      motif_scaffold:
        frequency: 0.0
      # Disable all other tasks by setting frequency to 0
      random_atom_distance:
        frequency: 0.0
      tip_atom:
        frequency: 0.0
      tip_atom_distance:
        frequency: 0.0
      tip_atom_partial_ligand:
        frequency: 0.0
      tip_atom_partial_ligand_distance:
        frequency: 0.0
      motif_scaffold_2d:
        frequency: 0.0
      ppi_hotspot_with_internal_coord_target_motif:
        frequency: 0.0
      ppi_hotspot_with_3d_target:
        frequency: 0.0

