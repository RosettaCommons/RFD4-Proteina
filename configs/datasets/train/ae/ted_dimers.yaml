# TED Dimers Dataset - Protein dimers for autoencoder training
# Uses TED (Tertiary structure-based Evaluation of Dimers) dataset
# Unconditional only for AE training

defaults:
  - ../base@dataset
  - /design_tasks/default@dataset.transform.design_tasks
  - _self_

probability: 1.0  # Need this default for mixed samples

dataset:
  name: ted_dimers_ae
  data: ${oc.env:DATA_PATH}/latent_train_parquet_files/ted_dimers.parquet
  loader:
    parser_args:
      add_missing_atoms: False
      fix_formal_charges: False

  # Transform pipeline
  transform:
    crop_size: 384
    # Override task frequencies for autoencoder (unconditional only)
    design_tasks:
      unconditional:
        frequency: 1
      folding:
        frequency: 0.0
      inverse_folding:
        frequency: 0.0
      motif_scaffold:
        frequency: 0.0
      # Disable all other tasks by setting frequency to 0
      random_atom_distance:
        frequency: 0.0
      tip_atom:
        frequency: 0.0
      tip_atom_distance:
        frequency: 0.0
      tip_atom_partial_ligand:
        frequency: 0.0
      tip_atom_partial_ligand_distance:
        frequency: 0.0
      motif_scaffold_2d:
        frequency: 0.0
      ppi_hotspot_with_internal_coord_target_motif:
        frequency: 0.0
      ppi_hotspot_with_3d_target:
        frequency: 0.0
