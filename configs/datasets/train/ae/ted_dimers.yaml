# TED Dimers Dataset - Protein dimers for autoencoder training.
# Uses TED (Tertiary structure-based Evaluation of Dimers) dataset.

defaults:
  - base
  - _self_

dataset:
  name: ted_dimers_ae
  data: ${oc.env:DATA_PATH}/train_datasets/ted_dimers/ted_dimers.parquet
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/ted_dimers
