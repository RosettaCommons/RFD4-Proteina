# TED dimers for the AE.

defaults:
  - /datasets/train/pipeline_defaults@dataset
  - /datasets/sources/ted_dimers@dataset
  - /design_tasks/presets@dataset.transform.design_tasks: ae_uncond_folding
  - _self_

probability: 1.0

dataset:
  filters:
    - "InterfaceLength > 10"
    - "AvgIntPAE < 10"
    - "AvgIntPlddt > 70"
    - "n_standard_amino_acid_residues <= 768"
  transform:
    crop_size: 384
