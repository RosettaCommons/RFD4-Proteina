defaults:
  - /datasets/train/pipeline_defaults@dataset
  - /datasets/sources/backend_blob@dataset
  - /design_tasks/presets@dataset.transform.design_tasks: unconditional
  - _self_

probability: 1.0
dataset:
  memory_map: true
  name: afdb_monomer
  data: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/afdb_genie3_subset/examples.parquet
  columns_to_load: [example_id, path, n_standard_amino_acid_residues]
  loader:
    blob_dir: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/afdb_genie3_subset/blob
    record_id_colname: path
