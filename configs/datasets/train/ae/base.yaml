# Shared base for autoencoder training datasets.
# Leaf AE configs inherit distill dataset configs and only override AE-specific fields here.

defaults:
  - /design_tasks/unconditional@dataset.transform.design_tasks
  - _self_

probability: 1.0

dataset:
  transform:
    crop_size: ${dataloaders.train.dataloader_params.collate_fn.fixed_dimensions.I}
