# MGnify Dec 2025 Dataset - Autoencoder training on MGnify structures.

defaults:
  - base
  - _self_

dataset:
  name: mgnify_dec_2025_ae
  data: ${oc.env:DATA_PATH}/train_datasets/train_datasets/mgnify_dec_2025/mgnify_dec_2025.parquet
  columns_to_load:
    - example_id
    - path
    - ptm

  loader:
    # Parquet has relative paths; base_path is prepended to resolve them.
    # Full dataset is in .sqfs mounted at /squash/mgnify_dec_2025 inside container.
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/mgnify_dec_2025

  filters:
    - "ptm > 0.75"
