# MGnify Dec 2025 Dataset - Autoencoder training on MGnify structures.
# Same parquet as distill; AE uses ptm filter only (no length cap).

defaults:
  - /datasets/train/base_pandas@dataset
  - base
  - _self_

dataset:
  name: mgnify_dec_2025_ae
  data: ${oc.env:DATA_PATH}/train_datasets/mgnify_dec_2025/mgnify_dec_2025.parquet
  columns_to_load:
    - example_id
    - path
    - ptm
    - n_tokens
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/mgnify_dec_2025
  filters:
    - "ptm > 0.75"
