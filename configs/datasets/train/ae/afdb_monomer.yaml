# Monomer Distillation Dataset - AFDB monomers for autoencoder training.
# Uses AlphaFold Database structures for single-chain protein generation.

defaults:
  - base
  - _self_

dataset:
  name: afdb_monomer_distillation
  data: ${oc.env:DATA_PATH}/train_datasets/train_datasets/train_datasets/train_datasets/afdb_monomer/afdb_monomer_512.parquet
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/afdb_monomer
