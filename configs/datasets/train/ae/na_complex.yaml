# NA Complex Dataset - Protein-DNA/RNA complexes for autoencoder training.

defaults:
  - /datasets/train/base_pandas@dataset
  - base
  - _self_

dataset:
  name: na_complex_ae
  data: ${oc.env:DATA_PATH}/train_datasets/na_complex/na_complex.parquet
  columns_to_load:
    - example_id
    - path
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/na_complex
