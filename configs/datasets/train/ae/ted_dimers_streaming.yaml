defaults:
  - /datasets/train/pipeline_defaults@dataset
  - /datasets/sources/backend_blob@dataset
  - /design_tasks/presets@dataset.transform.design_tasks: unconditional
  - _self_

probability: 1.0
dataset:
  memory_map: true
  name: ted_dimers
  data: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/ted_dimers/examples.parquet
  columns_to_load: [example_id, path, n_tokens, n_res_a, n_res_b, InterfaceLength, AvgIntPAE, AvgIntPlddt]
  filters:
    - "InterfaceLength > 10"
    - "AvgIntPAE < 10"
    - "AvgIntPlddt > 70"
    - "n_res_a + n_res_b <= 768"
  loader:
    blob_dir: ${oc.env:DATASET_STORE_ROOT,s3://YOUR_DATASET_STORE}/train_datasets/streaming-latest/synthetic/ted_dimers/blob
    record_id_colname: path
  transform:
    crop_size: 384
