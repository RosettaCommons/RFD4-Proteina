# Experimental CP-SEA macrocycles from the PDB.
# WARNING: Carries atomized tokens!

# KNOWN DATA QUALITY ISSUE: This dataset contains bad geometry, including invalid bond lengths.
# Regenerate the structures and validate bond geometry before using a replacement dataset.

defaults:
  - /datasets/train/backend_pandas@dataset
  - /design_tasks/presets@dataset.transform.design_tasks: unconditional
  - _self_

probability: 1.0

dataset:
  name: cpsea_pdb_ae
  data: ${oc.env:DATA_PATH}/train_datasets/cpsea/cpsea_pdb.parquet
  memory_map: True
  columns_to_load:
    - example_id
    - path
    - accept_rate
    - favoured_rate
    - cluster_id
    - n_tokens
    - n_atoms
  filters:
    # Suggested quality filters from CP-SEA manuscript
    - "accept_rate >= 0.95"
    - "favoured_rate >= 0.7"

    # (Dynamically filter on `n_tokens` to avoid cropping)
    - "n_tokens <= ${oc.select:_pdb_max_tokens,384}"
  loader:
    base_path: ${oc.env:SQUASH_MOUNT_PATH,/squash}/cpsea_pdb
