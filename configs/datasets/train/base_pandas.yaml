# Parquet/Pandas-backed dataset base.

defaults:
  - base
  - _self_

_target_: atomworks.ml.datasets.PandasDataset
name: ???
data: ???

loader:
  _target_: atomworks.ml.datasets.loaders.create_base_loader
  example_id_colname: example_id
  path_colname: path
  assembly_id_colname: None
  parser_args:
    _target_: proteinfoundation.utils.parse_presets.distillation
    # Cache parsed structures to node-local NVMe
    save_to_cache: true
    load_from_cache: true
    cache_dir: ${oc.env:LOCAL_DRIVE_MOUNT,/tmp}/atomworks_parse_cache
