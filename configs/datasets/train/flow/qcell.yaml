# QCell biomolecular fragments for the flow model.

defaults:
  - /datasets/train/backend_lmdb@dataset
  - /datasets/sources/qcell@dataset
  - /design_tasks/presets@dataset.transform.design_tasks: all_off
  - _self_

probability: 1.0

dataset:
  transform:
    design_tasks:
      folding: {frequency: 5.0}
      unconditional: {frequency: 1.0}
      partial_ligand:
        frequency: 1.0
        transform:
          p_fix_ligand_surroundings: 0.5
