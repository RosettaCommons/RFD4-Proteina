# Architecture of the released denoiser

defaults:
  - local_latents_score_nn_160M_atom37
  - _self_

norm_type: rmsnorm_torch
update_pair_repr: true
update_pair_repr_every_n: 2
use_tri_mult: true

feats_seq:
  - xt_bb_ca
  - xt_local_latents
  - x_sc_bb_ca
  - x_sc_local_latents
  - token_type
  - cond_residue_type
  - cond_a37coors_nm
  - cond_a37coors_internal_nm
  - rasa_binned
  - secondary_structure
  - hbond
  - hotspot
  - not_cysteine
  - atom_charge
  - atomic_element
  - coord_group_seq
  - chirality
  - chain_centroid_xyz

feats_pair_repr:
  - xt_bb_ca_pair_dists
  - x_sc_bb_ca_pair_dists
  - bond_mask
  - bond_order
  - is_aromatic
  - index_group_pair
  - molecule_idx_pair
  - token_bond_path_length
  - canonical_polymer_ordering
