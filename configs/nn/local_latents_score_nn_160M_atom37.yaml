# Architecture of the current release denoiser.

name: local_latents_transformer  # name of architecture

output_parameterization:
  bb_ca: v  # or x_1
  local_latents: v  # or x_1

# Auxiliary sequence readout; detach prevents its loss from updating the trunk.
sequence_readout:
  enabled: true
  detach: true
  num_classes: 33


nlayers: 14  # number of transformer layers
token_dim: 768  # dimension of the tokens in the sequence
nheads: 12  # number of attn heads  12
parallel_mha_transition: False  # whether to compute mha and transition as parallel and add them up (AF3 style) or sequentially (normal transformers)

token_type_emb_dim: 32  # Embedding dimension for token type (protein/rna/dna/atomized/unknown)
cath_emb_dim: 32 # Embedding dimension for CATH code (subsetted to CAT)

strict_feats: False  # if False, then fills missing features with default values (e.g. chain break with zero, residue sequence index by [0, 1, 2, ...], etc)
# If True, if some feature is not provided, then it raises an error

use_atom37_factory: True  # Use FeatureFactoryAtom37 for pair features (supports bond features for ligands)

# Sequence features - updated for atom37 collate
feats_seq: [
  "xt_bb_ca",                   # Noised backbone CA coordinates [b, n, 3]
  "xt_local_latents",           # Noised local latents [b, n, latent_dim]
  "token_type",                 # Token type embedding (protein/rna/dna/atomized/unknown) [b, n, token_type_emb_dim]
  "cond_residue_type",          # Conditional residue type (prevents leakage) [b, n, 33]
  "cond_a37coors_nm",           # Conditional atom37 coordinates (prevents leakage) [b, n, 37*4]
  "cond_a37coors_internal_nm",  # Conditional atom37 internal coordinates [b, n, 37*4]
  "rasa_binned",                # RASA surface accessibility [b, n, 37]
  "secondary_structure",        # Secondary structure [b, n, embed_dim]
  "hbond_modernized",           # Hydrogen bonds: [is_donor, is_acceptor] [b, n, 37*2]
  "pistack",                    # Pi-stacking contacts [b, n, 37]
  "pication",                   # Pi-cation contacts: [is_aromatic, is_cation] [b, n, 37*2]
  "na_ss_state",                # Nucleic-acid state feature (unspecified/paired/loop) [b, n, 2]
  "hotspot",                    # Hotspot annotation [b, n, 37]
  "atom_charge",                # Atomic charge embedding for atomized tokens [b, n, 16]
  "atomic_element",             # Atomic element embedding for atomized tokens [b, n, 16]
  "coord_group_seq",              # Raw coordinate group in atom37 representation [b, n, 37]
  "chirality",                  # Block-diagonal chirality vector [b, n, 18]
  "chain_centroid_xyz",         # per-chain centroid xyz (nm) [b, n, 3]
]

# Sequence features to include in conditioning variables
feats_cond_seq: [
  "time_emb_bb_ca",
  "time_emb_local_latents",
  "cath_code",                 # CATH code, subsetted to CAT [b, n, embed_dim*3]
  ]

# Parameters for the features we extract
dim_cond: 256  # dimension of conditioning vector
idx_emb_dim: 256  # dimension of the sequence position [0, 1, 2, ...] (if contiguous residues) embeddings
t_emb_dim: 256  # dimension of the time embedding

# Pair features - updated for atom37 collate
feats_pair_repr: [
  "xt_bb_ca_pair_dists",        # Pairwise distances from noised CA [b, n, n, xt_pair_dist_dim]
  "bond_mask",                  # Bond existence mask for atomized molecules [b, n, n, 1]
  "bond_order",                 # Kekulé bond order + coordination for atomized molecules [b, n, n, 5]
  "is_aromatic",                # Aromaticity flag for atomized molecule bonds [b, n, n, 1]
  "index_group_pair",           # Binary feature indicating same C_IDXGRP index group [b, n, n, 1]
  "molecule_idx_pair",          # Binary feature indicating same molecule instance [b, n, n, 1]
  "molecule_entity_pair",       # Binary feature indicating the same molecular entity [b, n, n, 1]
  "token_bond_path_length",     # Pairwise path lengths in the token bond graph
  "canonical_polymer_ordering", # ±1 ordering of bonded canonical polymer residue pairs [b, n, n, 1]
  "na_ss_pair",                 # Nucleic acid secondary structure pair feature [b, n, n, 3]
]
feats_pair_cond: ["time_emb_bb_ca", "time_emb_local_latents"]  # Features to include in the pair representation conditioning

# Parameters for the pair features we extract
# Binning for the pair distances of noisy xt
xt_pair_dist_dim: 30
xt_pair_dist_min: 0.1  # in nm (not Å)
xt_pair_dist_max: 3  # in nm (not Å)
# Relative sequence separation (also used as bin count for TokenBondPathLengthPairFeat).
# For the bond-path-length feature to populate its high-distance bins, this should be
# <= (path_length_search_cutoff + 1) in configs/datasets/train/pipeline_defaults.yaml (default 65).
seq_sep_dim: 64  # halved vs the rel_seq_sep baseline -- path length is unsigned
# Dimension of final pair representation
pair_repr_dim: 256

update_pair_repr: true  # whether to update pair representation
update_pair_repr_every_n: 2  # Update the pair representation every n layers
use_tri_mult: true  # whether to use triangular multiplication layers in pair update, ignored if not updating pair representation
tri_mult_c: 256  # hidden dim of the triangle multiplication layers
tri_mult_bias: false  # whether triangle multiplication projections and normalizations learn additive biases
tri_mult_backend: torch  # or cuequivariance (fused on H200 only at pair_repr_dim 384, tri_mult_c 256; else warns, uses torch)

# Recycle single and pair states through zero-initialized projections.
recycle:
  enabled: true
  grad: last  # last | last2 | all

# Activation checkpointing: none | low (pair updates) | medium (pair updates and recycle cycles).
checkpointing: none

# Single-to-pair update: sum (z + pi_i + pj_j) or hadamard (z + pi_i * pj_j).
pair_write: hadamard

use_qkln: True

# Attention implementation:
#   - "torch" (default): F.scaled_dot_product_attention (memory-efficient SDPA; the
#     pair bias precludes the FlashAttention-2 kernel), with an einsum CPU fallback.
#   - "cuequivariance": cuequivariance_torch fused kernel (requires cuequivariance_torch).
attention_type: torch

# torch.compile:
#   - false (default): No compilation, eager mode
#   - true: Wraps the forward pass with torch.compile for potential speedups
use_torch_compile: true

# Norm: layer_norm, rmsnorm_torch, rmsnorm_torch_fused (BF16 output), or rmsnorm_apex.
# Honored by feature output norms, both attention paths, and AdaptiveLayerNorm.
norm_type: rmsnorm_torch_fused
