# @package _global_
#
# Beam search config for GPU regression tests.
# Uses clash-based reward (no RF3 oracle) so the test exercises real reward
# discrimination between candidates without requiring a slow oracle.
#

defaults:
  - inference_like_rfd3
  - _self_

inputs: ${oc.env:PROJECT_ROOT}/projects/proteinfoundation/benchmarks/monomer.json
subset_to_examples: monomer-short

metrics_tags: [design]

search:
  strategy:
    _target_: proteinfoundation.search.beam_search.BeamSearchStrategy
    step_checkpoints: [0, 100, 200, 300, 400]
    n_branch: 2
    beam_width: 3
    keep_intermediate_samples: false

  rewards:
    reward_metrics_tags: [design]
    weights:
      # Penalise steric clashes; frac_atoms_clashing is in [0, 1] so reward
      # is in [-1, 0], with 0 being clash-free (best).
      clash_metrics.frac_atoms_clashing_1p5A: -1.0
    differentiable: false

generation:
  args:
    nsteps: 400
    self_cond: true
    guidance_w: 1.0
  model:
    bb_ca:
      simulation_step_params:
        sc_scale_noise: 0.3
    local_latents:
      simulation_step_params:
        sc_scale_noise: 0.1
