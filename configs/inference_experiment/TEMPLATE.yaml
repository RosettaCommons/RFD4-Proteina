#         ckpt_path: ${oc.env:DATA_PATH}/rf3_checkpoints/rf3-with-confidence-xaira-epoch-0711-fixed.ckpt
#         num_steps: 50
#         n_recycles: 5
#     # Optional: clip a metric before its weight is applied (raw value still reported).
#     clip_values:
#       rf3.plddt:
#         min: 60.0
#     weights:
#       rf3.plddt: 1.0
#     # Optional: change the reward mid-trajectory. Keys are steps (one of
#     # step_checkpoints past the first); each entry is a sub-version of the reward above,
#     # inheriting anything it does not name. Every field it *does* name
#     # (`weights`, `clip_values`, `reward_metrics_tags`) replaces the base one wholesale,
