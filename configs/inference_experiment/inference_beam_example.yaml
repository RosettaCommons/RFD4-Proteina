# @package _global_
#
# Beam search inference example.
# BeamSearchStrategy with an AF3 reward on the monomer-short benchmark:
#   - 400 diffusion steps, checkpointed at [0, 100, 200, 300, 400]
#   - n_branch=2, beam_width=3
#   - sc_scale_noise=0.3/0.1 (bb_ca/latents)
#   - AF3 reward: pLDDT (chain-of-interest) only
#
# Usage: python src/rfproteina/generate.py inference_experiment=inference_beam_example

defaults:
  - inference_on_user_inputs
  - _self_


inputs: ${oc.env:PROJECT_ROOT}/data/benchmarks/monomer.json
subset_to_examples: monomer-short

num_replicates: 2
batch_size: 1
global_prefix: beam_example

out_dir: outputs/beam_example
run_name_: beam_example

# Outer metrics_tags: controls which metrics run in the epoch-end oracle loop.
# With unconditional_refolding, the epoch-end loop calls the oracle on final outputs but
# finds cached results from beam scoring — so it is fast and populates columns
# in per_example_metrics.csv.
metrics_tags: [design, unconditional_refolding]

search:
  strategy:
    _target_: rfproteina.search.beam_search.BeamSearchStrategy
    step_checkpoints: [0, 100, 200, 300, 400]
    n_branch: 2
    beam_width: 3
    # Keep the rolled-out candidates that lost the beam but still folded well.
    intermediate_sample_save_criterion:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        search.reward:
          min: 80.0

  rewards:
    # Inner tags: controls which metrics fire during beam scoring.
    # [unconditional_refolding] → AF3 oracle runs on every rolled-out candidate,
    # caching results to disk for reuse by the epoch-end loop.
    reward_metrics_tags: [unconditional_refolding]

    weights:
      oracle.plddt_coi: 1.0


generation:
  args:
    nsteps: 400
    self_cond: true
  model:
    bb_ca:
      simulation_step_params:
        sc_scale_noise: 0.3
    local_latents:
      simulation_step_params:
        sc_scale_noise: 0.1

num_workers: 4
