# @package _global_
# Beam search maximizing interface protein<->ligand H-bonds. Target is SAM.
#   rfd4-generate inference_experiment=sm_binder_hbond_search

defaults:
  - inference_on_user_inputs
  - _self_

inputs: ${oc.env:PROJECT_ROOT}/data/benchmarks/small_molecule_binder/SAM_hbonds.cif
num_replicates: 1

out_dir: ./runs/sm_binder_hbond_search
run_name_: sm_binder_hbond_search

# Persist the winning design's interface-interaction metrics to per_example_metrics.csv.
metrics_tags: [interchain_interactions]

search:
  strategy:
    _target_: rfproteina.search.beam_search.BeamSearchStrategy
    step_checkpoints: [0, 40, 60]  # start at 0, increasing, end at the refined schedule length
    n_branch: 2
    beam_width: 2
  rewards:
    # Base reward: applies at every checkpoint unless overridden below.
    reward_metrics_tags: [interchain_interactions]
    weights:
      "interchain_interactions.hbond_atom_pair_count_coi": 1.0

    # Optional: change the reward mid-trajectory, keyed by the step it takes effect at
    # (one of step_checkpoints past the first). Each field an entry names replaces the
    # base one outright; fields it omits are inherited. Here the early checkpoint (40)
    # uses the base H-bond reward alone, then the final checkpoint (60) caps the H-bond
    # term and starts rewarding hydrophobic packing too — `weights` restates every term
    # that should still count, since it replaces the base list rather than merging.
    checkpoint_overrides:
      60:
        weights:
          "interchain_interactions.hbond_atom_pair_count_coi": 1.0
          "interchain_interactions.hydrophobic_atom_pair_count_coi": 0.5
        clip_values:
          "interchain_interactions.hbond_atom_pair_count_coi":
            max: 6.0
