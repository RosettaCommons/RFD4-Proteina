# @package _global_

# Quick test search config for 70k checkpoint with Best-of-N
# Usage: python rfproteina/generate.py --config-name inference_test_search

defaults:
  - inference_like_rfd3
  - _self_

# Checkpoint
ckpt_path: ${oc.env:DATA_PATH}/latent_checkpoints/ldm_checkpoints
ckpt_name: ???

# Autoencoder
autoencoder_ckpt_path: ${oc.env:DATA_PATH}/latent_checkpoints/ae_checkpoints/AE_ucond_512.ckpt

# Use the unconditional benchmark JSON directly
inputs: ${oc.env:PROJECT_ROOT}/data/benchmarks/monomer.json

num_replicates: 1  # Number of times to replicate each example

# Output
out_dir: outputs/search_test_70k
run_name_: search_test

# Search configuration
search:
  # Strategy definition
  strategy:
    _target_: rfproteina.search.best_of_n.BestOfNStrategy
    n_samples: 5
    keep_all: false
  
  # Reward model for scoring (uses oracle manager from metrics/refolding_oracles=rf3)
  rewards:
    reward_metrics_tags: [unconditional_refolding]
    weights:
      rf3.plddt: 1.0
      rf3.iptm: 2.0
      rf3.ipae: -1.0

# Generation settings
generation:
  args:
    nsteps: 100
    self_cond: true
    guidance_w: 1.0

# Dataloader
num_workers: 4

