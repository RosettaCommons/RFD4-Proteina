# @package _global_

# Quick test beam search config for 70k checkpoint
# Usage: python proteinfoundation/generate.py --config-name inference_test_beam

defaults:
  - inference_like_rfd3
  - _self_

# Checkpoint
ckpt_path: /path/to/home
ckpt_name: chk_epoch=00000006_step=000000070000.ckpt

# Autoencoder
autoencoder_ckpt_path: ${oc.env:DATA_PATH}/latent_checkpoints/ae_checkpoints/AE_ucond_512.ckpt

PDB_ID: ???

# Use the unconditional benchmark JSON directly
inputs: ${oc.env:PROJECT_ROOT}/projects/proteinfoundation/benchmarks/hard_motif_scaffold_targets/${PDB_ID}.json

num_replicates: 100  # Number of times to replicate each example
batch_size: 20

gen_njobs: 1

# Output
out_dir: outputs/vanilla_test_${PDB_ID}
run_name_: beam_test

# Beam search configuration
search:
  # Strategy definition
  strategy:
    _target_: proteinfoundation.search.beam_search.BeamSearchStrategy
    step_checkpoints: [0, 100, 200, 300, 400]
    n_branch: 4
    beam_width: 4
    keep_intermediate_samples: true
  
  # Reward model for scoring (nested under search)
  rewards:
    metrics:
      rf3:
        _target_: proteinfoundation.metrics.rf3_metric.RF3Metric
        ckpt_path: ${oc.env:DATA_PATH}/rf3_checkpoints/rf3-with-confidence-xaira-epoch-0711-fixed.ckpt
        num_steps: 50
        n_recycles: 5
        metric_manager:
          _target_: foundry.metrics.metric.MetricManager
          metrics:
            backbone_rmsd:
              _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
              input_kwarg_names:
                ground_truth_atom_array_stack: ground_truth_atom_array_stack
                predicted_atom_array_stack: predicted_atom_array_stack
              align_mask: is_protein
              subset_mask: is_protein_backbone
              metric_type: rmsd
            motif_rmsd:
              _target_: proteinfoundation.metrics.gt_structure_comparison.StructureComparisonMetric
              input_kwarg_names:
                ground_truth_atom_array_stack: ground_truth_atom_array_stack
                predicted_atom_array_stack: predicted_atom_array_stack
              align_mask: is_protein & mapped_to_coordinate_conditioned_region
              subset_mask: is_protein & mapped_to_coordinate_conditioned_region
              metric_type: rmsd
    
    weights:
      rf3.backbone_rmsd.rmsd_align=<is_protein>_subset=<is_protein_backbone>: -1.0
      rf3.motif_rmsd.rmsd_align=<is_protein&mapped_to_coordinate_conditioned_region>_subset=<is_protein&mapped_to_coordinate_conditioned_region>: -2.0
    
    differentiable: false

# Generation settings
generation:
  args:
    nsteps: 400
    self_cond: true
    guidance_w: 1.0

# Dataloader
num_workers: 4


