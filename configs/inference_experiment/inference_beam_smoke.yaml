# @package _global_
#
# Minimal beam search smoke test.
# Tests BeamSearchStrategy + RF3 reward model integration with low compute:
#   - 200 diffusion steps, checkpointed at [0,50,100,150,200]
#   - n_branch=2, beam_width=2 (minimal branching factor)
#   - sc_scale_noise=0.2/0.3 (bb_ca/latents) — exercises noise-scale params from integration tests
#   - RF3 reward: pLDDT only, num_steps=5, n_recycles=0
#   - 1 replicate of monomer-short, seed=42
#
# Usage:
#   ./slurm_utils/launch_infer.sh digs --no-copy \
#       --config-name inference_experiment/inference_beam_smoke \
#       ckpt_path=<CKPT_DIR> ckpt_name=<CKPT_NAME>.ckpt

defaults:
  - inference_like_rfd3
  - _self_

ckpt_path: ???
ckpt_name: ???

autoencoder_ckpt_path: ${oc.env:DATA_PATH}/latent_checkpoints/ae_checkpoints/AE_ucond_512.ckpt

inputs: ${oc.env:PROJECT_ROOT}/projects/proteinfoundation/benchmarks/monomer.json
subset_to_examples: monomer-short

num_replicates: 1
batch_size: 1
seed: 42
global_prefix: smoke_beam

out_dir: outputs/beam_smoke
run_name_: beam_smoke

metrics_tags: unconditional_refolding

search:
  strategy:
    _target_: proteinfoundation.search.beam_search.BeamSearchStrategy
    step_checkpoints: [0, 50, 100, 150, 200]
    n_branch: 2
    beam_width: 2
    keep_intermediate_samples: false

  rewards:
    metrics:
      rf3:
        _target_: proteinfoundation.metrics.rf3_metric.RF3Metric
        ckpt_path: ${oc.env:DATA_PATH}/rf3_checkpoints/rf3-with-confidence-xaira-epoch-0711-fixed.ckpt
        num_steps: 5
        n_recycles: 0

    weights:
      rf3.plddt: 1.0

    differentiable: false

generation:
  args:
    nsteps: 200
    self_cond: true
    guidance_w: 1.0
  model:
    bb_ca:
      simulation_step_params:
        sc_scale_noise: 0.2
    local_latents:
      simulation_step_params:
        sc_scale_noise: 0.3

num_workers: 4
