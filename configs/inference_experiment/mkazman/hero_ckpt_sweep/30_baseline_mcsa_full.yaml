# @package _global_
#
# Offline validation of the hero BASELINE model (centroid + RASA + absolute
# coords, experiment 30_hero_baseline_centroid_rasa_abs_coord) on the full,
# unfixed MCSA val set (all 41 examples, no subset_to_keys).
#
# The model architecture and product flow matcher are restored from the
# checkpoint hparams, so nothing model-specific needs to be set here. The AF3
# refolding oracle matches what experiment 30 used during training validation.
#
# ckpt_path / ckpt_name / run_name_ are supplied per-launch (see the launch
# command for each checkpoint step).

defaults:
  - /inference_experiment/inference_on_val_set
  - /datasets/val@generation: mcsa/mcsa_full
  - override /metrics/refolding_oracles: af3
  - _self_
