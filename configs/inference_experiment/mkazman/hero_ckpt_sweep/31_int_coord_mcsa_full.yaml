# @package _global_
#
# Offline validation of the hero INTERNAL-COORD-ONLY model (experiment
# 31_hero_int_coord_only) on the full, unfixed MCSA val set (all 41 examples,
# no subset_to_keys).
#
# Like the baseline, the architecture and product flow matcher (including the
# per-group stochastic centering) are restored from the checkpoint hparams.
# The one piece of data-side state that is NOT in the checkpoint is the
# `convert_absolute_to_internal` transform flag: experiment 31 trained and
# validated with absolute->internal coordinate conversion on, so we must
# replicate that here for the conditioning to match the model.

defaults:
  - /inference_experiment/inference_on_val_set
  - /datasets/val@generation: mcsa/mcsa_full
  - override /metrics/refolding_oracles: af3
  - _self_

generation:
  dataset:
    transform:
      convert_absolute_to_internal: True
