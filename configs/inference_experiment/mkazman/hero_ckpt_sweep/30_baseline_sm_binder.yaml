# @package _global_
#
# Offline validation of the hero BASELINE model (centroid + RASA + absolute
# coords, experiment 30_hero_baseline_centroid_rasa_abs_coord) on the sm_binder
# val set. Mirrors 30_baseline_mcsa_full but swaps the dataset.
#
# The model architecture and product flow matcher are restored from the
# checkpoint hparams. The AF3 refolding oracle matches what experiment 30 used
# during training validation.
#
# ckpt_path / ckpt_name / run_name_ are supplied per-launch.

defaults:
  - /inference_experiment/inference_on_val_set
  - /datasets/val@generation: sm_binder
  - override /metrics/refolding_oracles: af3
  - _self_
