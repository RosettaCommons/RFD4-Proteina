# Standalone BindCraft refinement config
# Usage: python proteinfoundation/refine.py --config-name refine_bindcraft inputs=my_structure.pdb

# Input (single file or directory)
inputs: ???  # REQUIRED: path to PDB/CIF file or directory

# Output directory
output_dir: refined_structures

# Refinement strategy
refinement:
  strategy:
    _target_: proteinfoundation.refinement.bindcraft.BindCraftRefinement
    mode: full  # 'full' or 'hard_only'
    n_soft_iters: 45
    n_hard_iters: 5
    n_greedy_iters: 15
    n_recycles: 3

# Autoencoder (not needed for BindCraft, but available if needed)
autoencoder_ckpt_path: null

# Reward model (must be differentiable)
rewards:
  metrics:
    af2:
      _target_: proteinfoundation.metrics.af2_metric.AF2Metric
      model_name: model_1_ptm
      num_recycles: 3
      use_templates: false
      protocol: binder
      data_dir: ${oc.env:DATA_PATH}/tools/AF2
  
  weights:
    af2.plddt: 1.0
    af2.ptm: 2.0
    af2.pae: -1.0
  
  differentiable: true  # CRITICAL: Must be true for refinement

