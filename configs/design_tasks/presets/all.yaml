# All available design tasks with default-balanced frequencies.
# Datasets can inherit this and override individual task frequencies.
#
# Distance tasks stay at 0.0 (inherited from all_off) — we cannot provide
# distance information to the model yet.

defaults:
  - all_off
  - _self_

unconditional:              {frequency: 2.0}
folding:                    {frequency: 1.0}
inverse_folding:            {frequency: 1.0}
motif_scaffold:             {frequency: 1.0}
tip_atom:                   {frequency: 2.0}
tip_atom_partial_ligand:    {frequency: 2.0}
ppi_hotspot_with_3d_target: {frequency: 1.0}
