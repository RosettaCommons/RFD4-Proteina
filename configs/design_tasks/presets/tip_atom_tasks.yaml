# Tip-atom pocket training mix (no pocket-convex-hull task):
# 35% tip_atom, 35% tip_atom_partial_ligand, 10% motif_scaffold,
# 10% unconditional, 5% folding, 5% inverse folding.

defaults:
  - all_off
  - _self_

unconditional:            {frequency: 10.0}
folding:                  {frequency: 5.0}
inverse_folding:          {frequency: 5.0}
motif_scaffold:           {frequency: 10.0}
tip_atom_partial_ligand:  {frequency: 35.0}
tip_atom:                 {frequency: 35.0}
