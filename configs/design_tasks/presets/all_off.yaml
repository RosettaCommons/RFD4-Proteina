# Canonical catalogue of every design task at frequency: 0.0.
# Other presets inherit from this (via ``defaults: [all_off, _self_]``) and
# override only the tasks they enable — their file bodies become small
# "diff" lists of non-zero frequencies rather than exhaustive re-declarations.
#
# Adding a new design task: add it here (with full default kwargs), then
# any preset can opt in with just ``<task_name>: {frequency: <n>}``.
#
# NOTE: All distance tasks are disabled for now as we cannot provide distance information to the model yet.

unconditional:
  frequency: 0.0
  transform:
    _target_: proteinfoundation.transforms.design_task.UnconditionalTask
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

folding:
  frequency: 0.0
  transform:
    _target_: proteinfoundation.transforms.design_task.StructurePredictionTask
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

inverse_folding:
  frequency: 0.0
  transform:
    _target_: proteinfoundation.transforms.design_task.InverseFoldingTask
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

tip_atom:
  frequency: 0.0
  transform:
    _target_: proteinfoundation.transforms.design_task.TipAtomTask
    min_residues: 2
    max_residues: 8
    p_tip_atom: 0.5
    p_merge_unindexed_groups: 0.1
    p_split_unindexed_groups: 0.01
    p_increase_group_id_gap: 0.1
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

tip_atom_partial_ligand:
  frequency: 0.0
  transform:
    _target_: proteinfoundation.transforms.design_task.TipAtomPartialLigandTask
    n_max_ligands: 3
    n_hops_expected_ligand: 5
    n_max_residues: 8
    n_hops_expected_tip_atom: 1
    p_seq_conditioned: 1.0
    p_knockout_seq: 0.0
    p_merge_unindexed_groups: 0.1
    p_split_unindexed_groups: 0.01
    p_increase_group_id_gap: 0.1
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

motif_scaffold:
  frequency: 0.0
  transform:
    _target_: proteinfoundation.transforms.design_task.MotifScaffoldTask
    min_tokens_per_motif: 1
    max_tokens_per_motif: 50
    min_coverage_fraction: 0.05
    max_coverage_fraction: 1.0
    max_unindexed_tokens: 50
    p_unindex_any: 0.5
    p_merge_unindexed_groups: 0.1
    p_split_unindexed_groups: 0.01
    p_increase_group_id_gap: 0.1
    p_backbone_only: 0.0
    p_bb_only_seq_conditioned: 0.3
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}


ppi_hotspot_with_3d_target:
  frequency: 0.0
  transform:
    _target_: proteinfoundation.transforms.design_task.PPIHotspotWith3DTarget
    hotspot_count_distribution: geometric
    hotspot_geometric_p: 0.2
    max_hotspots_frac_to_provide: 0.1
    p_no_hotspots: 0.05
    hotspot_max_distance: 4.5
    motif_distance_knockout_p: 0.95
    min_dropout_2d_dist: 0.5
    max_dropout_2d_dist: 0.9
    jitter_sigma: 5.0
    ppi_crop_binder_fraction: 0.667
    p_sample_ppi_crop: 0.75
    bb_only_coord_conditioning: False
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

tip_atom_pocket:
  frequency: 0.0
  transform:
    _target_: proteinfoundation.transforms.design_task.TipAtomActiveSiteTask
    tip_atom_rasa_threshold: 0.2
    min_tip_atoms: 2
    max_tip_atoms: 15
    p_seq_conditioned: 1.0
    p_knockout_seq: 0.0
    p_unindex_all: 0.5
    p_unindex_any: 0.05
    p_merge_unindexed_groups: 0.1
    p_split_unindexed_groups: 0.01
    p_increase_group_id_gap: 0.1
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

motif_scaffold_proteina_ame:
  frequency: 0.0
  transform:
    _target_: proteinfoundation.transforms.design_task.MotifScaffoldProteinaTask
    atom_selection_mode: ame
    residue_selection_mode: absolute_number
    motif_min_n_res: 2
    motif_max_n_res: 8
    unindex_mode: simple
    p_unindex_motif: 1.0
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

partial_ligand:
  frequency: 0.0
  transform:
    _target_: proteinfoundation.transforms.design_task.PartialLigandTask
    min_coverage_fraction: 0.0
    max_coverage_fraction: 1.0
    p_fix_ligand_surroundings: 0.0
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}
