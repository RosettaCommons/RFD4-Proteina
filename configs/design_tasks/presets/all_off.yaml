# Canonical catalogue of every design task at frequency: 0.0.
# Other presets inherit from this (via ``defaults: [all_off, _self_]``) and
# override only the tasks they enable — their file bodies become small
# "diff" lists of non-zero frequencies rather than exhaustive re-declarations.
#
# Adding a new design task: add it here (with full default kwargs), then
# any preset can opt in with just ``<task_name>: {frequency: <n>}``.
#

unconditional:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.UnconditionalTask
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

folding:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.StructurePredictionTask
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

inverse_folding:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.InverseFoldingTask
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

tip_atom:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.TipAtomTask
    min_residues: 2
    max_residues: 8
    p_tip_atom: 0.5
    p_merge_unindexed_groups: 0.1
    p_split_unindexed_groups: 0.01
    p_increase_group_id_gap: 0.1
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

tip_atom_partial_ligand:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.TipAtomPartialLigandTask
    n_max_ligands: 3
    n_hops_expected_ligand: 5
    n_max_residues: 8
    n_hops_expected_tip_atom: 1
    p_seq_conditioned: 1.0
    p_knockout_seq: 0.0
    p_merge_unindexed_groups: 0.1
    p_split_unindexed_groups: 0.01
    p_increase_group_id_gap: 0.1
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

motif_scaffold:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.MotifScaffoldTask
    min_tokens_per_motif: 1
    max_tokens_per_motif: 50
    min_coverage_fraction: 0.05
    max_coverage_fraction: 1.0
    max_unindexed_tokens: 50
    p_unindex_any: 0.5
    p_merge_unindexed_groups: 0.1
    p_split_unindexed_groups: 0.01
    p_increase_group_id_gap: 0.1
    p_backbone_only: 0.0
    p_bb_only_seq_conditioned: 0.3
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}


binder_hotspot_with_3d_target:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.BinderHotspotWith3DTarget
    hotspot_count_distribution: geometric
    hotspot_geometric_p: 0.2
    max_hotspots_frac_to_provide: 0.1
    p_no_hotspots: 0.05
    hotspot_max_distance: 4.5
    ppi_crop_binder_fraction: 0.667
    p_sample_ppi_crop: 0.75
    p_bb_only_coord_conditioning: 0.0
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

tip_atom_pocket:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.TipAtomActiveSiteTask
    tip_atom_rasa_threshold: 0.2
    min_tip_atoms: 2
    max_tip_atoms: 15
    p_seq_conditioned: 1.0
    p_knockout_seq: 0.0
    p_unindex_all: 0.8
    p_unindex_any: 0.05
    p_merge_unindexed_groups: 0.1
    p_split_unindexed_groups: 0.01
    p_increase_group_id_gap: 0.1
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

partial_ligand:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.PartialLigandTask
    min_coverage_fraction: 0.0
    max_coverage_fraction: 1.0
    p_fix_ligand_surroundings: 0.0
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

protein_from_dna_structure_context:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.ProteinFromDNAStructureContextTask
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

protein_from_dna_sequence_context:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.ProteinFromDNASequenceContextTask
    global_design_task_kwargs: ${datasets.global_design_task_kwargs}

ig_framework_conditioning:
  frequency: 0.0
  transform:
    _target_: rfproteina.transforms.design_task.IgFrameworkConditioningTask
    global_design_task_kwargs:
      rasa_kwargs: {p_add_rasa_condition: 0.6}
      hbond_kwargs: {p_add_hbond_condition: 0.2}
      secondary_structure_kwargs: {p_add_secondary_structure_condition: 0.1}
      cath_kwargs:
        p_add_cath_c_condition: 0.1
        p_add_cath_ca_condition: 0.15
        p_add_cath_cat_condition: 0.25
    cdr_expand_min: -3
    cdr_expand_max: 4
    p_fix_all_but_cdr3: 0.2
    p_cdr_fixed: 0.05
    p_framework_seq_cond: 0.8
    p_framework_bb_only: 0.3
    p_flexible_target: 0.1
    p_target_intcoord: 0.5
    p_target_bb_only: 0.3
    p_separate_ig_coord_groups: 0.5
    p_no_hotspots: 0.05
    hotspot_max_distance: 4.5
    max_hotspots_frac_to_provide: 0.1
    hotspot_count_distribution: uniform
    hotspot_geometric_p: null
