[project]
name = "proteinfoundation"
version = "0.0.1"
description = "protein foundation models"
requires-python = ">=3.12,<=3.12.10"
dependencies = [
    # ASE for molecular datasets
    "ase>=3.22.0",
    "lmdb",  # Python LMDB bindings for ASE's LMDB backend
    # Additional utilities
    "loguru",
    "matplotlib",
    "scikit-learn",
    # Validation metrics
    "posebusters",
    "mace-torch>=0.3.15",
]

[project.optional-dependencies]
metrics = [
    "hydride>=1.2",
    "graph-longrange @ git+https://github.com/WillBaldwin0/graph_electrostatics.git",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu12",
]
dev = [
    # Linters & formatters
    "ruff==0.8.3",
    # Debugger/interactive
    "debugpy>=1.8.5,<2",
    "ipykernel>=6.29.4,<7",
    # Testing tools
    "pytest>=8.2.0,<9",
    "pytest-testmon>=2.1.1,<3",
    "pytest-xdist>=3.6.1,<4",
    "pytest-dotenv>=0.5.2,<1",
    "pytest-cov>=4.1.0,<5",
    "pytest-benchmark>=5.0.0,<6",
    "assertpy",
]

# Build system 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "proteinfoundation",
    "slurm_utils",
    "script_utils",
]

[tool.hatch.build.targets.wheel.shared-data]
"proteinfoundation" = "proteinfoundation"
"openfold" = "openfold"
"slurm_utils" = "slurm_utils"
"script_utils" = "script_utils"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "env",
    ".venv",
    "venv",
    "data",
    "dev.py",
    "ProteinMPNN/*"
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Enable a comprehensive set of rules for better code quality
extend-select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    #"D",   # pydocstyle
    "UP",  # pyupgrade -- use the latest supported python syntax
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "NPY", # fix deprecated numpy functions / types
    "RUF", # Ruff-specific rules
    "T10", # catch accidental debugger breakpoints in code
    "ANN"
]

# Ignore specific rules that might conflict with our style or are too strict
ignore = [
    "B006",  # do not use mutable data structures for argument defaults
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D100",  # Missing docstring in public module
    "NPY002",  # replacing legacy np.random.rand wih np.random.Generator
    "SIM108",  # Replace if-else blocks
    "ANN002",  # missing annotation for `*args`
    "ANN003",  # missing annotation for `**kwargs`
    "ANN204",  # missing return type annotation for special method `__init__`
    "ANN401",  # disallow `Any` type
    "F722",  # for jaxtyping shape annotation
    "F821",  # temporary to avoid jaxtyping warnings
    "E741",  # enable us to use variables like "L"
    "N806",  # enable us to use capital letters in variable names, also like "L"
    "N812",  # allow standard conventions like `import lightning as L` and `import torch.nn.functional as F`
    "N801",  # enable us to use non-CapWords class names
    "N802",  # enable us to use capital letters in function names
    "N803",  # enable us to use capital letters in argument names
]

[tool.ruff.lint.isort]
known-first-party = ["foundry", "foundry_cli", "rf3", "rfd3", "mpnn", "proteinfoundation", "modelhub"]
known-third-party = ["wandb"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Add per-file-ignores for specific cases
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py files
"tests/*" = ["D", "E", "RUF", "ANN"]         # Ignore docstring rules in tests

[tool.pyright]
typeCheckingMode = "off"