[project]
name = "rfproteina"
version = "0.0.1"
description = "protein foundation models"
requires-python = ">=3.12,<=3.12.10"
dependencies = [
    # Structure I/O + ML data pipeline. Vendored as a submodule under lib/ -- see
    # [tool.uv.sources]. `uv pip install` does NOT honour tool.uv.sources, so setup.sh
    # installs `-e lib/atomworks` explicitly; otherwise it resolves from PyPI instead.
    "atomworks[ml]",
    # atomworks hard-asserts this exact version at import; posebusters/mace pull newer.
    "biotite==1.6.0",
    # Configuration & CLI (inherited from the root rc-foundry project)
    "rootutils>=1.0.7,<1.1",
    "hydra-core>=1.3.0,<1.4",
    "environs>=11.0.0,<12",
    "typer>=0.20.0,<1",
    "fire",
    # Logging
    "wandb>=0.15.10,<1",
    "rich>=13.9.4",
    "loguru",
    # Typing
    "jaxtyping>=0.2.17,<1",
    "beartype>=0.18.0,<1",
    # ML core
    "torch>=2.9.0,<3",
    "lightning>=2.5.0",
    "loralib>=0.1.1",
    "einops>=0.8.0,<1",
    "einx>=0.1.0,<1",
    "opt_einsum>=3.4.0,<4",
    "dm-tree>=0.1.6,<1",
    # Data / numerics
    "pandas",
    "zstandard",
    "toolz",
    "matplotlib",
    "networkx",
    "scikit-learn",
    # ASE for molecular datasets
    "ase>=3.22.0",
    "lmdb",  # Python LMDB bindings for ASE's LMDB backend
    # Validation metrics
    "posebusters",
    "mace-torch>=0.3.15",
    # Interactive
    "ipykernel>=6.31.0",
    "assertpy",
]

# atomworks is vendored as a git submodule under lib/.
[tool.uv.sources]
atomworks = { path = "lib/atomworks", editable = true }

[project.optional-dependencies]
# TMol wheel must match NGC PyTorch (torch 2.10 + CUDA 13.1 + cp312); see latent-dev.def.
# Runtime deps are listed here so Docker `uv pip compile --extra tmol` installs them in the main
# layer (torch excluded). The tmol wheel is installed --no-deps at image build end.
tmol = [
    "attrs>=21.0,<26",
    "attrs-strict>=1.0,<2",
    "astor>=0.8,<1",
    "cattrs>=22.0,<25",
    "frozendict>=2.4,<3",
    "hypothesis>=5.35,<7",
    "ipython>=8.0",
    "llvmlite>=0.39,<1",
    "numba>=0.56,<1",
    "pint>=0.23,<1",
    "psutil>=5.9,<8",
    "pyarrow>=12,<23",
    "rdkit>=2024.3",
    "sparse>=0.13,<1",
    "typing-inspect>=0.9,<1",
    "tmol @ https://github.com/uw-ipd/tmol/releases/download/v0.1.35/tmol-0.1.35+cu131torch2.10-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
]
metrics = [
    "hydride>=1.2",
    "graph-longrange @ git+https://github.com/WillBaldwin0/graph_electrostatics.git",
    "cuequivariance-torch>=0.8.1; sys_platform == 'linux'",
    "cuequivariance-ops-cu13>=0.8.1; sys_platform == 'linux'",
    "cuequivariance-ops-torch-cu13>=0.8.1; sys_platform == 'linux'",
]
dev = [
    # Linters & formatters
    "ruff==0.8.3",
    # Debugger/interactive
    "debugpy>=1.8.5,<2",
    "ipykernel>=6.29.4,<7",
    # Testing tools
    "pytest>=8.2.0,<9",
    "pytest-testmon>=2.1.1,<3",
    "pytest-xdist>=3.6.1,<4",
    "pytest-dotenv>=0.5.2,<1",
    "pytest-cov>=4.1.0,<5",
    "pytest-benchmark>=5.0.0,<6",
    "assertpy",
]

# Build system
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/rfproteina",
    "src/script_utils",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "env",
    ".venv",
    "venv",
    "data",
    "dev.py",
    "ProteinMPNN/*"
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Enable a comprehensive set of rules for better code quality
extend-select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    #"D",   # pydocstyle
    "UP",  # pyupgrade -- use the latest supported python syntax
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "NPY", # fix deprecated numpy functions / types
    "RUF", # Ruff-specific rules
    "T10", # catch accidental debugger breakpoints in code
    "ANN"
]

# Ignore specific rules that might conflict with our style or are too strict
ignore = [
    "B006",  # do not use mutable data structures for argument defaults
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D100",  # Missing docstring in public module
    "NPY002",  # replacing legacy np.random.rand wih np.random.Generator
    "SIM108",  # Replace if-else blocks
    "ANN002",  # missing annotation for `*args`
    "ANN003",  # missing annotation for `**kwargs`
    "ANN204",  # missing return type annotation for special method `__init__`
    "ANN401",  # disallow `Any` type
    "F722",  # for jaxtyping shape annotation
    "F821",  # temporary to avoid jaxtyping warnings
    "E741",  # enable us to use variables like "L"
    "N806",  # enable us to use capital letters in variable names, also like "L"
    "N812",  # allow standard conventions like `import lightning as L` and `import torch.nn.functional as F`
    "N801",  # enable us to use non-CapWords class names
    "N802",  # enable us to use capital letters in function names
    "N803",  # enable us to use capital letters in argument names
]

[tool.ruff.lint.isort]
known-first-party = ["rfproteina"]
known-third-party = ["wandb"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Add per-file-ignores for specific cases
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py files
"tests/*" = ["D", "E", "RUF", "ANN"]         # Ignore docstring rules in tests

# Code relocated from the `foundry` package (and rf3's chiral metric) during the
# extraction. It was written against the monorepo's laxer ruff config, so it does not
# satisfy this project's stricter rules (chiefly ANN*, missing type annotations).
# Exempting it keeps the move a pure relocation -- annotating ~200 signatures would be a
# large, risky diff with no behaviour change. Drop these as the files get touched.
"src/rfproteina/callbacks/callback.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/datapipes/collate.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/datapipes/schema/base.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/metrics/chiral_metric.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/metrics/metric.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/nn/modules/blocks.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/utils/activation_checkpointing.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/utils/common.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/utils/datasets.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/utils/ddp.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/utils/hydra.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/utils/logging.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/utils/standard_annotations.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/utils/torch.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"src/rfproteina/utils/weights.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]
"tests/helpers/pytest_hooks.py" = ["ANN", "B", "C4", "E501", "N", "RUF", "SIM", "UP"]

[tool.pyright]
typeCheckingMode = "off"