[project]
name = "rfproteina"
version = "0.0.1"
description = "protein foundation models"
requires-python = ">=3.12,<=3.12.10"
dependencies = [
    # AtomWorks is installed from the local lib/atomworks submodule by setup.sh.
    # atomworks hard-asserts this exact version at import; posebusters/mace pull newer.
    "biotite==1.6.0",
    # Configuration & CLI (inherited from the root rc-foundry project)
    "rootutils>=1.0.7,<1.1",
    "hydra-core>=1.3.0,<1.4",
    "environs>=11.0.0,<12",
    "typer>=0.20.0,<0.26",
    "fire",
    # Logging
    "wandb>=0.15.10,<1",
    "rich>=13.9.4",
    "loguru",
    # Typing
    "jaxtyping>=0.2.17,<1",
    "beartype>=0.18.0,<1",
    # ML core
    "torch>=2.9.0,<3",
    "lightning>=2.5.0",
    "loralib>=0.1.1",
    "einops>=0.8.0,<1",
    "einx>=0.1.0,<1",
    "opt_einsum>=3.4.0,<4",
    "dm-tree>=0.1.6,<1",
    # Data / numerics
    "pandas>=2,<3",
    "zstandard",
    "toolz",
    "matplotlib",
    "networkx",
    "scikit-learn",
    # ASE for molecular datasets
    "ase>=3.22.0",
    "lmdb",  # Python LMDB bindings for ASE's LMDB backend
    # Validation metrics
    "posebusters",
    "mace-torch>=0.3.15",
    # Interactive
    "ipykernel>=6.31.0",
    "assertpy",
]

[project.optional-dependencies]
docs = [
    "linkify-it-py>=2.0.0,<3",
    "myst-parser>=4.0.0,<5",
    "nbsphinx>=0.9.0,<1",
    "pypandoc-binary>=1.15,<2",
    "pydata-sphinx-theme>=0.16.0,<1",
    "sphinx>=8.0.0,<9",
    "sphinx-autodoc-typehints>=2.0.0,<4",
    "sphinx-reredirects>=1.0,<2",
    "sphinx-togglebutton>=0.3,<1",
]
# Select one TMol/metrics pair matching the container's Torch and CUDA stack.
tmol-cuda12 = [
    "tmol[ligand]; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
tmol-cuda13 = [
    "tmol[ligand]; sys_platform == 'linux'",
]
metrics-cuda12 = [
    "hydride>=1.2",
    "graph-longrange @ git+https://github.com/WillBaldwin0/graph_electrostatics.git",
    "cuequivariance-torch>=0.10.0; sys_platform == 'linux'",
    "cuequivariance-ops-cu12>=0.10.0; sys_platform == 'linux'",
    "cuequivariance-ops-torch-cu12>=0.10.0; sys_platform == 'linux'",
]
metrics-cuda13 = [
    "hydride>=1.2",
    "graph-longrange @ git+https://github.com/WillBaldwin0/graph_electrostatics.git",
    "cuequivariance-torch>=0.10.0; sys_platform == 'linux'",
    "cuequivariance-ops-cu13>=0.10.0; sys_platform == 'linux'",
    "cuequivariance-ops-torch-cu13>=0.10.0; sys_platform == 'linux'",
]
dev = [
    # Linters & formatters
    "ruff==0.8.3",
    # Debugger/interactive
    "debugpy>=1.8.5,<2",
    "ipykernel>=6.29.4,<7",
    # Testing tools
    "pytest>=8.2.0,<9",
    "pytest-testmon>=2.1.1,<3",
    "pytest-xdist>=3.6.1,<4",
    "pytest-dotenv>=0.5.2,<1",
    "pytest-cov>=4.1.0,<5",
    "pytest-benchmark>=5.0.0,<6",
    "assertpy",
    "boto3>=1.34,<2",
]

# atomworks is vendored as a git submodule under lib/.
[tool.uv]
conflicts = [
    [
        { extra = "tmol-cuda12" },
        { extra = "tmol-cuda13" },
    ],
    [
        { extra = "metrics-cuda12" },
        { extra = "metrics-cuda13" },
    ],
]

[tool.uv.sources]
atomworks = { path = "lib/atomworks", editable = true }
# TMol's stable Torch 2.13 wheel is built with cu130. It is validated with the
# public Torch 2.13/cu132 stack used by NGC 26.06-based containers.
tmol = [
    { url = "https://github.com/uw-ipd/tmol/releases/download/v0.1.42/tmol-0.1.42+cu128torch2.10-cp312-cp312-manylinux_2_28_x86_64.whl", extra = "tmol-cuda12", marker = "platform_machine == 'x86_64'" },
    { url = "https://github.com/uw-ipd/tmol/releases/download/v0.1.42/tmol-0.1.42+cu130torch2.13-cp312-cp312-manylinux_2_28_x86_64.whl", extra = "tmol-cuda13", marker = "platform_machine == 'x86_64'" },
    { url = "https://github.com/uw-ipd/tmol/releases/download/v0.1.42/tmol-0.1.42+cu130torch2.13-cp312-cp312-manylinux_2_28_aarch64.whl", extra = "tmol-cuda13", marker = "platform_machine == 'aarch64'" },
]

# Pytest
[tool.pytest.ini_options]
# Register the markers used across the suite so `-m` filters (and any future
# `--strict-markers`) stay warning-free.
markers = [
    "digs: host-environment sanity checks that only pass on the DIGS cluster",
    "gpu: end-to-end tests that require a GPU",
    "regression: GPU regression tests gated on a SOTA checkpoint",
    "cluster: cluster launcher / srun syntax checks",
    "slow: slower tests",
    "very_slow: tests too slow for the default CPU lane",
    "benchmark: pytest-benchmark performance tests",
    "fast: fast-running tests",
]

# Build system
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/rfproteina",
    "src/script_utils",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
exclude = [
    "*.ipynb",  # notebooks are not linted or formatted
    "lib",  # separate repo, pinned as a submodule
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "env",
    ".venv",
    "venv",
    "data",
    "dev.py",
    "ProteinMPNN/*"
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Enable a comprehensive set of rules for better code quality
extend-select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    #"D",   # pydocstyle
    "UP",  # pyupgrade -- use the latest supported python syntax
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "NPY", # fix deprecated numpy functions / types
    "RUF", # Ruff-specific rules
    "T10", # catch accidental debugger breakpoints in code
    "ANN"
]

# Ignore specific rules that might conflict with our style or are too strict
ignore = [
    "B006",  # do not use mutable data structures for argument defaults
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D100",  # Missing docstring in public module
    "NPY002",  # replacing legacy np.random.rand wih np.random.Generator
    "SIM108",  # Replace if-else blocks
    "ANN002",  # missing annotation for `*args`
    "ANN003",  # missing annotation for `**kwargs`
    "ANN204",  # missing return type annotation for special method `__init__`
    "ANN401",  # disallow `Any` type
    "F722",  # for jaxtyping shape annotation
    "F821",  # temporary to avoid jaxtyping warnings
    "E741",  # enable us to use variables like "L"
    "N806",  # enable us to use capital letters in variable names, also like "L"
    "N812",  # allow standard conventions like `import lightning as L` and `import torch.nn.functional as F`
    "N801",  # enable us to use non-CapWords class names
    "N802",  # enable us to use capital letters in function names
    "N803",  # enable us to use capital letters in argument names
]

[tool.ruff.lint.isort]
known-first-party = ["rfproteina"]
known-third-party = ["wandb"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]              # re-exports and import-for-side-effect
"tests/*" = ["D", "E", "RUF", "ANN"]  # annotating test signatures buys nothing
"docs/**/*.ipynb" = ["D", "E", "RUF", "ANN"]  # tutorial helpers: annotations/style buy nothing (B stays on)

[tool.pyright]
typeCheckingMode = "off"