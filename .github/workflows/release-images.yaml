name: Release images

# Tag push `vX.Y.Z` -> Docker images for each accelerator profile on ghcr.io/rosettacommons/rfd4-proteina.
# Uses the built-in GITHUB_TOKEN (packages: write); no registry secret is stored anywhere.
#
# Tags published per release (X.Y.Z from the git tag):
#   cu13 (default profile): X.Y.Z-cu13, X.Y-cu13, X.Y.Z, X.Y, latest, cu13
#   cu12:                   X.Y.Z-cu12, X.Y-cu12, cu12
#   cpu:                    X.Y.Z-cpu,  X.Y-cpu,  cpu
# Pull with: docker pull ghcr.io/rosettacommons/rfd4-proteina:latest
#
# The Dockerfile's smoke test (imports, TMol operators, Inductor, CLI) runs at build time and needs no GPU.
# Manual runs (workflow_dispatch) build every profile but push nothing.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image (${{ matrix.accelerator }})
    if: github.repository == 'RosettaCommons/RFD4-Proteina'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        accelerator: [cu13, cu12, cpu]
    env:
      IMAGE: ghcr.io/rosettacommons/rfd4-proteina
      PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        if: env.PUSH == 'true'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-${{ matrix.accelerator }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.accelerator }}
            type=raw,value=${{ matrix.accelerator }}
            type=semver,pattern={{version}},enable=${{ matrix.accelerator == 'cu13' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.accelerator == 'cu13' }}
            type=raw,value=latest,enable=${{ matrix.accelerator == 'cu13' }}
          labels: |
            org.opencontainers.image.title=RFD4-Proteina (${{ matrix.accelerator }})
            org.opencontainers.image.description=RFD4-Proteina runtime image, ${{ matrix.accelerator }} profile
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: RFD4_ACCELERATOR=${{ matrix.accelerator }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.accelerator }}
          cache-to: type=gha,scope=${{ matrix.accelerator }},mode=max
