name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yaml'
  push:
    branches: [main]
  public:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install CPU and documentation dependencies
        env:
          PIP_NO_CACHE_DIR: '1'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install '.[docs]'
      - name: Build documentation
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event.repository.private == false
        with:
          path: docs/_build/html

  deploy:
    name: Publish docs
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
