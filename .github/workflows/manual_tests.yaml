name: Manual CoreWeave tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [cpu, gpu]
        default: cpu

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ fromJSON(inputs.suite == 'gpu' && (vars.CI_GPU_RUNNER_LABELS || '["self-hosted","coreweave-gpu"]') || (vars.CI_CPU_RUNNER_LABELS || '["self-hosted","coreweave-cpu"]')) }}
    timeout-minutes: 90
    env:
      CI_SUITE: ${{ inputs.suite }}
      CI_SRUN_ARGS: ${{ inputs.suite == 'gpu' && vars.CI_GPU_SRUN_ARGS || vars.CI_CPU_SRUN_ARGS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Validate scheduler configuration
        run: |
          test -n "$CI_SRUN_ARGS" || { echo "Set the repository's CI_CPU_SRUN_ARGS and CI_GPU_SRUN_ARGS JSON arrays."; exit 1; }
          echo "::add-mask::$GITHUB_WORKSPACE"
      - name: Install public dependencies
        run: bash setup.sh
      - name: Run selected tests
        run: .venv/bin/python scripts/run_public_ci.py "$CI_SUITE"
