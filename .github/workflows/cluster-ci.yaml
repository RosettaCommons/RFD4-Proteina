name: Cluster CI

# Maintainers only. Runs the CPU and GPU test lanes on the self-hosted CoreWeave and DIGS runners.
# Triggers are `workflow_dispatch` and pushes to `main`; pull_request events never run here. To test an open
# pull request into `main`, a maintainer starts this workflow from `main` and gives the PR number and the head
# commit SHA they reviewed. The workflow definition always comes from `main`; only the code under test comes
# from the PR, pinned to that exact commit. Every cluster job waits for the `authorize` job, which
# accepts only listed maintainers and only runs from `main`. Cluster credentials live in the
# runner-local profile, not in GitHub secrets. Runner setup: .github/ci/RUNNERS.md.

on:
  workflow_dispatch:
    inputs:
      clusters:
        description: Which clusters to run
        type: choice
        options: [both, coreweave, digs]
        default: both
      pr:
        description: "Pull request number (into main) to test instead of main. Leave empty to test main."
        type: string
        default: ""
      reviewed_sha:
        description: "Required with pr: the full head commit SHA you reviewed. The run refuses if the PR head has moved."
        type: string
        default: ""
  push:
    branches: [main]

concurrency:
  group: cluster-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authorize:
    name: authorize (maintainers only)
    if: github.repository == 'RosettaCommons/RFD4-Proteina'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Only listed maintainers may use the cluster runners
        env:
          ACTOR: ${{ github.triggering_actor }}
          # Comma-separated GitHub logins in the repository variable CLUSTER_CI_MAINTAINERS.
          ALLOWED: ${{ vars.CLUSTER_CI_MAINTAINERS }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Cluster CI only runs from main (got $GITHUB_REF)."
            exit 1
          fi
          if [ -z "${ALLOWED//[ ,]/}" ]; then
            echo "::error::Repository variable CLUSTER_CI_MAINTAINERS is empty, so nobody is authorized."
            exit 1
          fi
          allowed=",$(printf '%s' "$ALLOWED" | tr -d ' ' | tr '[:upper:]' '[:lower:]'),"
          actor="$(printf '%s' "$ACTOR" | tr '[:upper:]' '[:lower:]')"
          case "$allowed" in
            *",$actor,"*) echo "$ACTOR is an authorized maintainer." ;;
            *) echo "::error::$ACTOR is not listed in CLUSTER_CI_MAINTAINERS; cluster CI refused."; exit 1 ;;
          esac

      - name: Resolve the commit to test
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          if [ -z "${PR:-}" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Testing main at $GITHUB_SHA"
            exit 0
          fi
          case "$PR" in *[!0-9]*) echo "::error::pr must be a pull request number."; exit 1 ;; esac
          read -r state base head < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.state, .base.ref, .head.sha] | @tsv')
          [ "$state" = open ] || { echo "::error::PR #$PR is not open."; exit 1; }
          [ "$base" = main ] || { echo "::error::PR #$PR targets '$base', not main."; exit 1; }
          if [ -z "${REVIEWED_SHA:-}" ] || [ "$REVIEWED_SHA" != "$head" ]; then
            echo "::error::reviewed_sha must equal the PR head $head. Review that commit, then pass its full SHA."
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo "Testing PR #$PR at the reviewed commit $head"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' | head -200

  coreweave-cpu:
    name: pytest (cpu, coreweave)
    needs: authorize
    if: github.event_name != 'workflow_dispatch' || inputs.clusters != 'digs'
    runs-on: [self-hosted, coreweave-cpu]
    timeout-minutes: 30
    env:
      CI_CLUSTER: coreweave
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - name: Run tests (srun + apptainer)
        env:
          TEST_PATH: ./tests
          XDIST_WORKERS: auto
        run: |
          export N_CPU=8
          srun --chdir=$PWD -p interactive -c $N_CPU -t 00:25:00 --mem=32G \
            bash ./.github/ci/run_cpu_lane.sh
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.cpu.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.cpu.xml
          flags: cluster-cpu
          fail_ci_if_error: false

  coreweave-gpu:
    name: pytest (gpu, coreweave)
    needs: authorize
    if: github.event_name != 'workflow_dispatch' || inputs.clusters != 'digs'
    runs-on: [self-hosted, coreweave-gpu]
    timeout-minutes: 60
    env:
      CI_CLUSTER: coreweave
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - name: GPU tests (srun interactive + apptainer)
        env:
          SOTA_CKPT_PATH: ${{ vars.SOTA_CKPT_PATH || '' }}  # unset -> skip MCSA validation + search
          # Written by run_gpu_lane.sh once the allocation starts: present => real test failure, no retry.
          GPU_ALLOC_SENTINEL: ${{ github.workspace }}/.gpu_alloc_started
        run: |
          # Retries only cover allocation failures (GPU contention), not test failures.
          attempts=3
          for i in $(seq 1 "$attempts"); do
            rm -f "$GPU_ALLOC_SENTINEL"
            echo "::group::GPU srun attempt $i/$attempts"
            set +e
            srun --chdir=$PWD --gres=gpu:6 -p interactive --export=ALL --kill-on-bad-exit \
              -J "ci-gpu-${GITHUB_RUN_ID}" \
              -t 00:45:00 --cpus-per-task=96 --mem=768G \
              bash ./.github/ci/run_gpu_lane.sh 2>&1 | tee "/tmp/gpu_srun.${GITHUB_RUN_ID}.$i"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            [ "$rc" -eq 0 ] && exit 0
            if [ -f "$GPU_ALLOC_SENTINEL" ]; then
              echo "Tests ran on the allocated node -> real failure (rc=$rc); not retrying."
              exit "$rc"
            fi
            echo "Allocation failed before tests started; retrying after backoff."
            sleep 30
          done
          echo "GPU allocation kept failing before tests started after $attempts attempts."
          exit 1
      - name: Upload GPU coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.gpu.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.gpu.xml
          flags: gpu
          fail_ci_if_error: false
      - name: Reap leaked srun allocation
        if: always()
        run: scancel --me --name="ci-gpu-${GITHUB_RUN_ID}" 2>/dev/null || true
      - name: Publish GPU test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: testing.gpu.junit.xml

  digs-cpu:
    name: pytest (cpu, digs)
    needs: authorize
    if: github.event_name != 'workflow_dispatch' || inputs.clusters != 'coreweave'
    # Repo-level self-hosted runner on a DIGS login node; it only submits srun to the cpu partition.
    runs-on: [self-hosted, digs]
    timeout-minutes: 60
    env:
      CI_CLUSTER: digs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - name: Run tests (srun + apptainer)
        env:
          TEST_PATH: ./tests
          XDIST_WORKERS: auto
        run: |
          export N_CPU=8
          srun --chdir=$PWD -p cpu -c $N_CPU -t 00:50:00 --mem=32G \
            -J "ci-digs-${GITHUB_RUN_ID}" \
            bash ./.github/ci/run_cpu_lane.sh
