name: Container build

# Builds the Docker image for each accelerator profile. The Dockerfile's own smoke test (imports, TMol operators,
# Inductor, CLI) runs at build time and needs no GPU.
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, "deploy/api/**", .github/workflows/container-build.yml]
  workflow_dispatch:
  push:
    branches: [ci/container-build-test]

permissions:
  contents: read

jobs:
  docker:
    name: docker (${{ matrix.accelerator }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        accelerator: [cu13, cu12, cpu]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: RFD4_ACCELERATOR=${{ matrix.accelerator }}
          load: true
          tags: rfd4-proteina:${{ matrix.accelerator }}
      - name: Build API target
        if: matrix.accelerator != 'cpu'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          build-args: RFD4_ACCELERATOR=${{ matrix.accelerator }}
          load: true
          tags: rfd4-proteina:${{ matrix.accelerator }}-api
      - name: Image size
        run: docker images rfd4-proteina:${{ matrix.accelerator }}
