name: Public documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'src/**'
      - 'configs/**'
      - 'pyproject.toml'
      - '.github/workflows/public-docs.yaml'
  push:
    branches: [main]
  public:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'RosettaCommons/RFD4-Proteina'
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check preprint revision history
        run: |
          python website/scripts/update_preprint.py check
          python -m unittest discover -s website/scripts -p 'test_preprint_versions.py'
      - name: Install CPU and documentation dependencies
        env:
          PIP_NO_CACHE_DIR: '1'
        run: |
          python -m pip install uv
          # Sphinx mocks TMol; documentation does not need its native extension.
          python - <<'PYREQ' > "$RUNNER_TEMP/docs-requirements.txt"
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          requirements = project["dependencies"] + project["optional-dependencies"]["docs"]
          print("\n".join(value for value in requirements if not value.startswith("tmol")))
          PYREQ
          uv pip install --system --torch-backend cpu -r "$RUNNER_TEMP/docs-requirements.txt"
          uv pip install --system --no-deps .
      - name: Build documentation
        env:
          RFD4_SITE_ROOT: '../'
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Assemble the site (project page at the root, documentation under latest/)
        run: |
          mkdir -p site
          rsync -a website/ site/
          rsync -a docs/_build/html/ site/latest/
          touch site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event.repository.private == false
        with:
          path: site

  deploy:
    name: Publish docs
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
