# Cleaned PPI benchmark: one structure per target.
# Excluded relative to the earlier all-PPI set:
# - all but one entry for any given target
# - rfd3_il2ra, which has a huge chainbreak so doesn't fold well with AF3
#   unless various bcov inference hacks are used.

global_args:
  dialect: 2

rfd3_insulinr:
  input: rfd3_ppi_paper_benchmark/4zxb_cropped.cif
  contig: 40-120,/0,E6-155
  select_fixed_atoms: True
  select_hotspots:
    E64: CD2,CZ
    E88: CG,CZ
    E96: CD1,CZ

