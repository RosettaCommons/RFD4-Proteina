<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
<title id="t">How a design is specified, with rewards and metrics</title>
<desc id="d">Flow diagram. A YAML file, marked preferred, or JSON feeds the Python API, as do an Agent Skill and the AtomWorks Studio web GUI. The Python API writes an annotated CIF that goes into RFD4 together with Rewards (Metrics). RFD4 outputs an annotated CIF and a Metrics CSV.</desc>
<style>
    text{font-family:'Open Sans','Helvetica Neue',Helvetica,Arial,sans-serif;text-anchor:middle;fill:#f0f0f0}
    .s{fill:#c4c4c4}
    .bt{fill:#10200f;font-weight:700}
    .box{stroke:#b8b8b8;stroke-width:2;rx:6}
    .hero{stroke:#7bc47f;stroke-width:5}
    .green{fill:#2f4a2c} .purple{fill:#443a5c} .red{fill:#5c3434} .blue{fill:#2c415f}
    .badge{fill:#7bc47f}
    .arr{stroke:#e6e6e6;stroke-width:2.5}
    .axis{stroke:#e6e6e6;stroke-width:3}
    .cap{font-weight:700}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/></marker></defs>
<rect x="30" y="170" width="210" height="120" class="box green hero"/>
<text x="135.0" y="226.6" class="t" font-size="30" font-weight="700">YAML</text>
<text x="135.0" y="264.6" class="s" font-size="17">(or JSON)</text>
<rect x="124.2" y="156" width="105.8" height="28" rx="14" class="badge"/>
<text x="177.1" y="175" class="bt" font-size="16">preferred</text>
<rect x="320" y="170" width="190" height="120" class="box green"/>
<text x="415.0" y="236.3" class="t" font-size="26">Python API</text>
<rect x="320" y="20" width="190" height="90" class="box green"/>
<text x="415.0" y="56.3" class="t" font-size="26">Agent Skill</text>
<text x="415.0" y="86.3" class="t" font-size="26">(Claude)</text>
<rect x="300" y="350" width="230" height="100" class="box green"/>
<text x="415.0" y="391.3" class="t" font-size="26">GUI: AtomWorks</text>
<text x="415.0" y="421.3" class="t" font-size="26">Studio (web)</text>
<line x1="240" y1="230" x2="318" y2="230" class="arr" marker-end="url(#ah)"/>
<line x1="415" y1="112" x2="415" y2="168" class="arr" marker-end="url(#ah)"/>
<line x1="415" y1="348" x2="415" y2="292" class="arr" marker-end="url(#ah)"/>
<rect x="590" y="170" width="170" height="120" class="box purple"/>
<text x="675.0" y="221.3" class="t" font-size="26">Annotated</text>
<text x="675.0" y="251.3" class="t" font-size="26">CIF</text>
<line x1="510" y1="230" x2="588" y2="230" class="arr" marker-end="url(#ah)"/>
<rect x="830" y="170" width="140" height="120" class="box red"/>
<text x="900.0" y="236.3" class="t" font-size="26">RFD4</text>
<rect x="805" y="20" width="190" height="90" class="box blue"/>
<text x="900.0" y="56.3" class="t" font-size="26">Rewards</text>
<text x="900.0" y="86.3" class="t" font-size="26">(Metrics)</text>
<line x1="900" y1="112" x2="900" y2="168" class="arr" marker-end="url(#ah)"/>
<line x1="760" y1="230" x2="828" y2="230" class="arr" marker-end="url(#ah)"/>
<rect x="1020" y="40" width="160" height="110" class="box purple"/>
<text x="1100.0" y="86.3" class="t" font-size="26">Annotated</text>
<text x="1100.0" y="116.3" class="t" font-size="26">CIF</text>
<rect x="1020" y="310" width="160" height="110" class="box blue"/>
<text x="1100.0" y="356.3" class="t" font-size="26">Metrics</text>
<text x="1100.0" y="386.3" class="t" font-size="26">CSV</text>
<line x1="970" y1="205" x2="1018" y2="120" class="arr" marker-end="url(#ah)"/>
<line x1="970" y1="255" x2="1018" y2="340" class="arr" marker-end="url(#ah)"/>
</svg>
