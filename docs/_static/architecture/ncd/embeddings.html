pe slot f\\u209b: token type, conditioned residue type, conditioned absolute and internal atom37 coordinates with their masks, RASA, secondary structure, hydrogen-bond, pi-stacking and pi-cation annotations, nucleic-acid state, hotspots, no-cysteine flags, atom charge and element, coordinate groups, chirality and chain centroids. The 37 coordinate-group channels are relabelled at random on every network evaluation, so only the grouping, not the ids, stays fixed. Token type, secondary structure, atom charge and element enter through learned embedding tables of the denoiser (5 \\u00d7 32, 4 \\u00d7 16, 11 \\u00d7 16 and 128 \\u00d7 16, trained with the flow model), which the figure folds into f\\u209b. There is no positional or residue-index embedding: chain order reaches the model through the bond-path and polymer-ordering pair features.\", \"fill_color\": \"#F7DDEC\", \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"Open diagram: embeddings\", \"url\": \"embeddings.html\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"local_latents_transformer.py L59-L66\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/local_latents_transformer.py#L59-L66\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"local_latents_transformer.py L215-L217\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/local_latents_transformer.py#L215-L217\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"feature_factory.py L1317-L1343\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L1317-L1343\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"2026_09_15_release.yaml L107-L127\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/mai x exponential taken apart into its cosine and sine. The code lays the 256 channels out as all sines then all cosines, which differs by a fixed permutation that the next linear map absorbs. Each of the two modalities, CA coordinates and latents, has its own time.\", \"fill_color\": \"#FBF3D5\", \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"feature_factory.py L65-L94\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L65-L94\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"feature_factory.py L263-L271\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L263-L271\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"\\\\mathrm{temb}(t) = \\\\big[\\\\sin(2000\\\\,t\\\\,\\\\omega_{k})\\\\big]_{k} \\\\,\\\\Vert\\\\, \\\\big[\\\\cos(2000\\\\,t\\\\,\\\\omega_{k})\\\\big]_{k},\\\\quad \\\\omega_{k} = 2000^{-k/127},\\\\ k = 0, \\\\dots, 127\", \"drawing\": null}}, \"401093170\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 401093170, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\sigma\", \"description\": \"The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.\", \"fill_color\": null, \"references\": null, \"formula\": \"y = \\\\sigma(x)\", \"drawing\": {\"__registered__\": \"enum\", \"type\": \"BlockDrawing\", \"name\": \"BODY_IN_PLACE\"}}}, \"1726810185\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 1726810185, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{Pair AdaLN}\", \"description\": \"The same adaptive normalisation applied to the initial pair representation. Its conditioning is one 256-wide vector per design, built from the two time embeddings, so the gain and the shift are shared by every pair (i, j).\", \"fill_color\": \"#F3EFC6\", \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"pair_rep_initial.py L38-L47\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_rep_initial.py#L38-L47\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"adaptive_ln_scale.py L33-L37\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/adaptive_ln_scale.py#L33-L37\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"z^{0}_{ij} = \\\\mathrm{RMS}(\\\\tilde z_{ij}) \\\\odot \\\\sigma\\\\big(W^{\\\\gamma}_{z}\\\\,\\\\mathrm{RMS}(c_z) + b^{\\\\gamma}_{z}\\\\big) + W^{\\\\beta}_{z}\\\\,\\\\mathrm{RMS}(c_z)\", \"drawing\": null}}, \"1480017629\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 1480017629, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{Pair embedding}\", \"description\": \"The initial pair representation. The distance between the noisy CA positions of tokens i and j is one-hot encoded into 30 bins between 0.1 and 3 nm, and joined by 77 channels of pair design features read from the tape: bond mask, bond order and aromaticity of the inter-token bonds within an index group outside the polymer backbone (ligand bonds, disulfides and other crosslinks), same index group, same molecule and same entity flags, 64 bins of bond-path length in the token bond graph, the direction of canonical polymer bonds and nucleic-acid base pairi ir_dist_dim", "sizeCodeName": "xt_pair_dist_dim_size", "uids": [1546016084]}, {"latex": "u", "text": "u", "size": 256, "codeName": "dim_cond", "sizeCodeName": "dim_cond_size", "uids": [1506389047]}, {"latex": "V", "text": "V", "size": 77, "codeName": "static_pair_feats", "sizeCodeName": "static_pair_feats_size", "uids": [566359330]}, {"latex": "w", "text": "w", "size": 128, "codeName": "half_dim", "sizeCodeName": "half_dim_size", "uids": [570655618]}, {"latex": "x", "text": "x", "size": null, "codeName": "tokens", "sizeCodeName": "tokens_size", "uids": [1759696249]}, {"latex": "y", "text": "y", "size": 3, "codeName": "xyz", "sizeCodeName": "xyz_size", "uids": [1157109772]}], "blocks": {"1469836596": {"title": "\\text{Single and pair embeddings}", "formula": null, "description": "The two feature factories that start every network evaluation. The single embedding turns the noisy state and the token design features into the initial single representation s\u2080; the pair embedding turns the noisy CA distances, the pair design features and the two times into the initial pair representation z\u2080. The denoiser drops both onto the tape, from which every recycling cycle reads them.", "references": [{"label": "local_latents_transformer.py L59-L66", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/local_latents_transformer.py#L59-L66", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "local_latents_transformer.py L215-L217", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/local_latents_transformer.py#L215-L217", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L1317-L1343", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L1317-L1343", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "2026_09_15_release.yaml L107-L127", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/configs/releases/flow/2026_09_15_release.yaml#L107-L127", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "pair_rep_initial.py L7-L47", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_rep_initial.py#L7-L47", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L97-L136", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L97-L136", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L1018-L1036", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L1018-L1036", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "2026_09_15_release.yaml L129-L140", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/configs/releases/flow/2026_09_15_release.yaml#L129-L140", "path": null, "line": null, "endLine": null, "icon": null}]}, "315678353": {"title": "\\text{Single embedding}", "formula": "s_{0} = W^{s}_{\\mathrm{CA}}\\,x^{\\mathrm{CA}}_{t} + W^{s}_{\\mathrm{lat}}\\,x^{\\mathrm{lat}}_{t} + W^{s}_{f}\\,f_{s}", "description": "The initial single representation. The code concatenates 19 token features, 748 channels, and applies one linear map without bias to 768. The figure splits that map by where its inputs come from: the noisy CA coordinates (3 channels, in nm), the noisy latents (16), and the 729 channels of design features, which do not depend on the noisy state, read from the tape slot f\u209b: token type, conditioned residue type, conditioned absolute and internal atom37 coordinates with their masks, RASA, secondary structure, hydrogen-bond, pi-stacking and pi-cation annotations, nucleic-acid state, hotspots, no-cysteine flags, atom charge and element, coordinate groups, chirality and chain centroids. The 37 coordinate-group channels are relabelled at random on every network evaluation, so only the grouping, not the ids, stays fixed. Token type, secondary structure, atom charge and element enter through learned embedding tables of the denoiser (5 \u00d7 32, 4 \u00d7 16, 11 \u00d7 16 and 128 \u00d7 16, trained with the flow model), which the figure folds into f\u209b. There is no positional or residue-index embedding: chain order reaches the model through the bond-path and polymer-ordering pair features.", "references": [{"label": "Open diagram: embeddings", "url": "embeddings.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "local_latents_transformer.py L59-L66", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/local_latents_transformer.py#L59-L66", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "local_latents_transformer.py L215-L217", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/local_latents_transformer.py#L215-L217", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L1317-L1343", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L1317-L1343", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "2026_09_15_release.yaml L107-L127", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/configs/releases/flow/2026_09_15_release.yaml#L107-L127", "path": null, "line": null, "endLine": null, "icon": null}]}, "1480017629": {"title": "\\text{Pair embedding}", "formula": "z_{0} = \\mathrm{AdaLN}\\Big(\\mathrm{RMS}\\big(W^{z}_{d}\\,\\mathrm{bin}\\lVert x^{\\mathrm{CA}}_{t,i} - x^{\\mathrm{CA}}_{t,j}\\rVert + W^{z}_{f}\\,f_{z,ij}\\big),\\ c_{z}\\Big)", "description": "The initial pair representation. The distance between the noisy CA positions of tokens i and j is one-hot encoded into 30 bins between 0.1 and 3 nm, and joined by 77 channels of pair design features read from the tape: bond mask, bond order and aromaticity of the inter-token bonds within an index group outside the polymer backbone (ligand bonds, disulfides and other crosslinks), same index group, same molecule and same entity flags, 64 bins of bond-path length in the token bond graph, the direction of canonical polymer bonds and nucleic-acid base pairing. One linear map takes the 107 channels to 384, followed by an RMSNorm, and an AdaLN conditions the result on one vector per design, built from the two time embeddings.", "references": [{"label": "Open diagram: embeddings", "url": "embeddings.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "pair_rep_initial.py L7-L47", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_rep_initial.py#L7-L47", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L97-L136", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L97-L136", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L1018-L1036", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L1018-L1036", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "2026_09_15_release.yaml L129-L140", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/configs/releases/flow/2026_09_15_release.yaml#L129-L140", "path": null, "line": null, "endLine": null, "icon": null}]}, "236611980": {"title": "\\text{Binned CA distances}", "formula": "\\mathrm{bin}_{ij} = \\mathrm{onehot}\\big(\\mathrm{bucketize}(\\lVert x^{\\mathrm{CA}}_{t,i} - x^{\\mathrm{CA}}_{t,j}\\rVert,\\ \\mathrm{linspace}(0.1, 3, 29))\\big) \\in \\{0, 1\\}^{30}", "description": "The distance between the noisy CA positions of every pair of tokens, in nm, one-hot encoded into 30 bins: one below 0.1 nm, 28 of width 0.104 nm, and one above 3 nm. This is the only pair feature that changes during sampling.", "references": [{"label": "feature_factory.py L97-L136", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L97-L136", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L1018-L1036", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L1018-L1036", "path": null, "line": null, "endLine": null, "icon": null}]}, "828951752": {"title": "\\text{Time embedding}", "formula": "\\mathrm{temb}(t) = \\big[\\sin(2000\\,t\\,\\omega_{k})\\big]_{k} \\,\\Vert\\, \\big[\\cos(2000\\,t\\,\\omega_{k})\\big]_{k},\\quad \\omega_{k} = 2000^{-k/127},\\ k = 0, \\dots, 127", "description": "The sinusoidal embedding of a flow time t in [0, 1] used by Frameflow and DDPM. The time is scaled by 2000 and multiplied by 128 geometrically spaced frequencies, and each product is written as its sine and cosine, 256 channels in all. The figure writes each pair as one complex exponential taken apart into its cosine and sine. The code lays the 256 channels out as all sines then all cosines, which differs by a fixed permutation that the next linear map absorbs. Each of the two modalities, CA coordinates and latents, has its own time.", "references": [{"label": "feature_factory.py L65-L94", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L65-L94", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L263-L271", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L263-L271", "path": null, "line": null, "endLine": null, "icon": null}]}, "623592697": {"title": "2000\\,t", "formula": "y = 2000 x", "description": "The flow time is scaled by max_positions = 2000 before the sinusoids. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "268053166": {"title": "\\omega", "formula": "\\omega_{k} = 2000^{-k/127},\\quad k = 0, \\dots, 127", "description": "The 128 geometrically spaced frequencies of the time embedding, from 1 down to 1/2000.", "references": []}, "775296816": {"title": "\\text{Time embedding}", "formula": "\\mathrm{temb}(t) = \\big[\\sin(2000\\,t\\,\\omega_{k})\\big]_{k} \\,\\Vert\\, \\big[\\cos(2000\\,t\\,\\omega_{k})\\big]_{k},\\quad \\omega_{k} = 2000^{-k/127},\\ k = 0, \\dots, 127", "description": "The sinusoidal embedding of a flow time t in [0, 1] used by Frameflow and DDPM. The time is scaled by 2000 and multiplied by 128 geometrically spaced frequencies, and each product is written as its sine and cosine, 256 channels in all. The figure writes each pair as one complex exponential taken apart into its cosine and sine. The code lays the 256 channels out as all sines then all cosines, which differs by a fixed permutation that the next linear map absorbs. Each of the two modalities, CA coordinates and latents, has its own time.", "references": [{"label": "feature_factory.py L65-L94", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L65-L94", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L263-L271", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L263-L271", "path": null, "line": null, "endLine": null, "icon": null}]}, "1024043183": {"title": "2000\\,t", "formula": "y = 2000 x", "description": "The flow time is scaled by max_positions = 2000 before the sinusoids. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "1468381944": {"title": "\\omega", "formula": "\\omega_{k} = 2000^{-k/127},\\quad k = 0, \\dots, 127", "description": "The 128 geometrically spaced frequencies of the time embedding, from 1 down to 1/2000.", "references": []}, "1726810185": {"title": "\\text{Pair AdaLN}", "formula": "z^{0}_{ij} = \\mathrm{RMS}(\\tilde z_{ij}) \\odot \\sigma\\big(W^{\\gamma}_{z}\\,\\mathrm{RMS}(c_z) + b^{\\gamma}_{z}\\big) + W^{\\beta}_{z}\\,\\mathrm{RMS}(c_z)", "description": "The same adaptive normalisation applied to the initial pair representation. Its conditioning is one 256-wide vector per design, built from the two time embeddings, so the gain and the shift are shared by every pair (i, j).", "references": [{"label": "pair_rep_initial.py L38-L47", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_rep_initial.py#L38-L47", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "adaptive_ln_scale.py L33-L37", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/adaptive_ln_scale.py#L33-L37", "path": null, "line": null, "endLine": null, "icon": null}]}, "401093170": {"title": "\\sigma", "formula": "y = \\sigma(x)", "description": "The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}}, "expansions": {"0": {"operator": "Linear", "latex": "\\bold{W^{s}}_{\\mathrm{CA}}", "formula": "y[i_{m}] = \\sum_{i_{y} \\in y} x[i_{y}]\\, W_\\bold{W^{s}}{\\mathrm{CA}}[i_{y}, i_{m}]", "description": "A learned linear map. The weight holds one value for every pair of an input position and an output position, and the map contracts the input against the weight over the input positions. The arrays are read from the tape, and they are shared by every position of the axes the map is broadcast over.", "expansion": "{\"uid_repository\": {\"1613764473\": {\"__type__\": \"FreeNumeric\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"FreeNumeric\"}, \"_id\": 1613764473, \"_name\": {\"__type__\": \"DynamicName\", \"body\": \"y\", \"subscript\": null, \"settings\": {\"__type__\": \"DynamicNameSettings\", \"bold\": false, \"overline\": false, \"absolute\
