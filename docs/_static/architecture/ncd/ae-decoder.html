41\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"\\\\ell = W^{a}\\\\,\\\\mathrm{LN}_{a}(s),\\\\quad \\\\Delta X = \\\\mathrm{zero}_{\\\\mathrm{CA}}\\\\big(W^{n}\\\\,\\\\mathrm{LN}_{n}(s)\\\\big),\\\\quad o = W^{o}\\\\,\\\\mathrm{LN}_{o}(s)\", \"drawing\": null}}, \"1212944497\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 1212944497, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{Token-type mask}\", \"description\": \"Restricts each token's logits to its token type: protein tokens to the 21 amino-acid classes, RNA and DNA tokens to their five nucleotide classes, noncanonical-amino-acid and modified-residue tokens to their 100 classes and glycan tokens to their 13; a token of unknown type allows every class. Tokens the decoder does not emit, such as atomized ligand atoms and in-context conditioning, allow every class, and their outputs are zeroed.\", \"fill_color\": null, \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"decoder.py L205-L220\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/decoder.py#L205-L220\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"\\\\ell_{ia} = -\\\\infty \\\\ \\\\text{ unless class } a \\\\text{ is allowed for token type } \\\\tau_{i}\", \"drawing\": {\"__registered__\": \"enum\", \"type\": \"BlockDrawing\", \"name\": \"BODY_IN_PLACE\"}}}, \"1625004308\": {\"__type__\": \"FreeNumeric\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"FreeNumeric\"}, \"_id\": 1625004308, \"_name\": {\"__type__\": \"DynamicName\", \"body\": \"\\\\mathbb{B}\", \"subscript\": null, \"settings\": null, \"code_form\": null, \"exponent\": null}}}, \"1818813087\": {\"__type__\": \"BlockTag\", \"uid\": {\"__typ gend", "axisLabelFontSize": 0.8, "title": "Decoder", "heading": "none", "displayMode": "fast"}, "auxiliary": {"legend": [{"latex": "a", "text": "a", "size": 147, "codeName": "n_residue_types", "sizeCodeName": "n_residue_types_size", "uids": [741244747]}, {"latex": "d", "text": "d", "size": 64, "codeName": "dim_head", "sizeCodeName": "dim_head_size", "uids": [1687924407]}, {"latex": "f", "text": "f", "size": 3072, "codeName": "dim_inner", "sizeCodeName": "dim_inner_size", "uids": [1750216352]}, {"latex": "h", "text": "h", "size": 12, "codeName": "nheads", "sizeCodeName": "nheads_size", "uids": [1199828169]}, {"latex": "l", "text": "l", "size": 32, "codeName": "latent_dim", "sizeCodeName": "latent_dim_size", "uids": [951255947]}, {"latex": "m", "text": "m", "size": 768, "codeName": "token_dim", "sizeCodeName": "token_dim_size", "uids": [1418916817]}, {"latex": "n", "text": "n", "size": 37, "codeName": "atom37", "sizeCodeName": "atom37_size", "uids": [715304987]}, {"latex": "x", "text": "x", "size": null, "codeName": "tokens", "sizeCodeName": "tokens_size", "uids": [1759696249]}, {"latex": "y", "text": "y", "size": 3, "codeName": "xyz", "sizeCodeName": "xyz_size", "uids": [1157109772]}], "blocks": {"368986751": {"title": "\\text{Decoder}", "formula": "\\begin{gathered}(\\ell, X, o) = \\big(\\mathrm{mask}_{\\tau}(W^{a}\\,\\mathrm{LN}_{a}(s)),\\ \\mathrm{zero}_{\\mathrm{CA}}(W^{n}\\,\\mathrm{LN}_{n}(s)) + x^{\\mathrm{CA}},\\ W^{o}\\,\\mathrm{LN}_{o}(s)\\big),\\quad (\\hat a, M) = \\mathrm{resolve}(\\ell, \\mathrm{seq}, o),\\\\ s = \\mathrm{Trunk}\\big(W^{d}_{\\mathrm{CA}}x^{\\mathrm{CA}} + W^{d}_{\\mathrm{lat}}x^{\\mathrm{lat}} + E_{\\tau}[\\tau] + E_{\\mathrm{seq}}[\\mathrm{seq}]\\big),\\quad E_{\\mathrm{seq}}[\\mathrm{mask}] = 0\\end{gathered}", "description": "The decoder turns CA positions and latents into a sequence and full-atom coordinates. It reads the CA position (3), the 32 latents, the token type embedded in 32 channels and the conditioned residue type as a fixed 147-way one-hot (all zeros on tokens without sequence conditioning), 214 channels in all, projected to 768 (drawn as one linear map or table per input). In a generation, tokens without a user sequence condition take the class the flow model's sequence readout predicted instead. Twelve layers later three heads, each behind its own LayerNorm, read the trunk output: 147 residue-class logits, with the classes a token type cannot take (a protein token cannot be a nucleotide) set to the lowest value; 111 = 37 \u00d7 3 atom coordinates relative to the CA, whose CA slot is zeroed before the CA position is added to all 37, so the decoded CA is exactly the input CA; and 37 atom-presence logits. The decoded residue is the conditioned class where one is given and the most likely allowed class elsewhere, and its atom mask retains legal slots whose presence logit is positive, the CA slot, and any legal atoms required by coordinate conditioning. Tokens the decoder does not emit receive no decoded atoms. 128,160,329 stored parameters.", "references": [{"label": "Open diagram: the decoder", "url": "ae-decoder.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "decoder.py L160-L251", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/decoder.py#L160-L251", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "autoencoder.py L140-L171", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/autoencoder.py#L140-L171", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "proteina.py L2041-L2085", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/proteina.py#L2041-L2085", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "nn_130m_unified.yaml L53-L88", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/configs/nn_ae/nn_130m_unified.yaml#L53-L88", "path": null, "line": null, "endLine": null, "icon": null}]}, "2090836203": {"title": "\\text{Autoencoder trunk}", "formula": null, "description": "Twelve autoencoder layers, each with its own weights, of width 768 with 12 heads. There is no pair track: the release builds both halves with attention pair bias, pair updates and triangle multiplication turned off, so no pair features are computed.", "references": [{"label": "encoder.py L136-L141", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/encoder.py#L136-L141", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "decoder.py L198-L203", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/decoder.py#L198-L203", "path": null, "line": null, "endLine": null, "icon": null}]}, "1986763326": {"title": "\\text{Autoencoder layer}", "formula": null, "description": "One layer of the autoencoder: gated multi-head attention without a pair bias, then a SwiGLU transition of hidden width 3072, each behind a LayerNorm and followed by a per-channel gate, with residual connections. It is the module of a flow-model trunk layer built with LayerNorms instead of RMSNorms and without a pair bias. Its conditioning is identically zero and LayerNorm(0) returns the bias c\u2080 of the conditioning norm, so AdaLN becomes LN(s) \u2299 \u03c3(W\u1d5e c\u2080 + b\u1d5e) + W\u1d5d c\u2080, a LayerNorm with a constant gain and shift, and the output gate becomes a constant g\u1d4d\u1d43\u1d57\u1d49 = \u03c3(b\u1d4d\u1d43\u1d57\u1d49) per channel.", "references": [{"label": "Open diagram: an autoencoder layer", "url": "ae-layer.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "encoder.py L69-L85", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/encoder.py#L69-L85", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "attn_n_transition.py L96-L113", "ur
