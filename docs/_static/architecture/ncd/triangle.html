ta z_{ij} = \\sigma(W^{g}\\bar z_{ij} + b^{g}) \\odot \\Big(W^{z}\\,\\mathrm{LN}\\Big(\\sum_{k} a_{ik} \\odot b_{jk}\\Big) + b^{z}\\Big),\\quad a = (W^{a}_{p}\\bar z + b^{a}_{p}) \\odot \\sigma(W^{a}_{g}\\bar z + b^{a}_{g})", "description": "The outgoing triangle multiplicative update of AlphaFold 2 (Algorithm 11). The pair representation is LayerNormed to z\u0304 and projected twice to 256 channels, each projection multiplied elementwise by a sigmoid gate of its own. Pair (i, j) then sums, over every token k, the product of edge i\u2013k from the first projection and edge j\u2013k from the second, so information flows around the triangle i, j, k. The sum is LayerNormed, projected back to 384 channels and gated by a sigmoid of z\u0304. The sum over k is not divided by the number of tokens.", "references": [{"label": "Open diagram: triangle multiplication", "url": "triangle.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "triangular_multiplicative_update.py L61-L87", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/openfold_modules/triangular_multiplicative_update.py#L61-L87", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "triangular_multiplicative_update.py L90-L105", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/openfold_modules/triangular_multiplicative_update.py#L90-L105", "path": null, "line": null, "endLine": null, "icon": null}]}, "993463572": {"title": "\\text{LayerNorm}", "formula": "\\mathrm{LN}(x) = \\gamma \\odot \\frac{x - \\bar{x}}{\\sqrt{\\overline{(x-\\bar x)^2} + \\epsilon}} + \\beta", "description": "LayerNorm over the normalised axes, jointly when there are several: their mean is subtracted, the result is divided by its root mean square, and a learned gain and bias are applied per channel.", "references": []}, "1271978233": {"title": "-\\bar{x}", "formula": "y = -x |p|_{384}^{-1}", "description": "Minus the mean over the normalised axes, which the LayerNorm subtracts. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "897656143": {"title": "\\sigma", "formula": "y = \\sigma(x)", "description": "The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "139262877": {"title": "\\sigma", "formula": "y = \\sigma(x)", "description": "The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "1889108979": {"title": "\\text{LayerNorm}", "formula": "\\mathrm{LN}(x) = \\gamma \\odot \\frac{x - \\bar{x}}{\\sqrt{\\overline{(x-\\bar x)^2} + \\epsilon}} + \\beta", "description": "LayerNorm over the normalised axes, jointly when there are several: their mean is subtracted, the result is divided by its root mean square, and a learned gain and bias are applied per channel.", "references": []}, "1582592943": {"title": "-\\bar{x}", "formula": "y = -x |e|_{256}^{-1}", "description": "Minus the mean over the normalised axes, which the LayerNorm subtracts. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "1348224839": {"title": "\\sigma", "formula": "y = \\sigma(x)", "description": "The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "1269527888": {"title": "\\text{Triangle multiplication, incoming}", "formula": "\\Delta z_{ij} = \\sigma(W^{g}\\bar z_{ij} + b^{g}) \\odot \\Big(W^{z}\\,\\mathrm{LN}\\Big(\\sum_{k} a_{ki} \\odot b_{kj}\\Big) + b^{z}\\Big),\\quad a = (W^{a}_{p}\\bar z + b^{a}_{p}) \\odot \\sigma(W^{a}_{g}\\bar z + b^{a}_{g})", "description": "The incoming triangle multiplicative update (AlphaFold 2, Algorithm 12): the outgoing update with the two edges read into i and j, k\u2013i and k\
