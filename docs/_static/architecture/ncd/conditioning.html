daLN and every output gate of the trunk. The time embeddings of the CA coordinates and of the latents and the one-channel recycle flag \u03c1 are per design, and the three CATH labels \u03ba, of class, architecture and topology, are per token, each looked up in its own 32-wide table (6, 44 and 1473 rows, row 0 meaning no label). The code concatenates the 609 channels (256 + 256 + 1 + 3 \u00d7 32) and applies one linear map to 256; the figure draws the same map as one linear map per part, summed. Two SwiGLU transitions with no residual finish the vector. The feature factories build it with \u03c1 = 0 and drop it onto the tape slot c, from which every recycling cycle reads it. When recycle conditioning applies (at inference whenever R > 1, as condition_on_recycle_remaining is true by default; in training on half of the steps with R > 1), every cycle after the first rebuilds c with \u03c1 = 1. The flag is one channel wide, so it marks a later cycle and does not encode how many cycles remain.", "references": [{"label": "Open diagram: conditioning", "url": "conditioning.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "local_latents_transformer.py L77-L88", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/local_latents_transformer.py#L77-L88", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "local_latents_transformer.py L285-L287", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/local_latents_transformer.py#L285-L287", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L228-L266", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L228-L266", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L280-L312", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L280-L312", "path":
