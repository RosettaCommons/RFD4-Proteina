: 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\sigma\", \"description\": \"The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.\", \"fill_color\": null, \"references\": null, \"formula\": \"y = \\\\sigma(x)\", \"drawing\": {\"__registered__\": \"enum\", \"type\": \"BlockDrawing\", \"name\": \"BODY_IN_PLACE\"}}}, \"594910473\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 594910473, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{AdaLN}\", \"description\": \"Adaptive normalisation of the single representation. Each token is divided by its root mean square with no learned gain, then scaled by a sigmoid gate and shifted by a bias, both read off that token's own conditioning vector after an RMSNorm. The conditioning carries the two flow times and the CATH fold label, so every layer normalises differently at every noise level. Padding tokens are multiplied by zero at the end.\", \"fill_color\": \"#F3EFC6\", \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"Open diagram: AdaLN and the output gate\", \"url\": \"adaptive.html\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"adaptive_ln_scale.py L11-L38\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/adaptive_ln_scale.py#L11-L38\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"\\\\mathrm{AdaLN}(s, c) = \\\\mathrm{RMS}(s) \\\\odot \\\\sigma\\\\big(W^{\\\\gamma}\\\\,\\\\mathrm{RMS}(c) + b^{\\\\gamma}\\\\big) + W^{\\\\beta}\\\\,\\\\mathrm{RMS}(c)\", \"drawing\": null}}, \"311828024\": {\"__type__\": \"FreeNumeric\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"FreeNumeric\"}, \"_id\": 311828024, \"_name\": {\"__type__\": \"DynamicName\", \"body\": \"h\", \"subscript\": null, \"settings\": {\"__type__\": \"DynamicNameSettings\", \"bold\": false, \"overline\": false, \"absolute\": true, \"typewriter\": false, \"exponent_placement\": {\"__registered__\": \"enum\", \"type\": \"ExponentPlacement\", \"name\": \"SUBSCRIPT\"}}, \"code_form\": \"nheads_size\", \"exponent\": {\"__type__\": \"DynamicName\", \"body\": \"12\", \"subscript\": null, \"settings\": null, \"code_form\": null, \"exponent\": null}}}}, \"1199828169\": {\"__type__\": \"RawAxis\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"RawAxis\"}, \"_id\": 1199828169, \"_name\": {\"__type__\": \"DynamicName\", \"body\": \"h\", \"subscript\": null, \"settings\": {\"__type__\": \"DynamicNameSettings\", \"bold\": false, \"overline\": false, \"absolute\": false, \"typewriter\": false, \"exponent_placement\": {\"__registered__\": \"enum\", \"type\": \"ExponentPlacement\", \"name\": \"SUBSCRIPT\"}}, \"code_form\": \"nheads\", \"exponent\": {\"__type__\": \"DynamicName\", \"body\": \"12\", \"subscript\": null, \"settings\": null, \"code_form\": null, \"exponent\": null}}}, \"_size\": {\"__ref__\": 311828024}}, \"1221181031\": {\"__type__\": \"FreeNumeric\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"FreeNumeric\"}, \"_id\": 1221181031, \"_name\": {\"__type__\": \"DynamicName\", \"body\": \"d\", \"subscript\": null, \"settings\": {\"__type__\": \"DynamicNameSettings\", \"bold\": false, \"overline\": false, \"absolute\": true, \"typewriter\": false, \"exponent_placement\": {\"__registered__\": \"enum\", \"type\": \"ExponentPlacement\", \"name\": \"SUBSCRIPT\"}}, \"code_form\": \"dim_head_size\", \"exponent\": {\"__type__\": \"DynamicName\", \"body\": \"64\", \"subscript\": null, \"settings\": null, \"code_form\": null, \"exponent\": null}}}}, \"1687924407\": {\"__type__\": \"RawAxis\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"RawAxis\"}, \"_id\": 1687924407, \"_name\": {\"__type__\": \"DynamicName\", \"body\": \"d\", \"subscript\": null, \"settings\": {\"__type__\": \"DynamicNameSettings\", \"bold\": false, \"overline\": false, \"absolute\": false, \"typewriter\": false, \"exponent_placement\": {\"__registered__\": \"enum\", \"type\": \"ExponentPlacement\", \"name\": \"SUBSCRIPT\"}}, \"code_form\": \"dim_head\", \"exponent\": {\"__type__\": \"DynamicName\", \"body\": \"64\", \"subscript\": null, \"settings\": null, \"code_form\": null, \"exponent\": null}}}, \"_size\": {\"__ref__\": 1221181031}}, \"1778980957\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 1778980957, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\lvert d \\\\rvert^{-1/2} x\", \"description\": \"The attention logits are scaled by one over the square root of the head width, 1/8.\", \"fill_color\": null, \"references\": null, \"formula\": \"y = x / \\\\sqrt{|d|} = x / 8\", \"drawing\": {\"__registered__\": \"enum\", \"type\": \"BlockDrawing\", \"name\": \"BODY_IN_PLACE\"}}}, \"1225765605\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 1225765605, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\sigma\", \"description\": \"The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.\", \"fill_color\": null, \"references\": null, \"formula\": \"y = \\\\sigma(x)\", \"drawing\": {\"__registered__\": \"enum\", \"type\": \"BlockDrawing\", \"name\": \"BODY_IN_PLACE\"}}}, \"1479171621\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 1479171621, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{Pair-biased attention}\", \"description\": \"Gated multi-head self-attention over all tokens, 12 heads of width 64. The token is RMS-normalised again and projected to queries, keys, values and a gate, each with a bias. Queries and keys are RMS-normalised over all 768 channels jointly, before they are split into heads. Every head adds a bias read off the RMS-normalised pair representation by one linear map to its scaled dot-product logits, so the pair track steers which tokens attend to which. The attention output is gated by a sigmoid of the gate projection and projected back to 768 channels. With the PyTorch backends the pair bias of pairs that touch padding is replaced by \\u221210\\u2074, which drives their attention weight to zero; the default BioIR inference backend masks them with \\u221210\\u2076.\", \"fill_color\": \"#DDD7F2\", \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"Open diagram: pair-biased attention\", \"url\": \"attention.html\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"pair_bias_attn.py L51-L172\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_bias_attn.py#L51-L172\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"pair_bias_attn.py L275-L309\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_bias_attn.py#L275-L309\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"o_{hi} = \\\\sigma(g_{hi}) \\\\odot \\\\sum_{j} \\\\mathrm{softmax}_{j}\\\\Big(\\\\tfrac{q_{hi}\\\\cdot k_{hj}}{\\\\sqrt{|d|}} + W^{B}_{h}\\\\,\\\\mathrm{RMS}(z_{ij})\\\\Big)\\\\, v_{hj}\", \"drawing\": null}}, \"145766728\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 145766728, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\sigma\", \"description\": \"The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.\", \"fill_color\": null, \"references\": null, \"formula\": \"y = \\\\sigma(x)\", \"drawing\": {\"__registered__\": \"enum\", \"type\": \"BlockDrawing\", \"name\": \"BODY_IN_PLACE\"}}}, \"296701166\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 296701166, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{Output gate}\", \"description\": \"The result of a sublayer is multiplied channel by channel by a sigmoid of the raw conditioning before it is added back to the residual. The weight starts at zero and the bias at \\u22122, so a freshly initialised sublayer passes about 12 percent of its output and the trunk starts close to the identity.\", \"fill_color\": \"#F3EFC6\", \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"Open diagram: AdaLN and the output gate\", \"url\": \"adaptive.html\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"adaptive_ln_scale.py L41-L64\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/adaptive_ln_scale.py#L41-L64\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"\\\\mathrm{Gate}(y, c) = y \\\\odot \\\\sigma(W^{\\\\mathrm{gate}} c + b^{\\\\mathrm{gate}}),\\\\quad W^{\\\\mathrm{gate}} = 0,\\\\ b^{\\\\mathrm{gate}} = -2 \\\\text{ at initialisation}\", \"drawing\": null}}, \"719722199\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 719722199, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{Attention sublayer}\", \"description\": \"The residual update s + Gate(c) \\u2299 Attn(AdaLN(s, c), z). The pair representation z is read, never written, by the attention sublayer.\", \"fill_color\": \"#F1F2F5\", \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"attn_n_transition.py L76-L86\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/attn_n_transition.py#L76-L86\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"pair_bias_attn.py L294-L309\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_bias_attn.py#L294-L309\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": null, \"drawing\": null}}, \"1563255354\": {\"__type__\": \"FreeNumeric\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"FreeNumeric\"}, \"_id\": 1563255354, \"_name\": {\"__type__\": \"DynamicName\", \"body\": \"f\", \"subscript\": null, \"settings\": {\"__type__\": \"DynamicNameSettings\", \"bold\": false, \"overline\": false, \"absolute\": true, \"typewriter\": false, \"exponent_placement\": {\"__registered__\": \"enum\", \"type\": \"ExponentPlacement\", \"name\": \"SUBSCRIPT\"}}, \"code_form\": \"dim_inner_size\", \"exponent\": {\"__type__\": \"DynamicName\", \"body\": \"3072\", \"subscript\": null, \"settings\": null, \"code_form\": null, \"exponent\": null}}}}, \"1750216352\": {\"__type__\": \"RawAxis\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"RawAxis\"}, \"_id\": 175021 odeName": "pair_repr_dim_size", "uids": [1173470970]}, {"latex": "u", "text": "u", "size": 256, "codeName": "dim_cond", "sizeCodeName": "dim_cond_size", "uids": [1506389047]}, {"latex": "x", "text": "x", "size": null, "codeName": "tokens", "sizeCodeName": "tokens_size", "uids": [1759696249]}], "blocks": {"159982766": {"title": "\\text{Trunk layer}", "formula": null, "description": "One of the 14 trunk layers: an attention sublayer biased by the pair representation, then a SwiGLU transition sublayer, each wrapped in AdaLN, an output gate and a residual connection. The conditioning c is computed once per network evaluation; each recycling cycle reads it from the tape and the trunk passes it through every layer. The layer reads the pair representation and returns it unchanged; pair updates run between layers.", "references": [{"label": "Open diagram: one trunk layer", "url": "layer.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "attn_n_transition.py L94-L111", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/attn_n_transition.py#L94-L111", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "local_latents_transformer.py L98-L114", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/local_latents_transformer.py#L98-L114", "path": null, "line": null, "endLine": null, "icon": null}]}, "719722199": {"title": "\\text{Attention sublayer}", "formula": null, "description": "The residual update s + Gate(c) \u2299 Attn(AdaLN(s, c), z). The pair representation z is read, never written, by the attention sublayer.", "references": [{"label": "attn_n_transition.py L76-L86", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/attn_n_transition.py#L76-L86", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "pair_bias_attn.py L294-L309", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_bias_attn.py#L294-L309", "path": null, "line": null, "endLine": null, "icon": null}]}, "594910473": {"title": "\\text{AdaLN}", "formula": "\\mathrm{AdaLN}(s, c) = \\mathrm{RMS}(s) \\odot \\sigma\\big(W^{\\gamma}\\,\\mathrm{RMS}(c) + b^{\\gamma}\\big) + W^{\\beta}\\,\\mathrm{RMS}(c)", "description": "Adaptive normalisation of the single representation. Each token is divided by its root mean square with no learned gain, then scaled by a sigmoid gate and shifted by a bias, both read off that token's own conditioning vector after an RMSNorm. The conditioning carries the two flow times and the CATH fold label, so every layer normalises differently at every noise level. Padding tokens are multiplied by zero at the end.", "references": [{"label": "Open diagram: AdaLN and the output gate", "url": "adaptive.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "adaptive_ln_scale.py L11-L38", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/adaptive_ln_scale.py#L11-L38", "path": null, "line": null, "endLine": null, "icon": null}]}, "1467335032": {"title": "\\sigma", "formula": "y = \\sigma(x)", "description": "The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "1479171621": {"title": "\\text{Pair-biased attention}", "formula": "o_{hi} = \\sigma(g_{hi}) \\odot \\sum_{j} \\mathrm{softmax}_{j}\\Big(\\tfrac{q_{hi}\\cdot k_{hj}}{\\sqrt{|d|}} + W^{B}_{h}\\,\\mathrm{RMS}(z_{ij})\\Big)\\, v_{hj}", "description": "Gated multi-head self-attention over all tokens, 12 heads of width 64. The token is RMS-normalised again and projected to queries, keys, values and a gate, each with a bias. Queries and keys are RMS-normalised over all 768 channels jointly, before they are split into heads. Every head adds a bias read off the RMS-normalised pair representation by one linear map to its scaled dot-product logits, so the pair track steers which tokens attend to which. The attention output is gated by a sigmoid of the gate projection and projected back to 768 channels. With the PyTorch backends the pair bias of pairs that touch padding is replaced by \u221210\u2074, which drives their attention weight to zero; the default BioIR inference backend masks them with \u221210\u2076.", "references": [{"label": "Open diagram: pair-biased attention", "url": "attention.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "pair_bias_attn.py L51-L172", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_bias_attn.py#L51-L172", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "pair_bias_attn.py L275-L309", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_bias_attn.py#L275-L309", "path": null, "line": null, "endLine": null, "icon": null}]}, "1778980957": {"title": "\\lvert d \\rvert^{-1/2} x", "formula": "y = x / \\sqrt{|d|} = x / 8", "description": "The attention logits are scaled by one over the square root of the head width, 1/8.", "references": []}, "1225765605": {"title": "\\sigma", "formula": "y = \\sigma(x)", "description": "The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "296701166": {"title": "\\text{Output gate}", "formula": "\\mathrm{Gate}(y, c) = y \\odot \\sigma(W^{\\mathrm{gate}} c + b^{\\mathrm{gate}}),\\quad W^{\\mathrm{gate}} = 0,\\ b^{\\mathrm{gate}} = -2 \\text{ at initialisation}", "description": "The result of a sublayer is multiplied channel by channel by a sigmoid of the raw conditioning before it is added back to the residual. The weight starts at zero and the bias at \u22122, so a freshly initialised sublayer passes about 12 percent of its output and the trunk starts close to the identity.", "references": [{"label": "Open diagram: AdaLN and the output gate", "url": "adaptive.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "adaptive_ln_scale.py L41-L64", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/adaptive_ln_scale.py#L41-L64", "path": null, "line": null, "endLine": null, "icon": null}]}, "145766728": {"title": "\\sigma", "formula": "y = \\sigma(x)", "description": "The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "1790331460": {"title": "\\text{Transition sublayer}", "formula": null, "description": "The residual update s + Gate(c) \u2299 SwiGLU(AdaLN(s, c)).", "references": [{"label": "attn_n_transition.py L88-L92", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/attn_n_transition.py#L88-L92", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "seq_transition_af3.py L56-L68", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/seq_transition_af3.py#L56-L68", "path": null, "line": null, "endLine": null, "icon": null}]}, "1885724084": {"title": "\\text{SwiGLU transition}", "formula": "\\mathrm{SwiGLU}(s) = W^{D}\\big(\\mathrm{SiLU}(W^{G} s) \\odot W^{U} s\\big),\\quad |f| = 4|m|", "description": "The feed-forward block of every trunk layer and of every autoencoder layer, applied to each token on its own. The code holds W\u1d33 and W\u1d41 as one 768 to 6144 map and splits its output in two; the second half is the gate. The hidden width is 3072 and no map has a bias.", "references": [{"label": "Open diagram: SwiGLU transition", "url": "transition.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "seq_transition_af3.py L12-L42", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/seq_transition_af3.py#L12-L42", "path": null, "line": null, "endLine": null, "icon": null}
