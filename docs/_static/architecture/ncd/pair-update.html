me\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{Single-to-pair write}\", \"description\": \"The single track writes into the pair track once per pair update. Each token is LayerNormed and projected to two 384-wide vectors, and pair (i, j) receives the elementwise product of the first vector of token j and the second vector of token i. The code computes both projections as one 768 to 768 map and splits it, and adds the product to z (pair_write = hadamard) before the padding mask.\", \"fill_color\": \"#FDEFE2\", \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"pair_update.py L51-L58\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_update.py#L51-L58\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"pair_update.py L75-L78\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_update.py#L75-L78\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"z_{ij} \\\\leftarrow z_{ij} + \\\\big(W^{\\\\pi,1}\\\\,\\\\mathrm{LN}(s_{j})\\\\big) \\\\odot \\\\big(W^{\\\\pi,2}\\\\,\\\\mathrm{LN}(s_{i})\\\\big)\", \"drawing\": null}}, \"1094173796\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 1094173796, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"-\\\\bar{x}\", \"description\": \"Minus the mean over the normalised axes, which the LayerNorm subtracts. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.\", \"fill_color\": null, \"references\": null, \"formula\": \"y = -x |p|_{384}^{-1}\", \"drawing\": {\"__registered__\": \"enum\", \"type\": \"BlockDrawing\", \"name\": \"BODY_IN_PLACE\"}}}, \"2095712695\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 2095712695, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{LayerNorm}\", \"description\": \"LayerNorm over the normalised axes, jointly when there are several: their mean is subtracted, the result is divided by its root mean square, and a learned gain and bias are applied per channel.\", \"fill_color\": \"#EEF0F3\", \"references\": null, \"formula\": \"\\\\mathrm{LN}(x) = \\\\gamma \\\\odot \\\\frac{x - \\\\bar{x}}{\\\\sqrt{\\\\overline{(x-\\\\bar x)^2} + \\\\epsilon}} + \\\\beta\", \"drawing\": null}}, \"122689239\": {\"__type__\": \"FreeNumeric\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"FreeNumeric\"}, \"_id\": 122689239, \"_name\": {\"__type__\": \"DynamicName\", \"body\": \"e\", \"subscript\": null, \"settings\": {\"__type__\": \"DynamicNameSettings\", \"bold\": false, \"overline\": false, \"absolute\": true, \"typewriter\": false, \"exponent_placement\": {\"__registered__\": \"enum\", \"type\": \"ExponentPlacement\", \"name\": \"SUBSCRIPT\"}}, \"code_form\": \"tri_mult_c_size\", \"exponent\": {\"__type__\": \"DynamicName\", \"body\": \"256\", \"subscript\": null, \"settings\": null, \"code_form\": null, \"exponent\": null}}}}, \"1819515465\": {\"__type__\": \"RawAxis\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"RawAxis\"}, \"_id\": 1819515465, \"_name\": {\"__type__\": \"DynamicName\", \"body\": \"e\", \"subscript\": null, \"settings\": {\"__type__\": \"DynamicNameSettings\", \"bold\": false, \"overline\": false, \"absolute\": false, \"typewriter\": false, \"exponent_placement\": {\"__registered__\": \"enum\", \"type\": \"ExponentPlacement\", \"name\": \"SUBSCRIPT\"}}, \"code_form\": \"tri_mult_c\ air_transition_hidden_size", "uids": [597254695]}, {"latex": "m", "text": "m", "size": 768, "codeName": "token_dim", "sizeCodeName": "token_dim_size", "uids": [1418916817]}, {"latex": "p", "text": "p", "size": 384, "codeName": "pair_repr_dim", "sizeCodeName": "pair_repr_dim_size", "uids": [1173470970]}, {"latex": "x", "text": "x", "size": null, "codeName": "tokens", "sizeCodeName": "tokens_size", "uids": [1759696249]}], "blocks": {"1582913200": {"title": "\\text{Pair update}", "formula": null, "description": "One update of the pair representation from the single representation: the single-to-pair write, then the outgoing and the incoming triangle multiplication and the pair transition, each added to the residual and followed by the pair padding mask. Seven pair updates run in the trunk, after layers 0, 2, 4, 6, 8, 10 and 12. The single representation is read, not written, so the block returns only the pair representation. The output projections of both triangle updates (W\u1dbb) and of the pair transition (W\u00b2) start at zero, so a fresh pair update only writes the rank-one product.", "references": [{"label": "Open diagram: pair update", "url": "pair-update.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "pair_update.py L60-L91", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_update.py#L60-L91", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "local_latents_transformer.py L126-L147", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/local_latents_transformer.py#L126-L147", "path": null, "line": null, "endLine": null, "icon": null}]}, "1839687178": {"title": "\\text{Single-to-pair write}", "formula": "z_{ij} \\leftarrow z_{ij} + \\big(W^{\\pi,1}\\,\\mathrm{LN}(s_{j})\\big) \\odot \\big(W^{\\pi,2}\\,\\mathrm{LN}(s_{i})\\big)", "description": "The single track writes into the pair track once per pair update. Each token is LayerNormed and projected to two 384-wide vectors, and pair (i, j) receives the elementwise product of the first vector of token j and the second vector of token i. The code computes both projections as one 768 to 768 map and splits it, and adds the product to z (pair_write = hadamard) before the padding mask.", "references": [{"label": "pair_update.py L51-L58", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_update.py#L51-L58", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "pair_update.py L75-L78", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/pair_update.py#L75-L78", "path": null, "line": null, "endLine": null, "icon": null}]}, "421306981": {"title": "\\text{LayerNorm}", "formula": "\\mathrm{LN}(x) = \\gamma \\odot \\frac{x - \\bar{x}}{\\sqrt{\\overline{(x-\\bar x)^2} + \\epsilon}} + \\beta", "description": "LayerNorm over the normalised axes, jointly when there are several: their mean is subtracted, the result is divided by its root mean square, and a learned gain and bias are applied per channel.", "references": []}, "501209106": {"title": "-\\bar{x}", "formula": "y = -x |m|_{768}^{-1}", "description": "Minus the mean over the normalised axes, which the LayerNorm subtracts. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "1720569514": {"title": "\\text{Triangle multiplication, outgoing}", "formula": "\\Delta z_{ij} = \\sigma(W^{g}\\bar z_{ij}) \\odot W^{z}\\,\\mathrm{LN}\\Big(\\sum_{k} a_{ik} \\odot b_{jk}\\Big),\\quad a = W^{a}_{p}\\bar z \\odot \\sigma(W^{a}_{g}\\bar z),\\ \\bar z = \\mathrm{LN}(z)", "description": "The outgoing triangle multiplicative update of AlphaFold 2 (Algorithm 11). The pair representation is LayerNormed to z\u0304 and projected twice to 256 channels, each projection multiplied elementwise by a sigmoid gate of its own. Pair (i, j) then sums, over every token k
