t gate}", "formula": null, "description": "How the conditioning c enters every sublayer of the trunk. AdaLN normalises the single representation and scales and shifts it by maps of the RMS-normalised conditioning; the output gate multiplies the sublayer's result by a sigmoid of the raw conditioning before it is added to the residual. Every trunk layer uses two of each, one per sublayer, each with its own weights.", "references": [{"label": "adaptive_ln_scale.py L11-L38", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/adaptive_ln_scale.py#L11-L38", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "adaptive_ln_scale.py L41-L64", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/adaptive_ln_scale.py#L41-L64", "path": null, "line": null, "endLine": null, "icon": null}]}, "1650905010": {"title": "\\text{AdaLN}", "formula": "\\mathrm{AdaLN}(s, c) = \\mathrm{RMS}(s) \\odot \\sigma\\big(W^{\\gamma}\\,\\mathrm{RMS}(c) + b^{\\gamma}\\big) + W^{\\beta}\\,\\mathrm{RMS}(c)", "description": "Adaptive normalisation of the single representation. Each token is divided by its root mean square with no learned gain, then scaled by a sigmoid gate and shifted by a bias, both read off that token's own conditioning vector after an RMSNorm. The conditioning carries the two flow times, the recycle flag and the CATH fold label, so every layer normalises differently at every noise level. Padding tokens are multiplied by zero at the end.", "references": [{"label": "Open diagram: AdaLN and the output gate", "url": "adaptive.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "adaptive_ln_scale.py L11-L38", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/adaptive_ln_scale.py#L11-L38", "path": null, "line": null, "endLine": null, "icon": null}]}, "1765195617": {"title": "\\sigma", "formula": "y = \\sigma(x)", "description": "The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}, "1204016423": {"title": "\\text{Output gate}", "formula": "\\mathrm{Gate}(y, c) = y \\odot \\sigma(W^{\\mathrm{gate}} c + b^{\\mathrm{gate}}),\\quad W^{\\mathrm{gate}} = 0,\\ b^{\\mathrm{gate}} = -2 \\text{ at initialisation}", "description": "The result of a sublayer is multiplied channel by channel by a sigmoid of the raw conditioning before it is added back to the residual. The weight starts at zero and the bias at \u22122, so a freshly initialised sublayer passes about 12 percent of its output and the trunk starts close to the identity.", "references": [{"label": "Open diagram: AdaLN and the output gate", "url": "adaptive.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "adaptive_ln_scale.py L41-L64", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/adaptive_ln_scale.py#L41-L64", "path": null, "line": null, "endLine": null, "icon": null}]}, "1539805373": {"title": "\\sigma", "formula": "y = \\sigma(x)", "description": "The logistic sigmoid. An elementwise map. Every value x of the input is replaced by the value y the formula gives at it.", "references": []}}, "expansions": {"0": {"operator": "Normalize", "latex": "RMSNorm", "formula": "\\mathrm{RMSNorm}_{u}(x) = x \\left(\\frac{1}{|u|}\\sum_{i_{u} \\in u} x[i_{u}]^{2} + \\epsilon\\right)^{-1/2} \\odot \\gamma", "description": "Each value divided by the root of the mean of the squares over the normalised axes, with the epsilon of the operator added under the root. The gain, which is one learned weight per position of the normalised axes, multiplies the result where the operator declares one, and the bias is added after it where the operator declares one.", "expansion": "{\"uid_repository\": {\"32791590\": {\"__type__\": \"FreeNumeric\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \
