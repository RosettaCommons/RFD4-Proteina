1862614300, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{Temperature-scaled velocity}\", \"description\": \"The velocity recomputed from a score scaled by r(t), which rises from 1 at t = 0 to k at t = 1: k = 16 and \\u03c3\\u209c\\u209b\\u1d63 = 3 for the CA coordinates, k = 4 and \\u03c3\\u209c\\u209b\\u1d63 = 12 for the latents. Scaling the score sharpens the distribution being sampled late in the trajectory.\", \"fill_color\": null, \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"rdn_flow_matcher.py L553-L569\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L553-L569\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"rdn_flow_matcher.py L531-L533\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L531-L533\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"\\\\tilde v = \\\\frac{x_t + (1-t)\\\\,r(t)\\\\,\\\\nabla\\\\log p_t}{t},\\\\quad r(t) = \\\\frac{\\\\sigma_{\\\\mathrm{tsr}}^{2}\\\\mathrm{SNR}(t) + 1}{\\\\sigma_{\\\\mathrm{tsr}}^{2}\\\\mathrm{SNR}(t)/k + 1},\\\\ \\\\mathrm{SNR}(t) = \\\\frac{t^{2}}{(1-t)^{2}}\", \"drawing\": {\"__registered__\": \"enum\", \"type\": \"BlockDrawing\", \"name\": \"BODY_IN_PLACE\"}}}, \"1273605317\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 1273605317, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{Gaussian noise}\", \"description\": \"Fresh standard Gaussian noise of the shape of the wire it produces.\", \"fill_color\": null, \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"rdn_flow_matcher.py L537-L539\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L537-L539\", \"path\": null, \"line\": null, \"end_line\": null}, {\"__type__\": \"CodeReference\", \"label\": \"encoder.py L147-L147\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/encoder.py#L147-L147\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"\\\\varepsilon \\\\sim \\\\mathcal{N}(0, I)\", \"drawing\": {\"__registered__\": \"enum\", \"type\": \"BlockDrawing\", \"name\": \"BODY_IN_PLACE\"}}}, \"2025385824\": {\"__type__\": \"BlockTag\", \"uid\": {\"__type__\": \"UID\", \"_type\": {\"__registered__\": \"type\", \"repr\": \"BlockTag\"}, \"_id\": 2025385824, \"_name\": null}, \"repetition\": {\"__type__\": \"Integer\", \"_value\": 1}, \"aesthetics\": {\"__type__\": \"BlockAesthetics\", \"title\": \"\\\\text{Euler-Maruyama update}\", \"description\": \"One Euler-Maruyama step of the stochastic sampler. g\\u209c is the noise schedule (1/(t + 0.01) for CA, a tangent schedule for latents) divided by r(t)\\u00b2, and \\u03b7 is sc_scale_noise, 1 for both modalities, which scales the variance of the noise. Near both ends of the trajectory the step is deterministic: on the default grids the CA steps 1 to 30 and the latent steps 6 to 57 are stochastic.\", \"fill_color\": null, \"references\": [{\"__type__\": \"CodeReference\", \"label\": \"rdn_flow_matcher.py L525-L550\", \"url\": \"https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L525-L550\", \"path\": null, \"line\": null, \"end_line\": null}], \"formula\": \"x_{t+\\\\Delta t} = x_t + \\\\big(\\\\tilde v + g_t\\\\,r(t)\\\\,\\\\nabla\\\\log p_t\\\\big)\\\\Delta t + \\\\sqrt{2\\\\,g_t\\\\,\\\\eta\\\\,\\\\Delta t}\\\\;\\\\varepsilon \\\\ \\\\text{ for } 0.02 \\\\le t \\\\le 0.95,\\\\qquad x_{t+\\\\Delta t} = x_t + \\\\tilde v\\\\,\\\\Delta t \\ t)\\,r(t)\\,\\nabla\\log p_t}{t},\\quad x_{t+\\Delta t} = x_t + \\big(\\tilde v + g_t\\,r(t)\\,\\nabla\\log p_t\\big)\\,\\Delta t + \\sqrt{2 g_t \\eta\\,\\Delta t}\\,\\varepsilon", "description": "One step of the vf_tsr sampler for one modality. The predicted velocity is turned into the score, the gradient of log p\u209c; the score is scaled by the temperature-scaling ratio r(t) of temporal score rescaling (TSR), which rises from 1 at t = 0 to k at t = 1 (k = 16 for CA, 4 for latents), and the result is converted back into a velocity. Between t = 0.02 and t = 0.95 the step adds a Langevin term: the scaled score times g\u209c, the noise schedule divided by r(t)\u00b2, and fresh Gaussian noise of variance 2 g\u209c \u03b7 \u0394t, with \u03b7 = 1 for both modalities. Outside that window the step is a plain Euler step on the scaled velocity. The emit mask is applied after every step.", "references": [{"label": "Open diagram: one integration step", "url": "integrator.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "rdn_flow_matcher.py L525-L550", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L525-L550", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "rdn_flow_matcher.py L553-L569", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L553-L569", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "product_space_flow_matcher.py L809-L855", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/product_space_flow_matcher.py#L809-L855", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "inference_base.yaml L17-L98", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/configs/generation/inference_base.yaml#L17-L98", "path": null, "line": null, "endLine": null, "icon": null}]}, "1128890198": {"title": "\\text{Velocity to score}", "formula": "\\nabla\\log p_t = \\frac{t\\,\\hat v - x_t}{1 - t}", "description": "The score of the noised distribution implied by the predicted velocity, for the linear interpolant with unit Gaussian noise.", "references": [{"label": "rdn_flow_matcher.py L572-L620", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L572-L620", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "rdn_flow_matcher.py L531-L531", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L531-L531", "path": null, "line": null, "endLine": null, "icon": null}]}, "1862614300": {"title": "\\text{Temperature-scaled velocity}", "formula": "\\tilde v = \\frac{x_t + (1-t)\\,r(t)\\,\\nabla\\log p_t}{t},\\quad r(t) = \\frac{\\sigma_{\\mathrm{tsr}}^{2}\\mathrm{SNR}(t) + 1}{\\sigma_{\\mathrm{tsr}}^{2}\\mathrm{SNR}(t)/k + 1},\\ \\mathrm{SNR}(t) = \\frac{t^{2}}{(1-t)^{2}}", "description": "The velocity recomputed from a score scaled by r(t), which rises from 1 at t = 0 to k at t = 1: k = 16 and \u03c3\u209c\u209b\u1d63 = 3 for the CA coordinates, k = 4 and \u03c3\u209c\u209b\u1d63 = 12 for the latents. Scaling the score sharpens the distribution being sampled late in the trajectory.", "references": [{"label": "rdn_flow_matcher.py L553-L569", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L553-L569", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "rdn_flow_matcher.py L531-L533", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L531-L533", "path": null, "line": null, "endLine": null, "icon": null}]}, "1273605317": {"title": "\\text{Gaussian noise}", "formula": "\\varepsilon \\sim \\mathcal{N}(0, I)", "description": "Fresh standard Gaussian noise of the shape of the wire it produces.", "references": [{"label": "rdn_flow_matcher.py L537-L539", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L537-L539", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "encoder.py L147-L147", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/encoder.py#L147-L147", "path": null, "line": null, "endLine": null, "icon": null}]}, "2025385824": {"title": "\\text{Euler-Maruyama update}", "formula": "x_{t+\\Delta t} = x_t + \\big(\\tilde v + g_t\\,r(t)\\,\\nabla\\log p_t\\big)\\Delta t + \\sqrt{2\\,g_t\\,\\eta\\,\\Delta t}\\;\\varepsilon \\ \\text{ for } 0.02 \\le t \\le 0.95,\\qquad x_{t+\\Delta t} = x_t + \\tilde v\\,\\Delta t \\text{ otherwise}", "description": "One Euler-Maruyama step of the stochastic sampler. g\u209c is the noise schedule (1/(t + 0.01) for CA, a tangent schedule for latents) divided by r(t)\u00b2, and \u03b7 is sc_scale_noise, 1 for both modalities, which scales the variance of the noise. Near both ends of the trajectory the step is deterministic: on the default grids the CA steps 1 to 30 and the latent steps 6 to 57 are stochastic.", "references": [{"label": "rdn_flow_matcher.py L525-L550", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/flow_matching/rdn_flow_matcher.py#L525-L550", "path": null, "line": null, "endLine": null, "icon": null}]}}}}</script>
