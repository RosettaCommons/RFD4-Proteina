escription": "The encoder turns a known structure into 16 latent channels per residue or nucleotide. It reads 329 channels per token: the token type, the absolute atom37 coordinates in nm with their mask, the same coordinates relative to the token's CA, and the chain index. Twelve layers run on a 768-wide single track, and a LayerNorm and one linear map give the mean and log scale of a Gaussian, from which one sample is drawn. Flow training uses that sample as the clean latent x\u2081, drawn afresh at every step. Atomized ligand atoms get no latent. 128.0 million parameters.", "references": [{"label": "Open diagram: the encoder", "url": "ae-encoder.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "encoder.py L113-L162", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/encoder.py#L113-L162", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "feature_factory.py L434-L470", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/feature_factory.py#L434-L470", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "2026_09_04_release.yaml L45-L57", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/configs/releases/ae/2026_09_04_release.yaml#L45-L57", "path": null, "line": null, "endLine": null, "icon": null}]}, "1189861884": {"title": "\\text{Autoencoder trunk}", "formula": null, "description": "Twelve autoencoder layers, each with its own weights, of width 768 with 12 heads. There is no pair track and no pair update.", "references": [{"label": "encoder.py L139-L145", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/encoder.py#L139-L145", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "decoder.py L185-L191", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/decoder.py#L185-L191", "path": null, "line": null, "endLine": null, "icon": null}]}, "357936630": {"title": "\\text{Autoencoder layer}", "formula": null, "description": "One layer of the autoencoder: gated multi-head attention without a pair bias, then a SwiGLU transition of hidden width 3072, each behind a LayerNorm and followed by a per-channel gate, with residual connections. It is the module of a flow-model trunk layer built with LayerNorms instead of RMSNorms and without a pair bias. Its conditioning is identically zero and LayerNorm(0) returns the bias c\u2080 of the conditioning norm, so AdaLN becomes LN(s) \u2299 \u03c3(W\u1d5e c\u2080 + b\u1d5e) + W\u1d5d c\u2080, a LayerNorm with a constant gain and shift, and the output gate becomes a constant g\u1d4d\u1d43\u1d57\u1d49 = \u03c3(b\u1d4d\u1d43\u1d57\u1d49) per channel.", "references": [{"label": "Open diagram: an autoencoder layer", "url": "ae-layer.html", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "encoder.py L72-L88", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/partial_autoencoder/encoder.py#L72-L88", "path": null, "line": null, "endLine": null, "icon": null}, {"label": "attn_n_transition.py L94-L111", "url": "https://github.com/RosettaCommons/RFD4-Proteina/blob/main/src/rfproteina/nn/modules/attn_n_transition.py#L94-L111", "path": null, "line": null, "endLine": null, "icon": null}]}, "772154953": {"title": "\\text{LayerNorm}", "formula": "\\mathrm{LN}(x) = \\gamma \\odot \\frac{x - \\bar{x}}{\\sqrt{\\overline{(x-\\bar x)^2} + \\epsilon}} + \\beta", "description": "LayerNorm over the normalised axes, jointly when there are several: their mean is subtracted, the result is divided by its root mean square, and a learned gain and bias are applied per channel.", "references": []}, "1480141680": {"title": "-\\bar{x}", "formula": "y = -x |m|_{768}^{-1}", "description": "Minus the mean over the normalised axes, which the LayerNorm subtracts. An elementwise map. Every value x of the
